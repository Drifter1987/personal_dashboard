<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="orange" data-digits="western">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#2A2A2E">
<title>Home Dashboard v2.6.0</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.gold-api.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.coingecko.com https://api.frankfurter.dev https://api.aladhan.com https://api.github.com https://hn.algolia.com https://huggingface.co https://*.workers.dev; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https://home-dashboard-5ma.pages.dev; font-src 'none'; object-src 'none'; base-uri 'self'">
<style>
:root{--r:16px}
[data-theme="dark"]{--bg:#232327;--bg2:#2A2A2E;--card:#313136;--card2:#3A3A40;--text:#E6E6EA;--text2:#FFFFFF;--muted:#9B9BA3;--line:#45454C;--ok:#34C759;--bad:#FF6B6B;--shadow:0 8px 28px rgba(0,0,0,.45)}
[data-theme="midnight"]{--bg:#0B1020;--bg2:#101731;--card:#16204A;--card2:#1D2A5E;--text:#C9D6FF;--text2:#FFFFFF;--muted:#8291C4;--line:#2A3872;--ok:#34C759;--bad:#FF6B6B;--shadow:0 10px 32px rgba(3,6,20,.55)}
[data-theme="forest"]{--bg:#0F1A14;--bg2:#14231B;--card:#1B2E23;--card2:#23392C;--text:#C9E8D3;--text2:#FFFFFF;--muted:#87A891;--line:#2C4A38;--ok:#4ADE80;--bad:#FF6B6B;--shadow:0 8px 28px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#F6EDDD;--bg2:#FFF8EC;--card:#FFFDF6;--card2:#F9EEDC;--text:#6B4226;--text2:#8A5A33;--muted:#856239;--line:#E4D3B8;--ok:#15763A;--bad:#C0392B;--shadow:0 8px 24px rgba(120,85,40,.15)}
[data-accent="orange"]{--ac:#FF8C42}[data-accent="amber"]{--ac:#E8A100}[data-accent="coral"]{--ac:#FF6B6B}[data-accent="teal"]{--ac:#1FA89B}[data-accent="violet"]{--ac:#8B5CF6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--ac)}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 480px at 90% -5%,rgba(255,140,66,.13),transparent 60%),radial-gradient(700px 520px at -10% 35%,rgba(255,140,66,.07),transparent 60%)}
[data-bg="none"] .bgfx{background:var(--bg)}
[data-bg="grid"] .bgfx{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/34px 100%;opacity:.35}
[data-bg="dots"] .bgfx{background:radial-gradient(var(--line) 1.5px,transparent 1.5px) 0 0/26px 26px;opacity:.5}
[data-bg="waves"] .bgfx{background:repeating-radial-gradient(circle at 50% 120%,transparent 0 46px,var(--line) 46px 47px);opacity:.3}
[data-bg="aurora"] .bgfx{background:radial-gradient(700px 420px at 20% -5%,rgba(31,168,155,.22),transparent 60%),radial-gradient(800px 500px at 85% 15%,rgba(139,92,246,.18),transparent 65%),radial-gradient(900px 520px at 45% 110%,rgba(52,199,89,.12),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-top));padding-top:10px}
.toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;white-space:nowrap}
.ver{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted)}
.searchwrap{position:relative;flex:1 1 160px;min-width:0}
#search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:var(--text)}
#searchResults{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;display:none;z-index:40;box-shadow:var(--shadow)}
#searchResults button{display:block;width:100%;text-align:start;background:transparent;border:0;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--text)}
#searchResults button:last-child{border-bottom:0}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--text)}
#editBtn.on{background:var(--ac);color:#000;border-color:transparent}
/* Phone pager progress: a line along the sticky topbar's bottom edge, filling 1/5 -> 5/5 so the
   current section stays legible mid-swipe. Absolute, so the phone layout's own computed heights
   and swipe spacer are untouched. Hidden until the phone layout turns it on. */
.pbar{display:none;position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--line)}
.pfill{position:absolute;inset-inline-start:0;top:0;bottom:0;width:20%;background:var(--ac)}
.pagelabel{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.tabbar{display:none}
@media(max-width:899px){
 .tabbar{display:flex;gap:5px;justify-content:flex-start;margin:10px 8px 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
 .tabbar::-webkit-scrollbar{display:none}
 /* 44px is the smallest a finger taps reliably: the label stays 13px, the target does not. */
 .tabbar button{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:transparent;border:0;border-radius:10px;padding:7px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13px}
 .tabbar button.on{background:var(--ac);color:#000}
 .pbar{display:block}
}
#pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(100vh - 150px);height:calc(100dvh - 150px)}
.page{min-width:100%;scroll-snap-align:start;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.page-inner{display:grid;gap:12px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
.pagehead{display:none}
@media(min-width:900px){
 .page-inner{grid-template-columns:repeat(2,1fr)}
 #pages{display:block;overflow:visible;height:auto;scroll-snap-type:none}
 .page{display:none;min-width:0;overflow:visible;border-top:0;padding:20px 16px 8px}
 .page.active{display:block}
 .pagelabel,.pagehead{display:none}
 /* a board needs board width: in a 2- or 3-column grid the kanban card is only as wide as one
    cell (~360px at 1440), which squeezes the three columns to ~100px and the card's own
    ◀ ▶ ✕ row no longer fits its box. Spanning the row costs one row of flow and nothing else. */
 #w_kanban{grid-column:1/-1}
 .tabbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px auto 0;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:1100px}
 .tabbar button{background:transparent;border:0;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
 .tabbar button.on{background:var(--ac);color:#000}
}
@media(min-width:1300px){.page-inner{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%),var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);scroll-margin-top:96px;transition:transform .15s ease,box-shadow .15s ease}
[data-theme="light"] .card{background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0) 45%),var(--card)}
@media(hover:hover){.card:hover{transform:translateY(-2px)}}
.card.flash{outline:3px solid var(--ac)}
.card h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.mini{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--text2);min-height:26px;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.big{font-size:34px;font-weight:800;letter-spacing:.5px}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{padding:10px 4px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.pill{font-size:11px;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0 2px}
.why span{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
/* The AI card's free-allowance column: each row is a two-column grid, so every figure
   lines up on one edge, and tabular numerals keep the digits in step down the column. */
.list li.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.qta{font-size:11.5px;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--bg2);color:var(--text2);min-width:66px}
.qta.none{color:var(--muted);border-style:dashed;background:transparent}
.qta.once{color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;color:var(--text)}
textarea{min-height:70px;resize:vertical}
/* The label on an accent fill is the one ink that has to survive every palette: .btn, the
   active tab pill and #editBtn.on all share it, and the accent is user-selectable. #000 clears
   4.5:1 on all five accents in all four themes - _check.mjs measures exactly that, and the
   light theme's own green was darkened because its up/down figures sat at 4.13:1. */
.btn{background:var(--ac);border:0;color:#000;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -8px var(--ac)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;cursor:pointer;font-size:16px;line-height:1;color:transparent}
.circle.done{background:var(--ok);border-color:var(--ok);color:#fff}
.strike{text-decoration:line-through;opacity:.65}
canvas{width:100%;height:180px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modalback.open{display:flex}
.modal{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modalback{align-items:center}.modal{border-radius:18px}}
.modal h3{margin:0 0 10px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.checkline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;display:none;z-index:80;font-weight:700;max-width:92vw}
html[dir="rtl"] .page-inner{direction:rtl}
@media(max-width:899px){
 #pages{height:auto;padding-bottom:12px}
 .page{min-width:100%}
 .swipe-spacer{height:calc(100dvh - 190px);pointer-events:none}
}
@media(min-width:900px){.swipe-spacer{display:none}}
#pagelabel{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.setrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.switch{width:52px;height:30px;border-radius:20px;border:1px solid var(--line);background:var(--card2);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"]{background:var(--ac)}
.switch[aria-checked="true"]::after{left:25px;background:#fff}
html[dir="rtl"] .switch::after{left:auto;right:3px}
html[dir="rtl"] .switch[aria-checked="true"]::after{right:25px;left:auto}
.wicon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--ac),rgba(0,0,0,.28));color:#fff;font-size:16px;flex:none;box-shadow:0 4px 10px -4px var(--ac)}
.wctl{display:none}
body.editing .wctl{display:inline-block}
.drag-handle{display:none;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);cursor:grab;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
body.editing .drag-handle{display:inline-flex}
body.editing .page{user-select:none;-webkit-user-select:none}
body.editing .card{-webkit-touch-callout:none}
.card.dragging{animation:none;opacity:.94;box-shadow:0 18px 44px rgba(0,0,0,.45);z-index:70}
.drop-ph{border:2px dashed var(--ac);border-radius:20px;background:rgba(127,127,127,.10)}
@keyframes jiggle{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
body.editing .card{animation:jiggle .4s ease-in-out infinite}
body.editing .card:nth-child(2n){animation-delay:.1s}
body.editing .card:nth-child(3n){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){body.editing .card{animation:none}}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.two .kv,.two .crows>li{border-top:1px solid var(--line)}
.two>:first-child{column-rule:0}
.two>div:first-child,.two>ul:first-child{border-right:1px solid var(--line);padding-right:12px}
html[dir="rtl"] .two>div:first-child,html[dir="rtl"] .two>ul:first-child{border-right:0;border-left:1px solid var(--line);padding-right:0;padding-left:12px}
@media(max-width:560px){.two{column-gap:10px}}
.crows{margin:6px 0 0;padding:0;list-style:none}
.crows li{padding:7px 0;display:flex;gap:8px;align-items:center}
.crows .cname{font-weight:700;flex:1;min-width:0}
.crows .cpx{font-variant-numeric:tabular-nums}
.dotline{stroke-dasharray:2 6;stroke-linecap:round}
.xhair{position:absolute;top:0;bottom:0;width:1px;pointer-events:none}
.xhair::before{content:"";position:absolute;top:0;bottom:0;left:0;border-left:2px dotted var(--muted)}
.xhair .xdot{position:absolute;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg2);box-sizing:content-box}
.xhair .xlab{position:absolute;left:8px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:11px;color:var(--text);white-space:nowrap}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:inline-block;width:min(78vw,320px)}
.qrbox canvas{background:#fff;border:0;width:100%;height:auto;display:block}
.qrinline{width:100%;max-width:360px;display:block;margin-top:8px}
.ctl{font-size:12px;color:var(--muted);margin-top:6px}
/* Kanban: three columns across a desktop card, stacked on a narrow screen so the cards keep
   a readable width instead of three slivers. */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media(max-width:640px){.kb{grid-template-columns:minmax(0,1fr)}}
.kbcol{display:flex;flex-direction:column;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:64px}
.kbcol.kbdrop{border-color:var(--ac);border-style:dashed}
.kbhead{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.kbcount{margin-inline-start:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.kbcard{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px 8px 32px;cursor:grab;-webkit-user-select:none;user-select:none}
.kbcard.kbdrag{opacity:.5}
.kbcard:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* small in the corner as asked, but the ::after gives the finger a full 44px to land on */
.kbdel{position:absolute;inset-inline-end:6px;bottom:5px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:11px;line-height:1;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.kbdel::after{content:"";position:absolute;inset:-10px}
.kbdel:hover,.kbdel:focus-visible{color:var(--bad);border-color:var(--bad)}
.kbedit{position:absolute;inset-inline-end:38px;bottom:5px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:11px;line-height:1;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.kbedit:hover,.kbedit:focus-visible{color:var(--ac);border-color:var(--ac)}
/* what a card knows beyond its title, on the card: who owns it, where it happens, when it is due */
.kbmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.kbmeta span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
/* the card dialog: two columns of fields, one full-width notes box, stacking on a phone */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.frow .field{margin:8px 0}
.fwide{grid-column:1/-1}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.kbghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.95;box-shadow:var(--shadow)}
.kbtext{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.kbempty{color:var(--muted);font-size:12px}
/* Phone layout: keep the top bar on two tidy rows and let the section tabs scroll sideways
   instead of forcing the page wider than the screen. */
@media(max-width:599px){
 .ver{display:none}
 .searchwrap{flex:1 1 100%;order:10}
 .toprow{gap:6px}
 .iconbtn{padding:8px 9px}
 .big{font-size:30px}
}
.big{font-variant-numeric:tabular-nums}
/* ===== interface pass: theme chrome, focus, motion, and the 2026 cards =====
   color-scheme paints scrollbars, form controls and the canvas in the theme the page is
   actually in; every control keeps a visible :focus-visible ring; reduced-motion users get
   the whole app with movement dialled to zero. */
:root{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
.skip{position:absolute;inset-inline-start:8px;top:-64px;z-index:90;background:var(--ac);color:#000;font-weight:700;padding:10px 14px;border-radius:0 0 12px 12px}
.skip:focus{top:0}
/* a jump to a card must clear the sticky topbar, and the palette's ring value needs a text
   twin: the ring itself is decoration, so the remaining time also exists as real text. */
.card{scroll-margin-top:86px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button,.mini,.iconbtn,.btn,input,select,textarea,a{touch-action:manipulation}
.card h2,.modal h3{text-wrap:balance}
.modal{overscroll-behavior:contain}
/* command palette: a top sheet that a keyboard can drive - type, arrow, enter - and that
   never lets a scroll leak to the page behind it. */
.palback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:10vh 12px 12px;overscroll-behavior:contain}
.palback.open{display:flex}
.pal{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:70vh;max-height:70dvh;overflow:auto;padding:12px;overscroll-behavior:contain}
.palrow{display:flex;gap:8px;align-items:center}
.palic{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--muted);flex:none}
#palInput{flex:1;min-width:0}
#palList{margin-top:8px}
.palrow2{display:flex;gap:8px;align-items:center;width:100%;text-align:start;background:transparent;border:0;border-radius:12px;padding:10px;color:var(--text);cursor:pointer}
.palrow2:hover,.palrow2[aria-selected="true"]{background:var(--card2)}
.palic2{width:22px;text-align:center;flex:none}
.palsub{color:var(--muted);font-size:12px;margin-inline-start:auto;white-space:nowrap}
.palempty{color:var(--muted);font-size:13px;padding:10px}
.palhint{font-size:11.5px;color:var(--muted);padding:8px 2px 0}
/* focus timer: one ring, a time, and three buttons - no motion required to read it. */
.focuswrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fring{width:112px;height:112px;flex:none}
.fring circle{fill:none;stroke-width:9}
.fring .ftrack{stroke:var(--line)}
.fring .fval{stroke:var(--ac);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.fmid{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ftimes{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
/* habit streaks: seven day-dots per habit, today ringed */
.hrow{display:flex;gap:8px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.hname{font-weight:700;min-width:0;overflow-wrap:anywhere;flex:1}
.hdots{display:flex;gap:4px}
.hdot{width:14px;height:14px;border-radius:5px;border:1px solid var(--line);background:transparent}
.hdot.on{background:var(--ac);border-color:var(--ac)}
.hdot.today{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ac)}
.hstreak{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* notes */
.nrow{padding:9px 2px;border-top:1px solid var(--line)}
.ntext{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.nmeta{display:flex;gap:8px;align-items:center;margin-top:5px}
.npin{font-size:11.5px;color:var(--muted)}
/* weather: the hourly strip scrolls inside its own card, never the page */
.wxstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px;overscroll-behavior-x:contain}
.wxstrip::-webkit-scrollbar{display:none}
.wxh{flex:none;min-width:46px;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.wxh .whh{font-size:11px;color:var(--muted);white-space:nowrap}
.wxh .wht{font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.wxdet{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wxdet span{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
@media(hover:hover){
 .btn:hover{filter:brightness(1.06)}
 .btn.ghost:hover,.btn.danger:hover,.mini:hover,.iconbtn:hover{border-color:var(--ac);color:var(--ac)}
 .mini:active,.iconbtn:active,.btn:active{transform:translateY(1px)}
}
@media(max-width:599px){.palbtn{display:none}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 html{scroll-behavior:auto!important}
 body.editing .card{animation:none}
}
</style>

};const CHANGELOG = [
{v:"2.6.0", d:"2026-10-17", en:"Five additions and a design pass. A command palette opens on Ctrl-K or ⌘K: one list that filters every card, every section and your own tasks, notes, habits and countdowns, arrows move and Enter runs, and each action calls the button it mirrors so the palette cannot drift from the UI. A focus timer counts down on a ring from an end timestamp, so a reload or a locked phone cannot lose a session, and it keeps a per-day session count. Habits carry seven day-dots and a streak that survives a missed today. Notes are one-line captures with pin, copy and delete. Weather now leads with what it feels like, humidity, wind, sunrise and sunset, then the next twelve hours as a strip that scrolls inside its own card. And the interface pass: color-scheme so scrollbars and form controls follow the theme, one visible focus ring, a skip link, reduced-motion support, balanced headline wrapping, dialogs that keep their scroll, a skip-to-content link, and small row buttons raised to a 26px hit target. A kanban card is now a record rather than a line of text: Add card opens a dialog with assignee, responsible, start date, due date, project, location, email, phone and a notes box, every card shows its key facts, Enter on a focused card opens the same dialog, and the CSV export gained the matching columns.", ar:"خمس إضافات ومرور على التصميم. لوحة أوامر تُفتح بمفتاح التحكم وحرف الكاف: قائمة واحدة ترشّح كل بطاقة وكل قسم ومهامك وملاحظاتك وعاداتك وعدّاداتك، والأسهم تتحرّك وأدخل ينفّذ، وكل أمر يستدعي الزر نفسه فلا تختلف اللوحة عمّا تراه. ومؤقّت تركيز يعدّ تنازليًا على حلقة من وقت انتهاء محفوظ، فلن يضيع جلسةً تحديث الصفحة ولا قفل الهاتف، ويحفظ عدد جلسات كل يوم. والعادات لها سبع نقاط يومية وسلسلة أيام تبقى حتى لو فاتك اليوم. والملاحظات سطور سريعة مع تثبيت ونسخ وحذف. والطقس يبدأ بالإحساس والرطوبة والريح والشروق والغروب، ثم الساعات الاثنتي عشرة القادمة في شريط يتحرّك داخل بطاقته. ثم مرور على الواجهة: نظام ألوان يجعل الأشرطة والحقول تتبع السمة، وحلقة تركيز واحدة ظاهرة، ورابط تجاوز، ودعم تقليل الحركة، وتوازن العناوين، ونوافذ تحفظ تمريرها، ورابط تجاوز إلى المحتوى، ورفع أزرار الصفوف الصغيرة إلى هدف لمس 26 بكسل. وبطاقة كانبان أصبحت سجلًا لا سطرًا: زر إضافة بطاقة يفتح نافذة تحمل المكلَّف بالتنفيذ والمسؤول وتاريخ البدء وتاريخ الاستحقاق والمشروع والموقع والبريد الإلكتروني ورقم الهاتف وصندوق ملاحظات، وكل بطاقة تعرض أهمّ حقولها، ومفتاح أدخل على البطاقة المركّزة يفتح النافذة نفسها، وتصدير البيانات صار يحمل الأعمدة المطابقة."},
{v:"2.5.0", d:"2026-10-17", en:"A new card this time: the Planner gains a Kanban board — the same tasks list seen as work in progress, To do, Doing and Done, each column counting what it holds, an add row on top, and the done flag still deciding completion, so the board, today's tasks and the CSV export cannot disagree. Moving a card is a drag: pointer events cover mouse, pen and finger — a mouse picks a card up on the first real move, a finger has to rest on it for 180ms first, so a quick swipe across a card still scrolls the page — and once lifted the card follows the pointer through capture, the column beneath marks itself as the drop target, and the page under it is held still. A focused card also answers the arrow keys, direction following the reading direction in Arabic, so the board works with no pointer at all. Every card carries a small ✕ of its own: delete, confirmed like everything else, with the hit area stretched to a thumb-sized 44px. On phones the topbar gains a section progress line in place of the dots — filling 1/5 to 5/5 by distance travelled so the current section stays legible mid-swipe, and naming the section beside the number; the tabs below scroll sideways, keep the active one centred and stand 44px tall, and both the fill and the centring follow the right-to-left strip in Arabic. Also in this release: the ink on every accent fill is black, one label that clears AA on all five accents in all four themes; the light theme's up-figure green and muted ink were darkened to the same measure; the phone top bar reflows into two tidy rows; and Auto theme follows a live OS light/dark switch without a reload.", ar:"بطاقة جديدة هذه المرة: يكسب المخطّط لوحة كانبان — قائمة المهام نفسها معروضة كعمل قيد التقدّم، للتنفيذ وقيد التنفيذ وتم، كل عمود يعدّ ما فيه، وسطر إضافة في الأعلى، ويبقى حقل done هو الفيصل في الإنجاز فلا تختلف اللوحة ولا مهام اليوم ولا تصدير CSV. ونقل البطاقة سحب: أحداث المؤشر تكفي الفأرة والقلم والإصبع — الفأرة ترفع البطاقة عند أول حركة حقيقية، والإصبع يستقر عليها ١٨٠ مللي ثانية أولاً، فتبقى السحبة السريعة عبر البطاقة تمريراً للصفحة — وبعد رفعها تتبع البطاقة المؤشر عبر احتجاز المؤشر، ويعلّم العمود الواقع تحتها نفسه هدفاً للإسقاط، وتُثبَّت الصفحة تحته. والبطاقة المركَّز عليها تجيب أيضاً بمفتاحَي السهمين، والاتجاه يتبع اتجاه القراءة في العربية، فيعمل اللوح بلا مؤشر إطلاقاً. وعلى كل بطاقة زر ✕ صغير خاص بها: حذف مؤكَّد كغيره، ومساحة لمسه ممتدة إلى ٤٤ بكسل بحجم الإصبع. وعلى الهواتف يكسب الشريط العلوي خط تقدّم للأقسام بدل النقاط — يمتلئ من ١/٥ إلى ٥/٥ بمقدار المسافة المقطوعة فيبقى القسم الحالي واضحاً وسط السحبة، ويسمّي القسم إلى جانب الرقم؛ والتبويبات تحته تنزلق أفقياً وتُبقي النشطة في وسطها وترتفع ٤٤ بكسل، والامتلاء والتوسيط كلاهما يتبع الشريط من اليمين إلى اليسار في العربية. وفي هذا الإصدار أيضاً: الحبر على كل تعبئة باللون الأساسي أسود، كلمة واحدة تجتاز AA على الألوان الخمسة في المظاهر الأربعة؛ وأُغمق أخضر الأرقام الصاعدة في المظهر الفاتح وحبره الباهت إلى المعيار نفسه؛ ويعيد شريط الهاتف ترتيب نفسه في سطرين مرتّبين؛ و«التلقائي» يتبع تبديل النظام بين الفاتح والداكن دون إعادة تحميل."},
{v:"2.4.0", d:"2026-10-14", en:"No new card this time — this release is the page and the Worker doing less work for the same result. The clock rebuilt its whole card every second (five elements created and thrown away, plus a fresh date formatter each tick, ~75us of it measured in the browser); it now builds once and writes only the digits that changed, through one cached formatter per language. Every figure in the coin, currency and metals tables went through Number.toLocaleString, which builds a formatter on every call: memoised, the same output costs ~1.1us against ~36us per row, and eastern digits are mapped by code point — 3.4x faster than the string replace, and no allocation. On the API side the Worker hands the edge-cache write to ctx.waitUntil instead of holding the response for it, and serves a cached payload as a stream instead of decoding the JSON to a string and re-encoding it, so neither the write nor a re-encode sits between the request and its bytes.", ar:"لا بطاقة جديدة هذه المرة — هذا الإصدار هو الصفحة والوركر وهما يفعلان عملاً أقل بالنتيجة نفسها. كانت الساعة تعيد بناء بطاقتها كاملة كل ثانية (خمسة عناصر تُنشأ وتُهمل، ومنسّق تاريخ جديد في كل نبضة، نحو ٧٥ ميكروثانية قيست في المتصفح)؛ صارت الآن تُبنى مرة واحدة وتكتب ما تغيّر من الأرقام فقط، عبر منسّق واحد مخزّن لكل لغة. وكل رقم في جداول العملات الرقمية والعملات والمعادن كان يمرّ بـ Number.toLocaleString التي تبني منسّقاً في كل نداء: بعد تخزينه صار المخرج نفسه يكلّف نحو ١٫١ ميكروثانية مقابل نحو ٣٦ لكل سطر، والأرقام الشرقية تُحوَّل بترميز الحرف — أسرع ٣٫٤ مرة من الاستبدال النصي وبلا أي تخصيص ذاكرة. وفي واجهة الوركر يُسلَّم كتابة المخزّن الوسيط إلى ctx.waitUntil بدل تعليق الاستجابة لها، وتُقدَّم الحمولة المخزّنة كتدفق بدل فك ترميز JSON إلى نص وإعادة ترميزه، فلا الكتابة ولا إعادة الترميز تقع بين الطلب وبايتاته."},
{v:"2.3.0", d:"2026-10-14", en:"Coins price in any currency now, not just the dollar: the Time-travel chart's currency list serves both views, so LBP or EUR against BTC is two picks like any pair, and the Worker crosses a coin through its currency's USD leg - the caption says so, and the browser fallback crosses it too when the ECB can. The Currencies card gains LBP, a currency the ECB never publishes, read from the Worker's new /api/rates on the same USD legs; it works as the base of the table as well as a quoted row, rates smaller than a hundredth stay readable instead of rounding to 0, and the rows that come from outside the ECB's table are named under it. In Arabic mode everything the app words itself is Arabic: the quote of the day has its own edition and keeps the same daily quote in either language, metal and prayer names, weather codes, the hijri month, AM/PM, the calendar's weekday initials, the countdown and theme labels and the chart's own notes all follow the language - and the topbar button rebuilds the page, so nothing is left behind in the language it was drawn in.", ar:"العملات الرقمية تُسعَّر الآن بأي عملة لا بالدولار وحده: قائمة عملات مخطط السفر عبر الزمن تخدم العرضين، فاختيار LBP أو EUR مقابل BTC اختياران كأي زوج، ويتقاطع الووركر العملة الرقمية عبر ساق عملتها بالدولار — ويقول التعليق ذلك، ويتقاطعها أيضاً بديل المتصفح حين يستطيع عبر المركزي الأوروبي. وبطاقة العملات تكسب LBP، وهي عملة لا ينشرها المركزي الأوروبي أبداً، مقروءة من /api/rates الجديد في الوركر على ساقَي الدولار نفسيهما؛ وتعمل أساساً للجدول وسطراً معروضاً في الوقت نفسه، والأسعار الأصغر من جزء من المئة تبقى مقروءة بدل أن تُقرَّب إلى صفر، والصفوف الآتية من خارج جدول المركزي الأوروبي يُسمّى مصدرها تحته. وفي الوضع العربي صار كل ما تصوغه اللوحة نفسها عربياً: اقتباس اليوم له نسخته العربية ويبقى الاقتباس نفسه في اللغتين، وتمشي مع اللغة أسماء المعادن والصلوات وأكواد الطقس والشهر الهجري وصباحاً/مساءً وأحرف أيام التقويم ووسوم العدّادات والمظهر وتعليقات المخطط — وزر اللغة في الشريط يعيد بناء الصفحة، فلا يبقى شيء بلغة رُسم بها."},
  {v:"2.2.0", d:"2026-10-14", en:"The Time-travel chart now plots any currency against any other, not only against the base currency in Settings: the FX view carries a base picker of its own beside the symbol picker, so EUR/SAR or AED/PKR is two choices instead of a settings change. When no source names a pair directly, the Worker crosses it through USD — each leg read from the source that actually publishes it, the ECB daily rates or the weekly Yahoo pair — the caption says crossed through USD, and the dates follow the coarser leg so a weekly rate is never restamped onto daily ones.", ar:"مخطط السفر عبر الزمن يرسم الآن أي عملة مقابل أي أخرى، لا مقابل العملة الأساسية في الإعدادات فحسب: أضفنا إلى عرض العملات حقل أساس خاصّ به إلى جانب حقل الرمز، فصارت EUR/SAR أو AED/PKR خيارَين مباشرين لا تغييراً في الإعدادات. وإذا لم يسمّ أي مصدر الزوج مباشرة يتقاطعه الووركر عبر الدولار — يقرأ كل ساق من المصدر الذي ينشرها فعلاً: أسعار البنك المركزي الأوروبي اليومية أو زوج ياهو الأسبوعي — ويقول التعليق متقاطعاً عبر الدولار، وتتبع التواريخ الساق الأبطأ حتى لا تُعاد قيم أسبوعية على تواريخ يومية."},
  {v:"2.1.0", d:"2026-10-14", en:"Free image & video tools: thirteen generators, each showing the free allowance its own vendor states — the number, the unit it counts in (credits, fast tokens, stamina, images) and how often it resets, so \"30 credits a week\" and \"10 images every 3 hours\" stop looking like the same deal. The figures carry the date they were checked and every row opens the vendor's own page. The search box finds them too: it matches word by word instead of demanding the exact phrase, so \"free image tools\" or \"daily limit\" returns each matching tool with its allowance — and any AI headline that states a quota. Also repairs a stray comma that had broken the page script.", ar:"أدوات الصور والفيديو المجانية: ثلاثة عشر مولّداً، لكل منها الحصة المجانية التي يعلنها مزوّدها — الرقم، والوحدة التي يُعدّ بها (أرصدة، توكنات، طاقة، صور)، ودورة تجدّدها، فلا تعود «٣٠ رصيداً أسبوعياً» و«١٠ صور كل ٣ ساعات» يبدوان صفراً واحداً. الأرقام تحمل تاريخ مراجعتها وكل سطر يفتح صفحة المزوّد. وصندوق البحث يعثر عليها أيضاً: صار يطابق كلمة كلمة بدل أن يشترط العبارة كاملة، فـ\"free image tools\" أو \"daily limit\" تُرجع كل أداة مطابقة بحصتها — وأي عنوان يذكر حصته. ويُصلَّح أيضاً فاصلة زائدة كانت أوقفت سكربت الصفحة."},
  {v:"2.0.0", d:"2026-10-12", en:"The Time-travel chart now covers the whole market, not a sample of it: every metal the IMF prices monthly (15 series \u2014 the precious five plus aluminium, nickel, zinc, lead, tin, iron ore, molybdenum, manganese, cobalt and uranium), every currency the ECB publishes (29, plus the regional currencies it never quotes \u2014 SAR, AED, QAR, KWD, OMR, BHD, JOD, EGP, PKR and their neighbours \u2014 served from the weekly Yahoo pair), and any of the 100 largest coins by market cap, each drawn from its own first print. Where a series starts later than 1992 the caption says when: molybdenum from 2010, a Gulf currency from 2003, a coin from its launch day. Copper and cobalt are quoted per pound like the Metals card, everything else in the unit the source states.", ar:"مخطط السفر عبر الزمن يغطي الآن السوق كاملاً وليس عيّنة منه: كل معدن يسعّره صندوق النقد شهرياً (١٥ سلسلة \u2014 المعادن النفيسة الخمسة إضافة إلى الألومنيوم والنيكل والزنك والرصاص والقصدير وخام الحديد والموليبدينوم والمنجنيز والكوبالت واليورانيوم)، وكل عملة ينشرها البنك المركزي الأوروبي (٢٩، مع العملات الخليجية والعربية التي لا ينشرها \u2014 الريال السعودي والدرهم والقطري والدينار الكويتي والعُماني والبحريني والأردني والجنيه المصري والروبية الباكستانية وجيرانها \u2014 من زوج ياهو الأسبوعي)، وأي من أكبر ١٠٠ عملة رقمية من حيث القيمة السوقية، كل واحدة مرسومة من أول تداول لها. وإذا بدأت السلسلة بعد ١٩٩٢ يذكر التعليق متى: الموليبدينوم من ٢٠١٠، وعملة خليجية من ٢٠٠٣، وعملة رقمية من يوم إطلاقها. والنحاس والكوبالت يُعرضان لكل رطل كما في بطاقة المعادن، والباقي بالوحدة التي يذكرها المصدر."},
  {v:"1.9.0", d:"2026-10-12", en:"The Time-travel chart now shows the whole history instead of one year: every currency, metal and coin is drawn from the first date free data exists — metals from 1992 (IMF monthly), currencies from the euro's first day in 1999 (ECB), each coin from its own first print (BTC 2014, ETH/XRP 2017, SOL 2020) — with the source, the exact date range and the number of points printed under the chart. Copper is quoted per pound like the Metals card, a log-scale toggle keeps a 200x run readable, and if the Worker is unreachable the card falls back to the last year of ECB and CoinGecko data and labels that run so a short series is never mistaken for the real one. The caption is explicit when the canvas cannot hold every print: a currency series with 7,140 daily rates says so and reports the 1,400 drawn, and the currency count beside the picker counts only the ones you can choose.", ar:"مخطط السفر عبر الزمن يعرض الآن التاريخ كاملاً بدل سنة واحدة: كل عملة ومعدن وعملة رقمية تُرسم من أول تاريخ تتوفر فيه بيانات مجانية — المعادن من ١٩٩٢ (شهري من صندوق النقد)، العملات من أول يوم لليورو عام ١٩٩٩ (البنك المركزي الأوروبي)، وكل عملة رقمية من أول تداول لها (بتكوين ٢٠١٤، إيثيريوم/ريبيل ٢٠١٧، سولانا ٢٠٢٠) — مع ذكر المصدر والمدى الزمني الدقيق وعدد النقاط أسفل المخطط. والنحاس يُعرض لكل رطل كما في بطاقة المعادن، وزر المقياس اللوغاريتمي يحافظ على وضوح مدى يتغير ٢٠٠ ضعف، وإذا تعذّر الوصول إلى الووركر تعود البطاقة إلى آخر سنة من بيانات المركزي الأوروبي وCoinGecko وتُوسم بذلك حتى لا تُخلط بسلسلة كاملة. ويذكر التعليق بصراحة عندما لا تتسع اللوحة لكل النقاط: سلسلة بعملة تحمل ٧١٤٠ سعراً يومياً تقول ذلك وتذكر ١٤٠٠ مرسومة، وعدد العملات بجانب القائمة يعدّ ما يمكن اختياره فقط."},
  {v:"1.8.0", d:"2026-10-11", en:"The AI card now shows what each free item actually gives you, in one column you can read down: a single parser turns \"50 images per day\", \"600 requests/month\" and \"20 free credits\" into the same shape, so a daily and a monthly allowance sit on one scale — the stated amount, its unit, and the equivalent per-day figure (600 a month reads 20/day). One-off grants stay marked as such instead of pretending to be a daily rate, the exact phrase each figure came from is in the tooltip, and an item that states no allowance shows a dash rather than a guess.", ar:"بطاقة الذكاء الاصطناعي تعرض الآن ما تمنحه كل أداة مجانية فعلاً، في عمود واحد يمكن قراءته من أعلى إلى أسفل: محلّل واحد يحوّل «٥٠ صورة يومياً» و«٦٠٠ طلب شهرياً» و«٢٠ رصيداً مجانياً» إلى الشكل نفسه، فيقف الحد اليومي والشهري على مقياس واحد — الكمية والوحدة ومعادلها اليومي (٦٠٠ شهرياً تُقرأ ٢٠/يوم). والمنح لمرة واحدة تبقى موسومة كذلك بدل أن تُعرض كحد يومي، والصيغة الأصلية لكل رقم في التلميح، والعنصر الذي لا يذكر حصة يظهر بشرطة بدل التخمين."},
  {v:"1.7.0", d:"2026-10-11", en:"The AI card now says why each item is on it: every headline carries small labels naming the ranking rules that matched it — open weights, runs locally, free daily limit, free, just released, image/video — so the order is explained rather than implied. Tap a headline to see the same reasons in the reader. Also fixes the news cache: the four News cards share one stored record, and a card that finished its refresh last could overwrite another card's fresh data, which silently re-enabled refetching on every load.", ar:"بطاقة الذكاء الاصطناعي توضح الآن سبب وجود كل خبر: كل عنوان يحمل وسوماً صغيرة بأسماء قواعد الترتيب التي انطبقت عليه — أوزان مفتوحة، يعمل محلياً، حد يومي مجاني، مجاني، صدر حديثاً، صور/فيديو — فيصبح الترتيب مفسَّراً لا مُخمَّناً. اضغط على العنوان لترى الأسباب نفسها في نافذة القراءة. وأُصلح أيضاً خلل في التخزين المؤقت: البطاقات الأربع تتشارك سجلاً واحداً، وكانت البطاقة التي تنتهي أخيراً تكتب فوق بيانات بطاقة أخرى — وهو ما كان يعطّل التخزين المؤقت بصمت ويعيد جلب الأخبار في كل تحميل."},
  {v:"1.6.3", d:"2026-10-11", en:"If the Worker is unreachable, the AI card no longer falls back to general AI commentary: it reads releases straight from the browser instead — trending open-weight models from Hugging Face and freshly launched free tools from Show HN — and caches them like the other cards.", ar:"إذا تعذر الوصول إلى الووركر، فإن بطاقة الذكاء الاصطناعي لن تعود إلى أخبار عامة، بل تقرأ الإصدارات مباشرة من المتصفح: أحدث النماذج المفتوحة من Hugging Face وأدوات مجانية جديدة من Show HN، وتخزنها مثل باقي البطاقات."},
  {v:"1.6.2", d:"2026-10-11", en:"The AI card is now a releases feed: trending open-weight models from Hugging Face plus Qwen, Ollama, ComfyUI, Replicate, Google AI and a llama.cpp release channel — ranked so new models, free tools and things you can run locally come first, with business and opinion pieces pushed down.", ar:"بطاقة الذكاء الاصطناعي أصبحت قائمة إصدارات: أحدث النماذج المفتوحة من Hugging Face مع Qwen وOllama وComfyUI وReplicate وجوجل وقناة إصدارات llama.cpp — مرتّبة بحيث تأتي النماذج الجديدة والأدوات المجانية وما يمكن تشغيله محلياً أولاً، مع تراجع أخبار الأعمال والآراء."},
  {v:"1.6.1", d:"2026-10-11", en:"Quote of the day now turns over exactly once every 24 hours — by itself, at your local midnight — and no longer depends on when the page was loaded or refreshed. The Worker URL field is now an optional override of the built-in API address instead of a saved copy of it.", ar:"اقتباس اليوم يتغيّر مرة واحدة كل ٢٤ ساعة تلقائياً عند منتصف ليلك المحلي، ولم يعد مرتبطاً بوقت تحميل الصفحة أو تحديثها. وحقل رابط الـWorker أصبح تجاوزاً اختيارياً للعنوان المدمج بدل نسخة محفوظة منه."},
  {v:"1.6.0", d:"2026-10-11", en:"All four News cards fixed: the automotive feeds were dead and the feed parser was dropping CDATA titles, so Automotive, AI, Finance and GitHub now show real headlines — GitHub read straight from api.github.com — on a 1-hour cache with a per-card refresh that really refetches.", ar:"تم إصلاح بطاقات الأخبار الأربع: روابط أخبار السيارات كانت معطلة وكان المحلّل يُسقط عناوين CDATA، والآن تعرض بطاقات السيارات والذكاء الاصطناعي والمال وجيت‌هَب عناوين حقيقية — وجيت‌هَب يُقرأ مباشرة من api.github.com — مع تخزين مؤقت ساعة وتحديث حقيقي لكل بطاقة."},
  {v:"1.5.0", d:"2026-10-11", en:"Dark Grey reworked as the default theme plus two new looks (Midnight, Forest), a selectable background (glow, plain, grid, dots, waves, aurora), and a QR & Share card in Tools: the code fills its frame, and you can save it as an image or share the app via WhatsApp, Instagram, Snapchat, email, copy-link or the native share sheet.", ar:"إعادة تصميم الثيم الرمادي الداكن الافتراضي مع مظهرين جديدين (منتصف الليل، الغابة)، خلفية قابلة للاختيار (توهج، سادة، شبكة، نقاط، موجات، شفق)، وبطاقة رمز QR ومشاركة في الأدوات: الرمز يملأ إطاره، ويمكن حفظه كصورة أو مشاركة التطبيق عبر واتساب وإنستغرام وسناب شات والبريد ونسخ الرابط."},
  {v:"1.4.0", d:"2026-10-11", en:"Dedicated tappable tabs on every screen (swipe still works on iOS), Install-on-Home-Screen + QR code, top-5 metals in two columns (adds Copper), top-8 currencies table, two-column crypto, per-card refresh, moving crosshair on the chart, city remembered until you change it.", ar:"تبويبات قابلة للنقر على جميع الشاشات (السحب يعمل في iOS)، تثبيت على الشاشة الرئيسية + رمز QR، المعادن الخمسة في عمودين (مع النحاس)، جدول أفضل ٨ عملات، العملات الرقمية في عمودين، زر تحديث لكل قسم، مؤشر متحرك على المخطط، المدينة محفوظة حتى تغييرها."},
  {v:"1.3.0", d:"2026-10-11", en:"Metals now take your own API key (BYOK): pick one of 10 price providers and paste a key in Settings — the key stays in this browser only.", ar:"المعادن الآن تدعم مفتاحك الخاص (BYOK): اختر أحد ١٠ مزوّدي أسعار وألصق المفتاح في الإعدادات — يبقى المفتاح في هذا المتصفح فقط."},
  {v:"1.2.0", d:"2026-10-11", en:"Desktop gets a dedicated tab bar: one section at a time instead of one long scrolling page. Mobile keeps swipeable pages with dots.", ar:"إضافة شريط تبويبات مخصص لسطح المكتب: قسم واحد في كل مرة بدلاً من التمرير الطويل. الجوال يبقى بتنقل قابل للسحب."},
  {v:"1.1.0", d:"2026-10-11", en:"Stylish refresh (glassy cards, icons, glow) + iPhone-style jiggle and drag to reorder via long-press or pencil button.", ar:"تحديث جمالي (بطاقات زجاجية وأيقونات) + اهتزاز وسحب لإعادة الترتيب مثل الآيفون عبر الضغطة المطولة أو زر القلم."},
  {v:"1.0.0", d:"2026-10-10", en:"First release: 5 pages, live weather/crypto/FX/metals*, 8 headlines, prayer times, countdowns, tasks, local calendar, search, EN/AR, export/import. *Metals needs Worker URL + secret.", ar:"الإصدار الأول: ٥ صفحات، طقس وأسعار حية، ٨ عناوين، مواقيت صلاة، عدّادات، مهام، تقويم محلي، بحث، عربي/إنجليزي، تصدير/استيراد. *المعادن تحتاج Worker."}
];

/* Eastern numerals are mapped by code point ('0' 0x30 -> '٠' 0x660), so the western path
   returns the string untouched and the eastern path allocates neither a lookup table nor a
   callback per call — this runs on every figure the page prints, and once a second for the
   clock. */
const EASTERN_CC=1584;
function digits(s){s=String(s);if(settings.digits!=="eastern")return s;let out="",hit=false;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c>=48&&c<=57){out+=String.fromCharCode(c+EASTERN_CC);hit=true}else out+=s[i]}return hit?out:s}
function esc(s){return String(s==null?"":s)}

/* One Intl.NumberFormat per fraction-digit budget. Number#toLocaleString builds a formatter
   on every call, and this runs once per row in the coin, FX and metals tables: measured at
   ~36us against ~1.1us for the memoised formatter, with identical output. */
const NF={};
function num(n,d){if(n==null||isNaN(n))return"—";const k=d==null?2:d;const f=NF[k]||(NF[k]=new Intl.NumberFormat("en-US",{maximumFractionDigits:k,minimumFractionDigits:0,useGrouping:true}));return digits(f.format(Number(n)))}

/* ============ quote of the day ============ */
/* One quote per LOCAL day. It is pinned in pd_quote for the whole day and swapped by a
   timer just after local midnight, so reloading, extra tabs and the card's ⟳ button never
   change it mid-day. The index is derived from the calendar date itself, so every device
   on the same local day shows the same quote. */
function qDay(d){return d.getFullYear()*372+d.getMonth()*31+d.getDate()}
function qPinned(){const day=qDay(new Date());const cur=store.get("pd_quote",null);if(!cur||cur.day!==day||typeof cur.i!=="number"){const q={day:day,i:((day%QUOTES.length)+QUOTES.length)%QUOTES.length,ts:Date.now()};store.set("pd_quote",q);return q}return cur}
function renderQuote(){const el=$("#wb_quote");if(!el)return;el.innerHTML="";const src=(settings.lang==="ar"&&QUOTES_AR.length)?QUOTES_AR:QUOTES;const q=src[((qPinned().i%src.length)+src.length)%src.length];const b=document.createElement("blockquote");b.style.margin="0";const p=document.createElement("p");p.textContent="“"+q[0]+"”";b.appendChild(p);const f=document.createElement("footer");f.className="muted";f.textContent="— "+q[1];b.appendChild(f);el.appendChild(b);armQuoteTimer()}
/* fires a few seconds after local midnight, then re-arms itself for the following day */
function armQuoteTimer(){clearTimeout(armQuoteTimer._t);const now=new Date();const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,5);armQuoteTimer._t=setTimeout(renderQuote,Math.max(5000,next-now))}

async function loadFx(host){
  const out=host.querySelector("div:last-child")||host;
  const base=settings.base;
  const key="pd_fx_v2_"+base;
  const c=store.get(key,null);
  if(c&&c.data&&Date.now()-c.ts<30*60*1000){paintFx(out,base,c.data,c.src||{},true);return}
  let rates=null,src={};
  /* The ECB's own table first: it needs no Worker, and it carries the majors the card leads
     with, so the card still works with the Worker unreachable. */
  if(ECB_BASES.indexOf(base)>=0){try{const r=await fetch("https://api.frankfurter.dev/v1/latest?from="+base);const j=await r.json();rates=j.rates||{}}catch(e){}}
  /* Then whatever is still missing - LBP always, and every row when the base itself sits
     outside the ECB's set - from the Worker, on the same USD legs the chart crosses. */
  const want=FX_BASES().concat(TOP8).filter((x,i,a)=>x!==base&&a.indexOf(x)===i&&!(rates&&rates[x]!=null));
  const wu=(settings.workerUrl||CONFIG.WORKER_URL).replace(/\/$/,"");
  if(wu&&want.length){try{const r=await fetch(wu+"/api/rates?base="+encodeURIComponent(base)+"&to="+want.join(","));const j=await r.json();
    rates=rates||{};Object.keys(j.rates||{}).forEach(k=>{if(j.rates[k]!=null&&rates[k]==null)rates[k]=j.rates[k]});
    Object.keys(j.sources||{}).forEach(k=>{if(src[k]==null)src[k]=j.sources[k]})}catch(e){}}
  if(rates&&Object.keys(rates).length){store.set(key,{ts:Date.now(),data:rates,src:src});paintFx(out,base,rates,src,false)}
  else if(c)paintFx(out,base,c.data,c.src||{},true);
  else{out.innerHTML="";const p=document.createElement("p");p.className="muted";p.textContent=t("noData");out.appendChild(p)}
}
const TOP8=["EUR","GBP","JPY","CHF","AUD","CAD","CNY","HKD"]; /* Frankfurter/ECB majors; shown in two ranked columns */
/* The base picker offers the ECB's currencies plus LBP: the ECB table has no LBP at all, so
   it is read as a USD leg through the Worker's /api/rates, which crosses it the same way the
   chart does. ECB_BASES is the part of that list the ECB itself publishes. */
const ECB_BASES=["USD","EUR","GBP","JPY","CHF","AUD","CAD","CNY"];
const FX_EXTRA=["LBP"];
const FX_BASES=()=>ECB_BASES.concat(FX_EXTRA);
/* Frankfurter publishes the ECB's currency list; kept for a day so the chart's select can
   offer all of them without a request per paint. The list arrives asynchronously, so a cold
   paint shows the majors and the callback restocks the select when the full list lands. */
/* The crypto card tracks the top 8 by market cap; the chart can show any of the top 100, so
   it asks CoinGecko for the wider list once a day and keeps the card's 8 as the fallback
   when that call is rate-limited or the page is offline. */

function coinList(cb){

  const c=store.get("pd_coin_list",null);

  const fresh=c&&c.ts&&Date.now()-c.ts<86400000&&c.list&&c.list.length;

  if(!fresh)fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1").then(r=>r.ok?r.json():null).then(j=>{

    if(!Array.isArray(j))return;

    const list=j.filter(x=>x&&x.symbol&&x.id).map(x=>({s:String(x.symbol).toUpperCase(),id:x.id,n:x.name}));

    if(!list.length)return;store.set("pd_coin_list",{ts:Date.now(),list:list});if(cb)cb(list)

  }).catch(()=>{});

  return fresh?c.list:null

}

function fxList(cb){
  const c=store.get("pd_fx_list",null);
  const fresh=c&&c.ts&&Date.now()-c.ts<86400000&&c.list&&c.list.length;
  if(!fresh)fetch("https://api.frankfurter.dev/v1/currencies").then(r=>r.ok?r.json():null).then(j=>{
    if(!j||typeof j!=="object")return;const list=Object.keys(j).sort();store.set("pd_fx_list",{ts:Date.now(),list:list});if(cb)cb(list)

   The Worker parses and normalises every allowance, so the page only words it — except
   when the Worker cannot be reached and the fallback below builds the card from the

/* ─────────────── free-tier quota ───────────────
 * The card answers "what can I use today, and how much of it do I get for free?", so the
 * free allowance is the one number a reader compares between items — and it arrives as
 * prose, in whatever unit and whatever period the announcement happened to use ("50 images
 * per day", "600 requests/month", "20 free credits", "1 million free credits"). Parsed and
 * normalised once here, every item's allowance lands in the page's quota column in the same
 * shape, and a per-day figure is what makes a daily allowance and a monthly one comparable
 * at a glance. Nothing is inferred: an amount needs a real unit (a version number, a model
 * size or a price is not a quota), a period-less amount is only believed for credits, and
 * the exact phrase the figure came from rides along as `raw` for the tooltip.
 */
const Q_UNITS = [
  ["images", /^(?:images?|imgs?|pictures?|photos?|renders?|artworks?|upscales?)$/i],
  ["videos", /^(?:videos?|clips?|reels?|animations?)$/i],
  ["generations", /^(?:generations?|gens?|creations?)$/i],
  ["prompts", /^prompts?$/i],
  ["requests", /^(?:requests?|reqs?|calls?|queries|query)$/i],
  ["tokens", /^tokens?$/i],
  ["words", /^words?$/i],
  ["characters", /^(?:characters?|chars?)$/i],
  ["messages", /^(?:messages?|msgs?|chats?|conversations?)$/i],
  ["hours", /^(?:hours?|hrs?)$/i],
  ["minutes", /^(?:minutes?|mins?)$/i],
  ["seconds", /^seconds?$/i],
  ["credits", /^credits?$/i],
  ["jobs", /^(?:jobs?|tasks?|downloads?|exports?|batches?)$/i],
  ["GB", /^(?:gbs?|gigabytes?)$/i]
];
/* Periods collapse onto a per-day rate: hour ×24, week ÷7, month ÷30, year ÷365. Month and
 * year use the calendar average, so "600 requests/month" reads as 20/day and lands in the
 * same column as "50 images/day" instead of looking ten times bigger. A period needs either
 * a connector ("per day", "/day", "a day") or to be the first word after the amount, so the
 * "3-day trial" in "50 free images (3-day trial)" is a trial length, not a quota period. */
const Q_PERIODS = [
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*hours?\b|^\s*(?:hour|hourly|hours)\b/i, per: "hour", rate: 24 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*days?\b|^\s*(?:day|daily|days)\b/i, per: "day", rate: 1 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*weeks?\b|^\s*(?:week|weekly|weeks)\b/i, per: "week", rate: 1 / 7 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*months?\b|^\s*(?:month|monthly|months)\b/i, per: "month", rate: 1 / 30 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*years?\b|^\s*(?:year|yearly|annual|annually|years)\b/i, per: "year", rate: 1 / 365 }
];
/* A grant with no period ("20 free credits", "free for up to 20 generations") is a one-off
 * allowance and is reported as such rather than dressed up as a daily rate. */
const Q_GRANT = /\b(?:free|bonus|trial|starter|complimentary)\b/i;
const Q_GRANT_BEFORE = /\b(?:free|trial|starter|complimentary|bonus)\b[^.!?]{0,12}$/i;
/* "daily 50 images" puts the period before the amount; "50 free images per day" after it. */
const Q_BEFORE = /\b(daily|weekly|monthly|hourly|per\s+day|a\s+day|each\s+day)\b/i;
/* An amount, then the unit among the next few words: qualifiers can sit between them
 * ("20 free credits", "100 free API calls") but a second number ends the search, so the
 * "2" of "Qwen 2.1 with 50 free images/day" cannot be paired with "images". */
const Q_AMT = /\b(\d[\d,]*(?:\.\d+)?)\s*(k|m|mn|bn|thousand|million|billion)?\b/gi;
const Q_WORD = /[a-z]{2,14}/gi;

function qUnit(word) {
  for (const pair of Q_UNITS) if (pair[1].test(word)) return pair[0];

/* The stated allowance, normalised: { n, unit, per, perDay, raw }. null when the item
 * states none — the page shows a dash there rather than an invented figure. */
function aiQuota(it) {
  const hay = ((it.title || "") + " — " + (it.desc || "")).slice(0, 400);
  const found = [];
  Q_AMT.lastIndex = 0;
  let m;
  while ((m = Q_AMT.exec(hay))) {
    const n = parseFloat(m[1].replace(/,/g, "")) * (Q_MULT[(m[2] || "").toLowerCase()] || 1);
    if (!isFinite(n) || n <= 0 || n > 1e6) continue;   /* a multi-million allowance is not a quota */
    const before = hay.slice(Math.max(0, m.index - 18), m.index);
    /* "$5 in free credits" is a price line, not a count, so a currency sign disqualifies
     * the amount outright. */
    if (/[$€£¥]/.test(before)) continue;
    const between = hay.slice(m.index + m[0].length, m.index + m[0].length + 60).replace(/\d[\s\S]*$/, "");
    Q_WORD.lastIndex = 0;
    let unit = "", end = -1, w, words = 0;
    while ((w = Q_WORD.exec(between)) && words++ < Q_WORDS_MAX) {
      const u = qUnit(w[0]);
      if (u) { unit = u; end = w.index + w[0].length; break; }
    }
    if (!unit) continue;
    const granted = unit === "credits" || Q_GRANT.test(between.slice(0, end)) || Q_GRANT_BEFORE.test(before);
    const after = between.slice(end, end + 26);
    let per = "", rate = 0, spanAt = 0, spanLen = 0;
    for (const p of Q_PERIODS) {
      const hit = p.re.exec(after);
      if (hit) { per = p.per; rate = p.rate; spanAt = hit.index; spanLen = hit[0].length; break; }
    }
    if (!per && Q_BEFORE.test(before)) per = "day";
    /* No period and no grant: an amount on its own is not an allowance, so no chip. */
    if (!per && !granted) continue;
    const perDay = per ? Math.round(n * (rate || 1) * 100) / 100 : null;
    found.push({
      at: m.index,
      score: (per && per !== "total" ? 4 : 0) + (Q_DAY_UNITS.test(unit) ? 2 : 0) + (unit === "credits" ? 1 : 0) + (per === "day" ? 1 : 0),
      q: {
        n: Math.round(n), unit: unit, per: per || "total", perDay: perDay,
        raw: hay.slice(m.index, m.index + m[0].length + end + spanAt + spanLen).replace(/\s+/g, " ").trim().slice(0, 80)
      }
    });
  }
  if (found.length) {
    /* Several amounts can appear (a free tier plus a paid one): take the most useful —
     * a stated period over a bare grant, a generative unit over infrastructure — and the
     * earliest when they tie. */
    found.sort((a, b) => (b.score - a.score) || (a.at - b.at));
    return found[0].q;
  }
  const unl = Q_UNLIMITED.exec(hay);
  if (unl) return { n: null, unit: "unlimited", per: "day", perDay: null, raw: unl[0].slice(0, 80) };
  return null;
}

/* The board is a view of `tasks`, not a second list: `done` keeps deciding completion, and
   `status` only splits the open ones into "to do" and "doing". Today's tasks, the list, the
   CSV export and the board therefore all read one array, and a move on the board shows up in
   the list and on the home card without a second write. */
const KB_COLS=["todo","doing","done"];
const KB_LABEL={todo:"kbTodo",doing:"kbDoing",done:"done"};
function kbCol(x){return x.done?"done":(x.status==="doing"?"doing":"todo")}
function kbSet(x,col){x.done=col==="done";x.status=col}
function kbSave(){store.set("pd_tasks",tasks);renderKanban();renderTasks(true);renderTasks(false)}
/* ---- moving a card ----
   Dragging is the only way to move one now: pointer events cover mouse, pen and finger, so the
   old ◀ ▶ pair (and the mouse-only HTML5 drag it mirrored) is gone. A mouse picks a card up on
   the first real move; a finger has to rest on it for a moment first, because a quick swipe
   across a card belongs to the page. Once picked up, the gesture stays on the card through
   pointer capture and the board's touchmove blocker stops the page scrolling underneath. A

 d.dx=d.startX-r.left;d.dy=d.startY-r.top;d.hot=null;d.ghost=g;d.card.classList.add("kbdrag");
 g.style.transform="translate("+(d.startX-d.dx)+"px,"+(d.startY-d.dy)+"px)";document.body.appendChild(g);kbDragPlace(d.startX,d.startY)}

function cdNext(c){const now=new Date();let dt=new Date(c.date+(c.time?"T"+c.time:"T00:00"));if(c.recurring){dt.setFullYear(now.getFullYear());if(dt<now&&c.mode==="until")dt.setFullYear(now.getFullYear()+1)}return dt}

function cdText(c){const now=new Date(),dt=cdNext(c);const p=cdParts(now,dt);const u=c.units||{d:1,h:1,mi:1};const bits=[];if(u.y)bits.push(digits(p.y)+" "+t("years"));if(u.mo)bits.push(digits(p.mo)+" "+t("months"));if(u.d)bits.push(digits(p.d)+" "+t("days"));if(u.h)bits.push(digits(p.h)+" "+t("hours"));if(u.mi)bits.push(digits(p.mi)+" "+t("minutes"));if(u.sec)bits.push(digits(p.sec)+" "+t("seconds"));return (c.mode==="since"?"± ":"")+bits.join(" · ")}

   it grants, and each cached AI headline that states a quota — so "daily limit" finds the
   figure itself rather than only the card that holds it. */

/* ---- quick capture: the palette's add commands land here ---- */
function quickAdd(kind){const meta=kind==="task"?{h:t("addTask"),ph:t("taskPh")}:kind==="note"?{h:t("noteAdd"),ph:t("notePh")}:{h:t("habitAdd"),ph:t("habitPh")};openModal("<h3></h3><div class='field'><label></label><input id='qaT' type='text'></div><div class='row' style='justify-content:flex-end'><button class='btn ghost' id='qaC'></button><button class='btn' id='qaS'></button></div>");const bx=$("#modalBox");bx.querySelector("h3").textContent=meta.h;bx.querySelector("label").textContent=meta.ph;const inp=bx.querySelector("#qaT");inp.placeholder=meta.ph;bx.querySelector("#qaC").textContent=t("cancel");bx.querySelector("#qaC").onclick=closeModal;const save=()=>{const v=inp.value.trim();if(!v)return;if(kind==="task"){tasks.push({id:"t"+Date.now(),text:v,done:false,due:"",status:"todo"});store.set("pd_tasks",tasks);renderTasks(true);renderTasks(false);renderKanban()}else if(kind==="note"){notes.unshift({id:"n"+Date.now(),text:v,ts:Date.now(),pin:false});noteSave();renderNotes()}else{habits.push({id:"h"+Date.now(),name:v,days:{},ts:Date.now()});habitSave();renderHabits()}closeModal();toast("✓ "+meta.h)};bx.querySelector("#qaS").textContent=t("save");bx.querySelector("#qaS").onclick=save;inp.addEventListener("keydown",e=>{if(e.key==="Enter")save()});setTimeout(()=>{try{inp.focus()}catch(e){}},40)}
/* ============ focus timer ============ */
/* One ring and three buttons. The state is an end timestamp, not a counter, so a reload (or a
   locked phone) cannot lose a session; the tick rewrites two attributes and never rebuilds the
   card - the same discipline the clock follows. */
let fstate=Object.assign({dur:25,left:25*60000,endAt:0,on:false,sessions:{}},store.get("pd_focus",{}));
const FOCUS_C=2*Math.PI*52;
function fstateSave(){store.set("pd_focus",fstate)}
function focusDay(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function focusToday(){return (fstate.sessions&&fstate.sessions[focusDay()])||0}
function focusLeftMs(){return fstate.on?Math.max(0,fstate.endAt-Date.now()):fstate.left}
function focusSet(min){fstate.dur=min;fstate.left=min*60000;fstate.endAt=Date.now()+fstate.left;fstate.on=true;fstateSave();renderFocus()}
function focusToggle(){if(fstate.on){fstate.left=focusLeftMs();fstate.on=false}else{fstate.endAt=Date.now()+fstate.left;fstate.on=true}fstateSave();renderFocus()}
function focusReset(){fstate.on=false;fstate.left=fstate.dur*60000;fstateSave();renderFocus()}
function focusComplete(){fstate.on=false;fstate.left=fstate.dur*60000;fstate.sessions=fstate.sessions||{};const k=focusDay();fstate.sessions[k]=(fstate.sessions[k]||0)+1;fstateSave();toast("🎯 "+t("focusDone"));if(navigator.vibrate){try{navigator.vibrate(20)}catch(e){}}renderFocus()}
function focusPaint(){const el=$("#wb_focus");if(!el)return;const ms=focusLeftMs();const total=Math.max(1,fstate.dur*60000);const frac=Math.min(1,ms/total);const txt=document.getElementById("focusTime");if(txt)txt.textContent=digits(Math.floor(ms/60000)+":"+String(Math.floor(ms%60000/1000)).padStart(2,"0"));const sr=document.getElementById("focusSR");if(sr)sr.textContent=t("focusLeft")+": "+digits(Math.floor(ms/60000)+":"+String(Math.floor(ms%60000/1000)).padStart(2,"0"));const ring=document.getElementById("focusRing");if(ring)ring.setAttribute("stroke-dashoffset",String(Math.round(FOCUS_C*(1-frac))))}
function tickFocus(){if(!fstate.on)return;if(focusLeftMs()<=0){focusComplete();return}focusPaint()}
function renderFocus(){const el=$("#wb_focus");if(!el)return;el.innerHTML="";const wrap=document.createElement("div");wrap.className="focuswrap";const NS="http://www.w3.org/2000/svg";const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","fring");svg.setAttribute("viewBox","0 0 120 120");svg.setAttribute("aria-hidden","true");const c1=document.createElementNS(NS,"circle");c1.setAttribute("class","ftrack");c1.setAttribute("cx","60");c1.setAttribute("cy","60");c1.setAttribute("r","52");const c2=document.createElementNS(NS,"circle");c2.setAttribute("class","fval");c2.setAttribute("id","focusRing");c2.setAttribute("cx","60");c2.setAttribute("cy","60");c2.setAttribute("r","52");c2.setAttribute("stroke-dasharray",String(Math.round(FOCUS_C)));const mid=document.createElementNS(NS,"text");mid.setAttribute("class","fmid");mid.setAttribute("id","focusTime");mid.setAttribute("x","60");mid.setAttribute("y","66");mid.setAttribute("text-anchor","middle");svg.appendChild(c1);svg.appendChild(c2);svg.appendChild(mid);wrap.appendChild(svg);const side=document.createElement("div");side.className="ftimes";const chips=document.createElement("div");chips.className="fchips";[25,50,5].forEach(m=>{const b=document.createElement("button");b.className="mini";b.textContent=digits(m)+"′";b.onclick=()=>focusSet(m);chips.appendChild(b)});side.appendChild(chips);const row=document.createElement("div");row.className="row";const start=document.createElement("button");start.className="btn";start.textContent=fstate.on?t("focusPause"):(fstate.left<fstate.dur*60000?t("focusResume"):t("focusStart"));start.onclick=focusToggle;const rst=document.createElement("button");rst.className="btn ghost";rst.textContent=t("focusReset");rst.onclick=focusReset;row.appendChild(start);row.appendChild(rst);side.appendChild(row);const sess=document.createElement("div");sess.className="muted";sess.textContent=t("focusSessions")+": "+digits(focusToday());side.appendChild(sess);wrap.appendChild(side);const srt=document.createElement("div");srt.className="sr";srt.id="focusSR";wrap.appendChild(srt);el.appendChild(wrap);focusPaint()}
/* ============ habits ============ */
let habits=store.get("pd_habits",[]);
function habitSave(){store.set("pd_habits",habits)}
function dkey(d){const t2=new Date(d);return t2.getFullYear()+"-"+String(t2.getMonth()+1).padStart(2,"0")+"-"+String(t2.getDate()).padStart(2,"0")}
function habitStreak(h){let n=0;const d=new Date();if(!(h.days&&h.days[dkey(d)]))d.setDate(d.getDate()-1);for(;;){if(h.days&&h.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
function renderHabits(){const el=$("#wb_habits");if(!el)return;el.innerHTML="";if(!habits.length){const p=document.createElement("p");p.className="muted";p.textContent=t("habitEmpty");el.appendChild(p)}const today=dkey(new Date());habits.forEach(h=>{const row=document.createElement("div");row.className="hrow";const chk=document.createElement("button");chk.className="circle"+((h.days&&h.days[today])?" done":"");chk.textContent="✓";chk.setAttribute("aria-label",h.name+" — "+t("today"));chk.setAttribute("aria-pressed",(h.days&&h.days[today])?"true":"false");chk.onclick=()=>{h.days=h.days||{};if(h.days[today])delete h.days[today];else h.days[today]=true;habitSave();renderHabits()};row.appendChild(chk);const nm=document.createElement("div");nm.className="hname";nm.textContent=h.name;row.appendChild(nm);const dots=document.createElement("div");dots.className="hdots";for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);const dot=document.createElement("span");dot.className="hdot"+((h.days&&h.days[k])?" on":"")+(i===0?" today":"");dot.title=digits(k);dots.appendChild(dot)}row.appendChild(dots);const st=document.createElement("span");st.className="hstreak";const sn=habitStreak(h);st.textContent=digits(sn)+" "+(sn===1?t("habitStreakOne"):t("habitStreak"));row.appendChild(st);const del=document.createElement("button");del.className="mini";del.textContent="✕";del.setAttribute("aria-label",t("del")+": "+h.name);del.onclick=async()=>{if(await confirmModal(t("del"),h.name,t("yesDel"))){habits=habits.filter(x=>x.id!==h.id);habitSave();renderHabits()}};row.appendChild(del);el.appendChild(row)});const r=document.createElement("div");r.className="row";r.style.marginTop="10px";const inp=document.createElement("input");inp.type="text";inp.placeholder=t("habitPh");inp.setAttribute("aria-label",t("habitAdd"));inp.style.flex="1";const add=document.createElement("button");add.className="btn";add.textContent=t("habitAdd");const put=()=>{const v=inp.value.trim();if(!v)return;inp.value="";habits.push({id:"h"+Date.now(),name:v,days:{},ts:Date.now()});habitSave();renderHabits()};add.onclick=put;inp.addEventListener("keydown",e=>{if(e.key==="Enter")put()});r.appendChild(inp);r.appendChild(add);el.appendChild(r)}
/* ============ notes ============ */
let notes=store.get("pd_notes",[]);
function noteSave(){store.set("pd_notes",notes)}
function renderNotes(){const el=$("#wb_notes");if(!el)return;el.innerHTML="";if(!notes.length){const p=document.createElement("p");p.className="muted";p.textContent=t("noteEmpty");el.appendChild(p)}notes.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts).forEach(n=>{const row=document.createElement("div");row.className="nrow";const tx=document.createElement("div");tx.className="ntext";tx.textContent=n.text;row.appendChild(tx);const meta=document.createElement("div");meta.className="nmeta";if(n.pin){const p=document.createElement("span");p.className="npin";p.textContent="📌 "+t("notePin");meta.appendChild(p)}const cp=document.createElement("button");cp.className="mini";cp.textContent=t("noteCopy");cp.onclick=async()=>{try{await navigator.clipboard.writeText(n.text);toast(t("copied"))}catch(e){toast("✕")}};const pin=document.createElement("button");pin.className="mini";pin.textContent=n.pin?t("noteUnpin"):t("notePin");pin.onclick=()=>{n.pin=!n.pin;noteSave();renderNotes()};const del=document.createElement("button");del.className="mini";del.textContent=t("del");del.onclick=async()=>{if(await confirmModal(t("del"),n.text.slice(0,60),t("yesDel"))){notes=notes.filter(x=>x.id!==n.id);noteSave();renderNotes()}};meta.appendChild(cp);meta.appendChild(pin);meta.appendChild(del);row.appendChild(meta);el.appendChild(row)});const r=document.createElement("div");r.className="row";r.style.marginTop="10px";const inp=document.createElement("input");inp.type="text";inp.placeholder=t("notePh");inp.setAttribute("aria-label",t("noteAdd"));inp.style.flex="1";const add=document.createElement("button");add.className="btn";add.textContent=t("noteAdd");const put=()=>{const v=inp.value.trim();if(!v)return;inp.value="";notes.unshift({id:"n"+Date.now(),text:v,ts:Date.now(),pin:false});noteSave();renderNotes()};add.onclick=put;inp.addEventListener("keydown",e=>{if(e.key==="Enter")put()});r.appendChild(inp);r.appendChild(add);el.appendChild(r)}
