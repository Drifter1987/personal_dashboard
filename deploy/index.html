/* Cards keep the height their own content asks for. Stretching every card to the tallest in its
   row was tried and it put the empty space inside the card's border: a clock stretched to a
   576px band with 411px of nothing under the time.

   On the desktop the cards then pack into columns (packPages, in the script): each column is
   filled with the next card in the page's own order, so the reading runs down a column and the
   space a short card leaves is taken by the card that follows it rather than left as a row of
   background. The order is never rearranged - a card only ever moves up into a gap its
   predecessor left, which is why the packed page still announces the same sequence. The grid
   rows are 8px slabs here (packed, below), so a card spans the whole number of slabs its own
   height needs; nothing is stretched and no card overlaps another. */
.page-inner{display:grid;gap:12px;grid-template-columns:1fr;max-width:1100px;margin:0 auto;align-items:start}
/* the slab the packer counts in - packPages reads it back from this rule, so the two cannot
   disagree about the unit. 4px keeps the rounding short of a fifth of the gap: a card's slot is
   at most 4px taller than the card, so a column reads as cards separated by one gap. */
.page-inner.packed{grid-auto-rows:4px}

   spends it rather than leaving blank space: the review card's chart takes it as track, a task

   expressed without a pixel the card could grow from - flex and percentages only - so a card can
   never feed itself taller on the next pass. The desktop grid no longer stretches cards, so in
   the page itself these only matter when a card is given a height from outside. */

.fmid{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ftimes{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
/* habit streaks: seven day-dots per habit, today ringed */
.hrow{display:flex;gap:8px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.hname{font-weight:700;min-width:0;overflow-wrap:anywhere;flex:1}
.hdots{display:flex;gap:4px}
.hdot{width:14px;height:14px;border-radius:5px;border:1px solid var(--line);background:transparent}
.hdot.on{background:var(--ac);border-color:var(--ac)}
.hdot.today{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ac)}
.hstreak{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* this-week review: three readings, then one bar per day so the shape of the window is visible */
.wkhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wkseg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wkseg button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;cursor:pointer;min-height:26px}
.wkseg button.on{background:var(--ac);color:#000}
.wkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wktile{border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.wkbig{font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.wklbl{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.wksub{font-size:11.5px;color:var(--text2);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wkbars{display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:6px}
.wkcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
/* the bar is a share of its track, not a number of pixels: the track is what grows when the card
   is stretched, so the reading grows with it and no measurement has to be redone on a resize */
.wkplot{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wkbar{width:100%;max-width:22px;height:calc(var(--v,0)*100%);border-radius:4px 4px 2px 2px;background:var(--ac);opacity:.85}
.wkbar.zero{background:var(--line);opacity:1}
.wkday{font-size:9.5px;color:var(--muted);white-space:nowrap}
.wknote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
/* the timeline carries the chart's crosshair, which positions against this box */
.wkbox{position:relative}
/* Settings is a list of decisions, so it reads like one: a heading per group, a hairline above
   it, and the rows that belong to it underneath. */
.sethead{margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.02em}
.sethead:first-child{margin-top:0;padding-top:0;border-top:0}
.setgrp{font-size:10.5px;color:var(--muted);margin:10px 0 0;text-transform:uppercase;letter-spacing:.04em}
.setnote{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
@media(max-width:420px){.wkbig{font-size:16.5px}.wktile{padding:8px 7px}}
/* notes */
.nrow{padding:9px 2px;border-top:1px solid var(--line)}
.ntext{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.nmeta{display:flex;gap:8px;align-items:center;margin-top:5px}
.npin{font-size:11.5px;color:var(--muted)}
/* weather: on a phone the hourly strip scrolls inside its own card, never the page. From 600px
   up the twelve hours fit as six columns by two rows, so no label is cut in half at the card's
   edge and there is nothing to find by scrolling sideways. */
/* Twelve hours as a compact list rather than twelve little boxes: one line each - the hour,
   a small icon beside it, the temperature on the right - so the card spends its height on the
   reading and not on twelve rectangles. Two columns on a phone, three once there is room. */
.wxstrip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;margin-top:8px}
.wxh{display:grid;grid-template-columns:3.1em 18px minmax(0,1fr);gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:12.5px;min-width:0}
@media(min-width:600px){.wxstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* the five-day forecast, one tile per day: the weekday is what a reader looks for, so the ISO date
   that used to lead each row becomes a tooltip, and the high and low stack in the same place
   under every day instead of trailing a sentence of numbers and a weather word */
.wxdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
@media(max-width:430px){.wxdays{gap:4px}.wxd{padding:6px 2px}.wxd .wd{font-size:10px}}
.wxd{text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 4px}
.wxd .wd{font-size:11px;color:var(--muted);white-space:nowrap}
.wxd .wi{font-size:15px;line-height:1.35}
.wxd .wt{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;margin-top:1px}
.wxd .wl{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wxh .whh{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wxh .wi{font-size:13px;line-height:1;text-align:center}
.wxh .wht{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.wxdet{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wxdet span{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
@media(hover:hover){
 .btn:hover{filter:brightness(1.06)}
 .btn.ghost:hover,.btn.danger:hover,.mini:hover,.iconbtn:hover{border-color:var(--ac);color:var(--ac)}
 .mini:active,.iconbtn:active,.btn:active{transform:translateY(1px)}
}
@media(max-width:599px){.palbtn{display:none}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 html{scroll-behavior:auto!important}
 body.editing .card{animation:none}
}
</style>
</head>
