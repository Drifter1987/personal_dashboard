ing.","Stephen King"],["The purpose of our lives is to be happy.","Dalai Lama"],["Happiness is not something ready made. It comes from your own actions.","Dalai Lama"],["Remember that not getting what you want is sometimes a wonderful stroke of luck.","Dalai Lama"],["Where there is love there is life.","Gandhi"],["The weak can never forgive. Forgiveness is the attribute of the strong.","Gandhi"],["Live as if you were to die tomorrow. Learn as if you were to live forever.","Gandhi"],["First they ignore you, then they laugh at you, then they fight you, then you win.","Gandhi"],["A man is but the product of his thoughts. What he thinks, he becomes.","Gandhi"],["You must be the change you wish to see.","Gandhi"],["The future belongs to those who believe in the beauty of their dreams.","Eleanor Roosevelt"],["No one can make you feel inferior without your consent.","Eleanor Roosevelt"],["Do what you feel in your heart to be right — for you'll be criticized anyway.","Eleanor Roosevelt"],["It takes as much energy to wish as it does to plan.","Eleanor Roosevelt"],["Believe you can and you're halfway there.","Theodore Roosevelt"],["Do what you can, with what you have, where you are.","Theodore Roosevelt"],["Keep your eyes on the stars, and your feet on the ground.","Theodore Roosevelt"],["Far and away the best prize that life offers is the chance to work hard at work worth doing.","Theodore Roosevelt"],["Knowing is not enough; we must apply. Willing is not enough; we must do.","Goethe"],["Whatever you can do, or dream you can, begin it. Boldness has genius in it.","Goethe"],["Correction does much, but encouragement does more.","Goethe"],["Dreams are necessary to life.","Anaïs Nin"],["Life shrinks or expands in proportion to one's courage.","Anaïs Nin"],["The best way out is always through.","Frost"],["Done is better than perfect.","Sheryl Sandberg"]

let LOG_DEV_AES=null, LOG_DEV_AES_FOR="";
async function logCloudKey(c){
 if(LOG_DEV_AES&&LOG_DEV_AES_FOR===c.dev)return LOG_DEV_AES;
 const raw=new Uint8Array(String(c.key||"").match(/../g).map(h=>parseInt(h,16)));
 LOG_DEV_AES=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
 LOG_DEV_AES_FOR=c.dev;
 return LOG_DEV_AES;
}
async function logDerive(pass,dev){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(String(pass)),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(LOG_SALT+dev),iterations:LOG_ITER,hash:"SHA-256"},base,256);
 return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["encrypt","decrypt"]);
}
async function logSeal(key,bytes){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes));
 return {iv:logB64(iv),ct:logB64(ct)};
}
async function logOpen(key,payload){
 const iv=logUnB64(String(payload.iv||"")), ct=logUnB64(String(payload.ct||""));
 return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
}
/* the bytes only ever leave sealed by the cloud key: the Worker stores ciphertext either way */
const logAD=(id,ver,i,n)=>new TextEncoder().encode(id+"|"+ver+"|"+i+"|"+n);
async function logSealBytes(key,bytes,ad){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:ad},key,bytes));
 const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12); return out;
}
async function logOpenBytes(key,sealed,ad){
 return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:sealed.subarray(0,12),additionalData:ad},key,sealed.subarray(12)));
}
function logHeaders(c){ return {"X-Log-Dev":c.dev,"X-Log-Key":c.key} }
/* A request that never answers must not freeze every later save: each one is abandoned after 25s
   and reported as a failed save, so the next tap tries again instead of queueing behind a ghost. */
async function logReq(url,opts,ms){
 const ctrl=new AbortController(), t=setTimeout(()=>{try{ctrl.abort()}catch(e){}},ms||25000);
 try{ return await fetch(url,Object.assign({},opts||{},{signal:ctrl.signal})) }
 finally{ clearTimeout(t) }
}
async function logCall(p,body,headers){
 const h=Object.assign({"Content-Type":"application/json"},headers||{});
 return logReq(logApi(p),{method:"POST",headers:h,body:JSON.stringify(body||{})})
}
/* every record the app keeps, except the backup's own bookkeeping: including pd_log would make a
   successful save look like a new edit and push for ever */
function logDataKeys(){ return DURABLE.filter(k=>k!==LOG_KEY&&k!=="pd_sync") }
async function logManifest(){
 const cf=(logConf()||{}).files||{};
 return (await fileAll()).filter(r=>r&&r.id&&(r.blob||r.enc)&&cf[r.id]&&cf[r.id].ver===r.ver)
  .map(r=>({id:r.id,name:r.name,type:r.type||"",size:r.size,ver:r.ver,n:cf[r.id].n,enc:!!cf[r.id].enc}));
}
const logManifestOk=m=>!!m&&typeof m.id==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(m.id)&&typeof m.ver==="string"&&/^[a-f0-9]{16}$/.test(m.ver)&&Number.isInteger(m.n)&&m.n>=1&&m.n<=256;
/* the ids the incoming records point at: read from the records themselves, because a copy made
   before attachments were backed up carries no manifest to compare against */
function logAttRefs(data){
 const out=new Set();
 const walk=(v,d)=>{
  if(!v||d>6)return;
  if(Array.isArray(v)){ v.forEach(x=>walk(x,d+1)); return }
  if(typeof v!=="object")return;
  if(Array.isArray(v.att))v.att.forEach(a=>{ if(a&&typeof a.id==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(a.id))out.add(a.id) });
  for(const k in v)if(k!=="att")walk(v[k],d+1);
 };
 Object.keys(data||{}).forEach(k=>{ try{ walk(JSON.parse(data[k]),0) }catch(e){} });
 return [...out];
}
async function logItems(){ const m=await logManifest(); return tasks.length+events.length+countdowns.length+notes.length+habits.length+m.length }
async function logPayloadNow(){
 const o={}; logDataKeys().forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)o[k]=v}catch(e){}});
 return JSON.stringify({v:CONFIG.VERSION,data:o,files:await logManifest()});
}
/* an attachment still sealed by the local lock is sent as its envelope, so the cloud key never has
   to unlock the lock; a plain file is sent as its bytes. Either way AES-GCM seals it again. */
async function logFileUpload(c,rec,key){
 const enc=!!rec.enc;
 const bytes=enc?new TextEncoder().encode(JSON.stringify(rec.enc)):new Uint8Array(await rec.blob.arrayBuffer());
 const n=Math.max(1,Math.ceil(bytes.length/LOG_CHUNK));
 for(let i=0;i<n;i++){
  const part=bytes.subarray(i*LOG_CHUNK,Math.min(bytes.length,(i+1)*LOG_CHUNK));
  const sealed=await logSealBytes(key,part,logAD(rec.id,rec.ver,i,n));
  const r=await logReq(logApi("/api/log/file/put"),{method:"POST",
   headers:Object.assign({"Content-Type":"application/octet-stream","X-Log-File":rec.id,"X-Log-Chunk":String(i)},logHeaders(c)),
   body:sealed});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.backup!==true)throw new Error("chunk "+i+" "+r.status);
  logWriteSpent(1);
 }
 return {n,enc};
}
async function logFileFetch(c,key,m){
 try{
  const parts=[];
  for(let i=0;i<m.n;i++){
   const r=await logCall("/api/log/file/get",{dev:c.dev,key:c.key,id:m.id,chunk:i});
   if(!r.ok)return null;
   parts.push(await logOpenBytes(key,new Uint8Array(await r.arrayBuffer()),logAD(m.id,m.ver,i,m.n)));
  }
  let len=0;parts.forEach(p=>{len+=p.length});
  const all=new Uint8Array(len); let o=0;parts.forEach(p=>{all.set(p,o);o+=p.length});
  const rec={id:m.id,name:m.name,type:m.type||"",size:m.size,ver:m.ver};
  if(m.enc){
   const env=JSON.parse(new TextDecoder().decode(all));
   if(!env||typeof env.iv!=="string"||typeof env.ct!=="string")return null;
   rec.enc=env;
  }else rec.blob=new Blob([all],{type:m.type||""});
  return rec;
 }catch(e){ return null }
}
/* One save: changed attachments first, then the log last, so the log never names a file the bucket
   does not hold. The whole payload is one object write - there is no second copy anywhere. */
/* Saves run one at a time, in the order they were asked for. A tapped save is never dropped just
   because the debounced one is in flight - turning encryption off a moment after a save is exactly
   two writes in a row, and the second is the one that makes the switch mean anything. */
let LOG_RUN=null;
function logSave(manual){
 if(!manual&&LOG_RUN)return Promise.resolve(false);
 const run=()=>logSaveRun(manual);
 const next=(LOG_RUN||Promise.resolve()).then(run,run);
 LOG_RUN=next.then(()=>null,()=>null);
 return next;
}
async function logSaveRun(manual){
 const c=logConf(); if(!c)return false;
 if(!manual&&logWritesToday()>=LOG_WRITES_MAX){LOG_ERR="budget";paintLog();return false}
 if(c.enc&&!LOG_AES){ if(!manual)return false; if(!(await logUnlock()))return false }
 LOG_BUSY=true;
 try{
  const key=await logCloudKey(c);
  const cf=c.files||(c.files={});
  const recs=(await fileAll()).filter(r=>r&&r.id&&(r.blob||r.enc));
  for(const rec of recs){
   if(!rec.ver){rec.ver=syncHex(syncRand(8));await filePutRaw(rec)}
   const have=cf[rec.id];
   if(have&&have.ver===rec.ver)continue;
   try{const up=await logFileUpload(c,rec,key);cf[rec.id]={ver:rec.ver,n:up.n,enc:up.enc};logWriteConf(c)}
   catch(e){LOG_ERR="files";paintLog();return false}
  }
  const live=new Set(recs.map(r=>r.id));
  for(const id of Object.keys(cf)){
   if(live.has(id))continue;
   try{const r=await logCall("/api/log/file/del",{dev:c.dev,key:c.key,id});if(!r.ok)throw 0;logWriteSpent(1);delete cf[id];logWriteConf(c)}catch(e){}
  }
  const plain=await logPayloadNow();
  const bytes=new TextEncoder().encode(plain);
  if(bytes.length>LOG_PLAIN_MAX){toast(t("logBig"));return false}
  if(!manual&&plain===LOG_LAST)return true;
  const body={v:CONFIG.VERSION,items:await logItems(),enc:!!c.enc,payload:c.enc?await logSeal(LOG_AES,bytes):plain};
  const r=await logCall("/api/log/put",body,logHeaders(c));
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.backup!==true||typeof j.at!=="number"){LOG_ERR=(j&&j.error)||String(r.status);paintLog();return false}
  logWriteSpent(1);
  c.at=j.at;c.items=j.items||0;LOG_ERR="";logWriteConf(c);LOG_LAST=plain;
  return true;
 }catch(e){ LOG_ERR="offline:"+((e&&(e.name+"/"+e.message))||"?"); paintLog(); return false }
 finally{ LOG_BUSY=false }
}
/* eight seconds after the last change: a burst of edits is one write, not ten */
function syncSoon(){ const c=logConf(); if(!c)return; if(c.enc&&!LOG_AES)return; clearTimeout(LOG_T); LOG_T=setTimeout(()=>logSave(false),8000) }
async function logFetch(c){
 const r=await logCall("/api/log/get",{dev:c.dev,key:c.key});
 const j=await r.json().catch(()=>({}));
 if(r.status===404)return {status:404};
 if(!r.ok||j.backup!==true)return {status:r.status===403?403:(r.status||502),json:j};
 return {status:200,json:j};
}
async function logUnlock(){
 const c=logConf(); if(!c)return false;
 const pass=await askPass(t("logUnlockT"),t("logPass"),false); if(pass===null)return false;
 try{ LOG_AES=await logDerive(pass,c.dev) }catch(e){ toast(t("lockNoCrypto")); return false }
 toast(t("logUnlocked")); paintLog(); return true;
}
/* Put a pulled log in front of the user without a reload: a reload would drop the settings that
   were just read. The in-memory copies are re-read exactly as a boot reads them. */
async function logAfterPull(){
 LOG_HOLD=false;
 settings=Object.assign({},SETTINGS_DEFAULTS,store.get("pd_settings",{}));
 tasks=store.get("pd_tasks",[]);events=store.get("pd_events",[]);countdowns=store.get("pd_countdowns",[]);
 notes=store.get("pd_notes",[]);habits=store.get("pd_habits",[]);location_=store.get("pd_location",null);
 LOG_LAST=await logPayloadNow();
 try{applyPrefs()}catch(e){}
 try{buildPages()}catch(e){}
 snapSave(); paintLog();
}
async function logApply(c,payload,encKey){
 let obj; try{ obj=JSON.parse(payload) }catch(e){ return {ok:false,why:"shaped"} }
 const data=(obj&&obj.data)||{};
 const hasFiles=Array.isArray(obj.files);
 const manifest=hasFiles?obj.files:[];
 /* every attachment comes down before anything local is touched: a restore that lost a file
    halfway would leave half of one copy and half of another */
 const recs=[];
 for(const m of manifest){
  if(!logManifestOk(m))return {ok:false,why:"files"};
  const rec=await logFileFetch(c,encKey,m);
  if(!rec)return {ok:false,why:"files"};
  recs.push(rec);
 }
 /* a copy made before attachments were included still restores the records, but the files it
    cannot supply have to be named before this device is replaced - otherwise each one opens as
    "no longer on this device" with no explanation */
 const held=new Set(recs.map(r=>r.id));
 try{(await fileAll()).forEach(r=>{if(r&&(r.blob||r.enc))held.add(r.id)})}catch(e){}
 const refs=logAttRefs(data);
 const missing=refs.filter(id=>!held.has(id));
 if(missing.length&&!(await confirmModal(t("logTitle"),t("logAttGap").replace("{n}",digits(missing.length)),t("logRestoreYes"))))return {ok:false,why:"cancel"};
 LOG_HOLD=true;
 /* bytes first, records second: a phone that runs out of room writing 20 MB of files must be
    left exactly as it was, not with cards pointing at files that were never stored */
 try{ for(const rec of recs)await filePutRaw(rec) }
 catch(e){ LOG_HOLD=false; return {ok:false,why:"files"} }
 logDataKeys().forEach(k=>{ try{ if(typeof data[k]==="string")localStorage.setItem(k,data[k]); else localStorage.removeItem(k) }catch(e){} });
 if(hasFiles){
  /* a file the copy did not carry but this device already held is still what the restored
     records point at: it must survive the cleanup that removes everything else */
  const keep=new Set(recs.map(r=>r.id));
  refs.forEach(id=>keep.add(id));
  try{ await fileDel((await fileAll()).filter(r=>r&&!keep.has(r.id)).map(r=>r.id)) }catch(e){}
 }
 LOCK_CRYPT=null;BYOK_PLAIN="";
 const cf={};manifest.forEach(m=>{cf[m.id]={ver:m.ver,n:m.n,enc:!!m.enc}});
 return {ok:true,items:Number(obj.items||0)||Object.keys(data).length,files:cf,count:recs.length,missing:missing.length};
}
async function logRestore(){
 let c=logConf();
 /* A phone with no records and no saved log is a phone that has just been wiped or is brand new:
    its own log holds nothing, so the only way back is the code from the device that had the data.
    A phone that does have records restores its own log without being asked for anything. */
 const blank=!tasks.length&&!events.length&&!countdowns.length&&!notes.length&&!habits.length;
 if(!c||blank&&!(c&&c.items)){
  const got=await logAskCode(); if(!got)return;
  /* a wiped phone registers a fresh, empty log on boot. Restoring the old one must not leave that
     empty log behind as a second copy of the same phone, so it goes before the old id is adopted. */
  const fresh=logConf();
  if(fresh&&fresh.dev!==got.dev){try{await logCall("/api/log/del",{dev:fresh.dev,key:fresh.key})}catch(e){}}
  logWriteConf({on:true,enc:false,dev:got.dev,key:got.key,at:0,items:0,files:{}});
  c=logConf();
 }
 let got; try{ got=await logFetch(c) }catch(e){ toast(t("logOffline")); return }
 if(got.status===404){ toast(t("logNone")); return }
 if(got.status!==200){ toast(t("logFail")); return }
 const when=new Date(got.json.at||0).toLocaleString(settings.lang==="ar"?"ar":"en");
 if(!(await confirmModal(t("logRestoreT"),t("logRestoreWarn").replace("{time}",when),t("logRestoreYes"))))return;
 let key=LOG_AES,payload=got.json.payload;
 if(got.json.enc){
  if(!key){
   const pass=await askPass(t("logUnlockT"),t("logPass"),false); if(pass===null)return;
   try{ key=await logDerive(pass,c.dev) }catch(e){ toast(t("lockNoCrypto")); return }
  }
  try{ payload=new TextDecoder().decode(await logOpen(key,payload)) }
  catch(e){ toast(t("logWrong")); return }
 }else key=null;
 const ap=await logApply(c,payload,await logCloudKey(c));
 if(!ap.ok){ if(ap.why==="cancel")return; toast(t(ap.why==="files"?"logFiles":"logFail")); return }
 LOG_AES=key;
 c.at=got.json.at||0; c.items=got.json.items||ap.items; c.files=ap.files||{}; c.enc=!!got.json.enc; logWriteConf(c);
 await logAfterPull();
 toast(t("logRestoreDone").replace("{n}",digits(c.items||0)).replace("{time}",when));
 if(ap.missing)toast(t("logSkipped").replace("{f}",digits(ap.missing)));
}

/* ============ a passphrase over what is stored at rest ============
   Two things in this app are worth more than the rest of it: the bytes of an attachment, and the
   metals provider key. Both used to sit in the clear - one as a Blob in IndexedDB, the other as a
   string in localStorage - so anyone holding the device, or a copy of it, could read them without
   opening the app. With a passphrase set, both are sealed with AES-GCM under a key derived from it
   with PBKDF2-SHA256, and the passphrase itself is never stored anywhere: the salt and an encrypted
   check value are, and that is all. The key exists in memory for as long as this page is open and
   nowhere else; while the app is locked, a sealed file cannot be read and the provider key is not
   available to a request. There is no server, no recovery code and no reset - the passphrase is the
   only way back to those bytes, which the settings card says in as many words.
   Everything here degrades to the old behaviour when the browser has no WebCrypto (a page opened
   from file:// does not), and says so rather than pretending to lock. */
const LOCK_KEY="pd_lock";
const LOCK_PLAIN="pd-lock-v1";
const LOCK_ITER=310000;
let LOCK_CRYPT=null,BYOK_PLAIN="";
function lockCan(){try{return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues)}catch(e){return false}}
function lockRec(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||"null")}catch(e){return null}}
function lockOn(){return !!lockRec()}
function lockOpen(){return lockOn()&&!!LOCK_CRYPT}
const B64=b=>{let s="";const u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const UNB64=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function lockDerive(pass,salt,iter){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function lockSeal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));
 return {iv:B64(iv),ct:B64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes))}}
async function lockOpenBytes(key,sealed){
 return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:UNB64(sealed.iv)},key,UNB64(sealed.ct)));}
async function lockSetByok(plain){
 if(!plain){try{localStorage.removeItem("pd_metals_key_enc")}catch(e){}snapSoon();BYOK_PLAIN="";return}
 const enc=await lockSeal(LOCK_CRYPT,new TextEncoder().encode(plain));
 localStorage.setItem("pd_metals_key_enc",JSON.stringify(enc));snapSoon();BYOK_PLAIN=plain;
}
/* set: derive, store the salt and the check value, then seal what is already on the device */
async function lockEnable(pass){
 if(!lockCan())return {ok:false,why:"lockNoCrypto"};
 if(!pass||String(pass).length<8)return {ok:false,why:"lockShort"};
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const key=await lockDerive(pass,salt,LOCK_ITER);
 const check=await lockSeal(key,new TextEncoder().encode(LOCK_PLAIN));
 if(!store.set(LOCK_KEY,{v:1,iter:LOCK_ITER,salt:B64(salt),check}))return {ok:false,why:"storeFail"};
 LOCK_CRYPT=key;
 await lockMigrate();
 return {ok:true};
}
/* what is already stored is sealed now, not left in the clear beside the lock */
async function lockMigrate(){
 try{for(const rec of await fileAll()){
   if(rec&&rec.blob&&!rec.enc)
     await filePutRaw({id:rec.id,name:rec.name,type:rec.type,size:rec.size,ver:syncHex(syncRand(8)),
       enc:await lockSeal(LOCK_CRYPT,new Uint8Array(await rec.blob.arrayBuffer()))});
 }}catch(e){}
 let plain="";try{plain=localStorage.getItem("pd_metals_key")||""}catch(e){}
 if(plain){await lockSetByok(plain);try{localStorage.removeItem("pd_metals_key")}catch(e){}}
}
async function lockUnlock(pass){
 const r=lockRec();if(!r)return {ok:false,why:"lockOff"};
 if(!lockCan())return {ok:false,why:"lockNoCrypto"};
 let key;
 try{key=await lockDerive(pass,UNB64(r.salt),r.iter||LOCK_ITER)}catch(e){return {ok:false,why:"lockWrong"}}
 try{const buf=await lockOpenBytes(key,r.check);
   if(new TextDecoder().decode(buf)!==LOCK_PLAIN)throw new Error("no")}catch(e){return {ok:false,why:"lockWrong"}}
 LOCK_CRYPT=key;
 let enc=null;try{enc=JSON.parse(localStorage.getItem("pd_metals_key_enc")||"null")}catch(e){}
 if(enc){try{BYOK_PLAIN=new TextDecoder().decode(await lockOpenBytes(key,enc))}catch(e){BYOK_PLAIN=""}}
 return {ok:true};
}
/* remove: put the bytes back in the clear, then forget the key */
async function lockDisable(pass){
 const u=await lockUnlock(pass);if(!u.ok)return u;
 try{for(const rec of await fileAll()){
   if(rec&&rec.enc){const bytes=await lockOpenBytes(LOCK_CRYPT,rec.enc);
     await filePutRaw({id:rec.id,name:rec.name,type:rec.type,size:rec.size,ver:syncHex(syncRand(8)),
       blob:new Blob([bytes],{type:rec.type||""})})}
 }}catch(e){}
 let enc=null;try{enc=JSON.parse(localStorage.getItem("pd_metals_key_enc")||"null")}catch(e){}
 if(enc){try{localStorage.setItem("pd_metals_key",new TextDecoder().decode(await lockOpenBytes(LOCK_CRYPT,enc)))}catch(e){}}
 try{localStorage.removeItem("pd_metals_key_enc");localStorage.removeItem(LOCK_KEY)}catch(e){}snapSoon();
 LOCK_CRYPT=null;BYOK_PLAIN="";
 return {ok:true};
}

   callback per call — this runs on every figure the page prints, and once a second for the
   clock. */

   One card per version, newest first: the card is the skim, and the reading view is the note
   itself, split into a standfirst and paragraphs so a long release can be read without losing
   the place. Neither view rewrites a word of what the changelog recorded. */
function clText(c){return (settings.lang==="ar"?c.ar:c.en)||""}
/* The date follows the Digits setting as well as the language: an Arabic card in western digits
   reads 17 أكتوبر 2026, not ١٧, because that is the numeral the reader chose for every other
   figure on the page. */
function clLoc(){return settings.lang==="ar"?("ar-EG"+(settings.digits==="eastern"?"":"-u-nu-latn")):"en-GB"}

/* Sentence split for the reading view: the notes are one dense paragraph each, and the first
   sentence is the release in a line, so it gets its own weight. Lookbehind is feature-tested -
   where it is missing the note stays whole rather than breaking on the dots inside "v2.12.0". */

  const bits=[srcText(d.source)];
  if(d.first)bits.push(digits(d.first)+" → "+digits(d.last||""));
  /* Two numbers when they differ: how many points the source has, and how many are drawn.
     A 7,100-day ECB run thinned to fit the canvas must not be passed off as "1,400 daily
     points" — the caption states the cadence the source actually publishes at. */
  const total=d.total||d.count;
  if(total)bits.push(digits(total)+" "+chartPtsLabel(d.cadence));
  if(d.total&&d.count&&d.count<d.total)bits.push(digits(d.count)+" "+t("chartPlotted"));
  if(d.unit)bits.push(d.unit);
  if(d.local)bits.push(t("chartLocal"));
  /* The note is one of the bits, so a series with nothing but a reason to show reads as the
     reason itself rather than starting with an empty separator. */
  /* The month window, when one is chosen, is part of the caption: a range picker must never
     leave the card claiming to show the whole series. */
  if(d.shown)bits.push(d.shown);
  if(d.note)bits.push(noteText(d.note));

/* ─────────────── free-tier quota ───────────────
 * The card answers "what can I use today, and how much of it do I get for free?", so the
 * free allowance is the one number a reader compares between items — and it arrives as
 * prose, in whatever unit and whatever period the announcement happened to use ("50 images
 * per day", "600 requests/month", "20 free credits", "1 million free credits"). Parsed and
 * normalised once here, every item's allowance lands in the page's quota column in the same
 * shape, and a per-day figure is what makes a daily allowance and a monthly one comparable
 * at a glance. Nothing is inferred: an amount needs a real unit (a version number, a model
 * size or a price is not a quota), a period-less amount is only believed for credits, and
 * the exact phrase the figure came from rides along as `raw` for the tooltip.
 */
const Q_UNITS = [
  ["images", /^(?:images?|imgs?|pictures?|photos?|renders?|artworks?|upscales?)$/i],
  ["videos", /^(?:videos?|clips?|reels?|animations?)$/i],
  ["generations", /^(?:generations?|gens?|creations?)$/i],
  ["prompts", /^prompts?$/i],
  ["requests", /^(?:requests?|reqs?|calls?|queries|query)$/i],
  ["tokens", /^tokens?$/i],
  ["words", /^words?$/i],
  ["characters", /^(?:characters?|chars?)$/i],
  ["messages", /^(?:messages?|msgs?|chats?|conversations?)$/i],
  ["hours", /^(?:hours?|hrs?)$/i],
  ["minutes", /^(?:minutes?|mins?)$/i],
  ["seconds", /^seconds?$/i],
  ["credits", /^credits?$/i],
  ["jobs", /^(?:jobs?|tasks?|downloads?|exports?|batches?)$/i],
  ["GB", /^(?:gbs?|gigabytes?)$/i]

 * year use the calendar average, so "600 requests/month" reads as 20/day and lands in the
 * same column as "50 images/day" instead of looking ten times bigger. A period needs either
 * a connector ("per day", "/day", "a day") or to be the first word after the amount, so the
 * "3-day trial" in "50 free images (3-day trial)" is a trial length, not a quota period. */

  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*hours?\b|^\s*(?:hour|hourly|hours)\b/i, per: "hour", rate: 24 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*days?\b|^\s*(?:day|daily|days)\b/i, per: "day", rate: 1 },
  { re: /(?:\/|per\s+|a\s+|an\s+|each\s+|every\s+)\s*weeks?\b|^\s*(?:week|weekly|weeks)\b/i, per: "week", rate: 1 / 7 },

const Q_GRANT = /\b(?:free|bonus|trial|starter|complimentary)\b/i;
const Q_GRANT_BEFORE = /\b(?:free|trial|starter|complimentary|bonus)\b[^.!?]{0,12}$/i;

 * states none — the page shows a dash there rather than an invented figure. */

     * the amount outright. */

    while ((w = Q_WORD.exec(between)) && words++ < Q_WORDS_MAX) {
      const u = qUnit(w[0]);

    }
    if (!unit) continue;
    const granted = unit === "credits" || Q_GRANT.test(between.slice(0, end)) || Q_GRANT_BEFORE.test(before);
    const after = between.slice(end, end + 26);
    let per = "", rate = 0, spanAt = 0, spanLen = 0;

      const hit = p.re.exec(after);

    }
    if (!per && Q_BEFORE.test(before)) per = "day";
    /* No period and no grant: an amount on its own is not an allowance, so no chip. */
    if (!per && !granted) continue;

      at: m.index,
      score: (per && per !== "total" ? 4 : 0) + (Q_DAY_UNITS.test(unit) ? 2 : 0) + (unit === "credits" ? 1 : 0) + (per === "day" ? 1 : 0),

        n: Math.round(n), unit: unit, per: per || "total", perDay: perDay,
        raw: hay.slice(m.index, m.index + m[0].length + end + spanAt + spanLen).replace(/\s+/g, " ").trim().slice(0, 80)

    /* Several amounts can appear (a free tier plus a paid one): take the most useful —
     * a stated period over a bare grant, a generative unit over infrastructure — and the
     * earliest when they tie. */
    found.sort((a, b) => (b.score - a.score) || (a.at - b.at));

  return null;

   plus one bar per day for the cards closed, so the shape of the window is visible and not just the
   totals. Everything is derived from what is already stored. Two fields did not exist before and
   are recorded from now on: when a card was completed (set in setDone/kbSet, cleared on un-done,
   as a timestamp so the *local* day is what counts) and how long a focus session actually ran

function renderNotes(){const el=$("#wb_notes");if(!el)return;el.innerHTML="";if(!notes.length){const p=document.createElement("p");p.className="muted";p.textContent=t("noteEmpty");el.appendChild(p)}notes.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts).forEach(n=>{const row=document.createElement("div");row.className="nrow";const tx=document.createElement("div");tx.className="ntext";tx.textContent=n.text;row.appendChild(tx);const meta=document.createElement("div");meta.className="nmeta";if(n.pin){const p=document.createElement("span");p.className="npin";p.textContent="📌 "+t("notePin");meta.appendChild(p)}const cp=document.createElement("button");cp.className="mini";cp.textContent=t("noteCopy");cp.onclick=async()=>{try{await navigator.clipboard.writeText(n.text);toast(t("copied"))}catch(e){toast("✕")}};const pin=document.createElement("button");pin.className="mini";pin.textContent=n.pin?t("noteUnpin"):t("notePin");pin.onclick=()=>{n.pin=!n.pin;noteSave();renderNotes()};const del=document.createElement("button");del.className="mini";del.textContent=t("del");del.onclick=async()=>{if(await confirmModal(t("del"),n.text.slice(0,60),t("yesDel"))){notes=notes.filter(x=>x.id!==n.id);noteSave();renderNotes()}};meta.appendChild(cp);meta.appendChild(pin);meta.appendChild(del);row.appendChild(meta);el.appendChild(row)});const r=document.createElement("div");r.className="row";r.style.marginTop="10px";const inp=document.createElement("input");inp.type="text";inp.placeholder=t("notePh");inp.setAttribute("aria-label",t("noteAdd"));inp.style.flex="1";const add=document.createElement("button");add.className="btn";add.textContent=t("noteAdd");const put=()=>{const v=inp.value.trim();if(!v)return;inp.value="";notes.unshift({id:"n"+Date.now(),text:v,ts:Date.now(),pin:false});noteSave();renderNotes()};add.onclick=put;inp.addEventListener("keydown",e=>{if(e.key==="Enter")put()});r.appendChild(inp);r.appendChild(add);el.appendChild(r)}
/* ============ boot ============ */
/* Every card is painted by its own registry row, in the order those rows are written, so a card
   that exists in the registry is drawn and one deleted from it cannot be left behind here. */
function renderAll(){PAGES.forEach(ids=>ids.forEach(id=>{const c=CARDS[id];if(c&&c.draw)c.draw()}))}
/* A day boundary is a data boundary: roll over before the first paint, then keep it honest while
   the page stays open - a midnight timer and a return to the tab. Only a real move re-renders. */
const __rolled=rollOverdue();if(__rolled)toast(digits(__rolled)+" "+t("carried"));
/* A default order stops being a default the moment someone drags a card. A saved order from
   an older layout would hide this release's arrangement, so it is dropped once per revision -
   hiding a card stays the user's own choice and is kept. */
if(!store.bad.pd_settings&&settings.orderRev!==LAYOUT_REV){settings.order={};settings.orderRev=LAYOUT_REV;if(!store.missing.pd_settings)saveSettings()}
applyPrefs();buildPages();applyLayoutMode();renderTabs();
/* A card that fills in after its fetch - weather, prayer, a quote - or a board that gains a card
   changes the height of the section it lives in. On the phone the box that holds the swipe has a
   fixed height, so it is measured again here; on the desktop the page is in normal flow and the
   grid already grew. One observer over the section bodies covers every card in them, including
   the ones rebuilt in place. */
try{const ro=new ResizeObserver(()=>{sizePageBox()});
 document.querySelectorAll("#pages .page-inner").forEach(n=>ro.observe(n))}catch(e){}
armRollover();
/* Reminders are resumed, not re-requested: an armed device silently re-sends its schedule so
   the Worker never reminds about a card list that was edited in a previous session. */
pushResume();
swBoot();
watchNotif();
/* The records have already painted from localStorage; this is the safety net behind them. A
   restore only fills keys that are missing, never an empty list the user chose, and the first
   snapshot is taken here for a device upgrading to this version. */
snapRestore().then(()=>{if(!snapAt)snapSave();
 /* every device registers on its first visit and saves its one log; from then on the debounced
    save after every change keeps that same object current */
 try{logEnsure();setTimeout(()=>{try{if(logConf())logSave(false)}catch(e){}},4000)}catch(e){}});
armPersist();paintLog();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){rollNow();pushSyncSoon();swCheck()}else{viewSave()}});
/* Opening the dashboard is opening it, not resuming the document: with no link naming a section
   it lands on Home at the top. A reload is the one case that is not an opening - you pressed the
   button with the page right where you left it, so it must come back exactly there, section and
   offset both.

   A refresh is not always a reload of this document: a window that refreshes by opening the page
   again - the desktop app's own reload button, a webview that starts a fresh session - throws the
   session away, and with it the only record there was, so the dashboard came back on Home while
   the reader had not moved. So the place is kept twice. sessionStorage is still the one that tells
   a reload from a new visit: it belongs to this tab (and to this installed app's window), so a
   plain reload keeps it and closing the app forgets it. Beside it sits a copy in the local store, carrying the
   address it was taken at and the minute it was taken, and that copy is honoured while it is
   young - a page left under a minute ago is the page being refreshed, anything older is a new
   visit, and a new visit opens on Home. The one case that is not a visit is the installed app
   being closed and opened again: there is no session left to inherit, so the local copy is the
   only record, and it is honoured for a week when the page is running as the installed app. The
   browser's own restoration stays off, because it restores an offset without the section that
   offset belongs to. A ?p= link still opens its section, at that section's top. */
if("scrollRestoration" in history)history.scrollRestoration="manual";
const VIEW_KEY="pd_view";
/* how long a place left in the local store still counts as "the page you are refreshing" */
const VIEW_FRESH=60*1000;
let viewLock=0;
/* Both stores, every time: the scroll handler has already coalesced this to a few writes a
   second, and a copy that lags the position by even a moment is a copy that puts the wrong
   place back when the page is torn down right after a scroll. */
function viewSave(){if(viewLock)return;
 const at=Date.now();
 const v={p:curPage,y:Math.round(scrollY),x:Math.round(($("#pages")||{}).scrollLeft||0),t:at};
 viewSave.y=v.y;viewSave.x=v.x;
 try{sessionStorage.setItem(VIEW_KEY,JSON.stringify(v))}catch(e){}
 try{localStorage.setItem(VIEW_KEY,JSON.stringify({p:v.p,y:v.y,x:v.x,t:at,u:location.pathname+location.search+location.hash}))}catch(e){}}
/* A relaunch is not a visit. sessionStorage is the record of the sitting you are still in, and an
   installed app has none after it is closed - closing it ends that session with it - so the local
   store is the only trace of where you were, and the 60-second window that tells a refresh from a
   new tab would throw it away. Running as the installed app, that record is allowed to be days old
   (a week); a plain tab visit still opens on Home, which is the rule that stops a days-old page
   from hijacking a new sitting. */
const INSTALLED=(()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}})();
const VIEW_RESUME=INSTALLED?7*24*60*60*1000:VIEW_FRESH;
const VIEW_SESSION=60*60*1000;
function viewLoad(){
 const ok=(v,maxAge)=>{if(!v||typeof v!=="object")return null;
  if(!(v.p>=0&&v.p<pageCount()))return null;
  /* an hour is longer than any reload: past it this is a different sitting, and a dashboard
     that reopens on a half-read page days later is the thing this avoids. The relaunch above is
     the one exception, and it says so by asking for a longer window. */
  if(!((Date.now()-(v.t||0))<maxAge))return null;return v};
 try{const s=ok(JSON.parse(sessionStorage.getItem(VIEW_KEY)||"null"),VIEW_SESSION);if(s)return s}catch(e){}
 try{const l=ok(JSON.parse(localStorage.getItem(VIEW_KEY)||"null"),VIEW_RESUME);
  if(l&&l.u===location.pathname+location.search+location.hash)return l}catch(e){}
 return null}
/* put the offset back after the layout is there to receive it: once on the next frame, once when
   the document finishes loading, and the record stays quiet until then so a settling page cannot
   overwrite the place with the place it was about to restore */
function viewRestore(v){viewLock=1;
 goPage(v.p,{keepScroll:true,instant:true});
 const want=Math.max(0,v.y||0),wx=Math.round(v.x||0);
 /* The page is taller once its content has arrived than it is in the first frame, and an offset
    put back too early is clamped by the shorter page and stays clamped - which is a refresh that
    looks like it went home. So the offset goes back whenever the document changes height, for as
    long as the restore owns the view: what survives is the recorded number, not the one the
    layout happened to allow at that instant. */
 const put=()=>{try{const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
   if(Math.round(scrollY)!==Math.min(want,max))scrollTo(0,Math.min(want,max));
   const b=$("#pages");if(b&&!isDesktop()&&Math.round(b.scrollLeft)!==wx)b.scrollLeft=wx}catch(e){}};
 requestAnimationFrame(()=>{put();requestAnimationFrame(put)});
 let watch=null;try{watch=new ResizeObserver(put);watch.observe(document.documentElement)}catch(e){}
 const done=()=>{viewLock=0;try{if(watch)watch.disconnect()}catch(e){}};
 window.addEventListener("load",()=>{put();setTimeout(done,80)},{once:true});
 setTimeout(done,1500)}
/* Written while you scroll, on a trailing timer rather than a frame: a pending frame is dropped
   whole when the view is not painting (a backgrounded app, a window that never composites), and
   the guard would then swallow every later scroll too - leaving a stale record for the reload to
   put back. A timer always fires. */
addEventListener("scroll",()=>{if(viewSave.due)return;viewSave.due=setTimeout(()=>{viewSave.due=0;viewSave()},120)},{passive:true});
/* And a clock as well as the events. A window that is not compositing delivers no frame, no
   scroll event and - when it tears the page down itself - no leaving event either, so all three
   ways this used to be told where you were can be silent at once: the reload then put back the
   section you were on and the top of it. The clock is the one signal that always arrives. It
   writes only when the number has actually changed, so a still page writes nothing at all. */
setInterval(()=>{if(viewLock)return;
 const y=Math.round(scrollY),x=Math.round(($("#pages")||{}).scrollLeft||0);
 if(y!==viewSave.y||x!==viewSave.x)viewSave()},1000);
/* Both leaving signals save, whichever state they arrive in: a page being torn down gets one
   chance to say where it stood, and a save that waits for the hidden state - which a webview
   tearing the tab down may never report - is that chance missed. */
addEventListener("pagehide",viewSave);
/* deep links: ?p=3 opens the Planner directly - that is what the manifest shortcuts use. */
const __p=new URLSearchParams(location.search).get("p");
if(__p!==null&&/^\d+$/.test(__p)&&+__p<pageCount())goPage(+__p);
else{const __v=viewLoad();if(__v)viewRestore(__v);else scrollTo(0,0)}
</script>
