<script>
"use strict";
/* ================= CONFIG — placeholders only. Real secrets go in Cloudflare Worker, added later. ================= */
const CONFIG = {
  VERSION: "2.30.5",
  /* Metals data sources for Bring-Your-Own-Key (BYOK). "" = use whatever the Worker is set to. */
  METALS_PROVIDERS: [
    {id:"fastforex", label:"FastForex.io"},
    {id:"metals.dev", label:"Metals.dev"},
    {id:"metalpriceapi", label:"MetalpriceAPI.com"},
    {id:"metals-api", label:"Metals-API (apilayer)"},
    {id:"goldapi-io", label:"GoldAPI.io"},
    {id:"goldapi-net", label:"GoldAPI.net"},
    {id:"twelvedata", label:"Twelve Data"},
    {id:"tradermade", label:"TraderMade"},
    {id:"alphavantage", label:"Alpha Vantage"},
    {id:"api-ninjas", label:"API Ninjas"},
    {id:"gold-api", label:"Gold-API.com (no key needed)"}
  ],
  WORKER_URL: "https://home-dashboard-api.drifter-87.workers.dev",   // Worker API origin (no trailing slash)
  APP_URL: "https://home-dashboard-5ma.pages.dev",                    // deploy URL for QR + install guide
  METALS_API_KEY: "",    // placeholder — DO NOT hardcode. Set METALS_API_KEY as Worker secret instead.
  NEWS_API_KEY: "",      // placeholder — not needed when using Worker /api/news
  GOOGLE_CLIENT_ID: "",  // placeholder — not used in v1 (local .ics only)
  DEFAULT_BASE: "USD",
  NEWS_CACHE_HOURS: 1,
  NEWS_CACHE_KEY: "pd_news_v2",  // new key + schema: the old 24h payload is ignored
  NEWS_SCHEMA: 5                // 5: items carry their free-tier quota
};const CHANGELOG = [
{v:"2.30.5", d:"2026-10-22", en:"Cropping an attached photo now saves the crop that was picked, whichever button finishes the edit. An armed box is honoured by Save & replace, Save a copy and Copy, not only by Apply, so the footer's own Save can no longer write the uncropped file under a success toast. The box is clamped to the picture itself, so a drag that begins in the grey beside a fitted photo no longer arrives shifted and wider than what was picked, and the size under the drag is the size the saved file gets. Fit can zoom below 25%, so a 3024 px phone photo is visible in a phone-sized window, and a file picked into a new card opens the form's long half instead of hiding the attachment behind More fields.", ar:"قصّ صورة مرفقة يحفظ الآن المنطقة التي حُدّدت، أيًّا كان الزر الذي يُنهي التعديل: المربع المحدّد صار مُعتمَدًا في «حفظ واستبدال» و«حفظ نسخة» و«نسخ»، لا في «تطبيق» وحده، فلم يعد زر الحفظ في التذييل يكتب الملف كاملًا غير مقصوص مع رسالة نجاح. والمربع محصور في الصورة نفسها، فالسحب الذي يبدأ في الفراغ الرمادي حول صورة ملاءَمة لا يصل منزاحًا وأوسع مما اختير، والرقم المعروض تحت السحب هو حجم الملف المحفوظ. وصار بإمكان «ملاءمة» التصغير دون ٢٥٪، فتظهر صورة الهاتف بعرض ٣٠٢٤ بكسل داخل نافذة بعرض الهاتف، والملف المختار لبطاقة جديدة يفتح النصف الطويل من النموذج بدل أن يبقى مخفيًا خلف «حقول إضافية»."},
{v:"2.30.4", d:"2026-10-19", en:"An optional encrypted cloud copy, one slot per device: turn it on with a passphrase and each phone seals its own tasks, cards, notes, habits, countdowns, settings and lock record into a slot of its own, so a phone that loses everything can list the slots, pick its own and restore it. Ten devices never overwrite each other, restoring is never automatic, and a deploy still touches no device's data.", ar:"نسخة سحابية مشفّرة اختيارية، بموضع لكل جهاز: تُشغّلها بعبارة سرّية، فيختم كل هاتف مهامه وبطاقاته وملاحظاته وعاداته وعدّاداته وإعداداته وقفل العبارة في موضعه الخاص، فالهاتف الذي يفقد كل شيء يسرد المواضع ويختار موضعه ويستعيده. عشرة أجهزة لا يكتب بعضها فوق بعض، والاستعادة لا تحدث تلقائياً، والنشر لا يمس بيانات أي جهاز."},
{v:"2.30.3", d:"2026-10-19", en:"The Settings card now says when the device backup was taken instead of \"no backup yet\" while one exists: the line is repainted when a snapshot lands, and it names the saved time and whether storage is protected.", ar:"تعرض بطاقة الإعدادات وقت أخذ النسخة الاحتياطية بدل عبارة «لا نسخة احتياطية بعد» مع وجودها: يُعاد رسم السطر عند حفظ النسخة، ويذكر وقت الحفظ وما إذا كان التخزين محمياً."},
{v:"2.30.2", d:"2026-10-19", en:"Saved work survives what the phone does to its storage: tasks, settings, cards and countdowns are mirrored into a device backup and put back when the browser drops them, while news and price caches stepped out of the store a phone clears first. Settings shows when that backup was taken and can restore it on demand.", ar:"يبقى عملك المحفوظ في مأمن مما يفعله الهاتف بالتخزين: تُنسخ المهام والإعدادات والبطاقات والعدادات احتياطياً على الجهاز وتُستعاد إذا حذفها المتصفح، بينما خرجت ذاكرات الأخبار والأسعار من التخزين الذي يُمسح أولاً. تعرض الإعدادات وقت أخذ النسخة وتتيح استعادتها عند الحاجة."},
{v:"2.30.1", d:"2026-10-19", en:"At three grid columns the crypto card's two-column list ran wider than the card itself, so Ethereum's price and the change beside it were cut off at the right edge. The name yields first now - it ellipsizes - and the row is allowed to shrink to its own column, so the price and the change are always whole: the numbers are what the card is for, and a coin's long name is not.", ar:"عند ثلاثة أعمدة كانت قائمة العملات ذات العمودين في بطاقة العملات الرقمية أعرض من البطاقة نفسها، فانقطع سعر إيثيريوم والتغيير بجانبه عند الحد الأيمن. يتنازل الاسم أولاً الآن — يُختصر بنقاط — ويُسمح للسطر بأن ينكمش إلى عموده، فيبقى السعر والتغيير كاملين دائماً: الأرقام هي غرض البطاقة، وليس اسم العملة الطويل."},
{v:"2.30.0", d:"2026-10-19", en:"This release closes the empty columns the last two opened. A row grid gives every card in a row the same top edge, so a 165px clock sat beside a 549px weather card and the next card began 372px lower than it needed to - the space was the page's rather than a stretched card's, but it was still 372px of nothing. On the desktop the cards now pack down their columns in the page's own order: each card takes the grid rows its own height needs, in whichever column is shortest, so the card that follows sits directly under the one before it. Nothing is stretched, nothing overlaps and no card is reordered - a column still reads in the order the page announces. Home is about 990px tall at 1280 instead of 1507px. The weather card reads better too: the twelve hours are a six-by-two grid at every width above a phone, so no label is cut in half at the card's edge, and the five-day forecast is five tiles led by the weekday with the high above the low and the full date in the tooltip, instead of five rows led by an ISO date. The browser contract now measures the packing itself - overlap, contiguity, order and slack, on every section at three widths - rather than the row bands it used to.", ar:"يغلق هذا الإصدار الأعمدة الفارغة التي فتحها الإصداران السابقان. كانت شبكة الصفوف تعطي كل بطاقة في الصف حدًّا أعلى واحداً، فتقف ساعة بارتفاع 165 بكسل بجانب بطاقة طقس بارتفاع 549 بكسل، وتبدأ البطاقة التالية أخفض بـ372 بكسل مما تحتاج — كان الفراغ فراغ الصفحة لا فراغ بطاقة ممدودة، لكنه ظل 372 بكسل من لا شيء. على سطح المكتب تتراصّ البطاقات الآن في أعمدتها بترتيب الصفحة نفسه: تأخذ كل بطاقة من صفوف الشبكة بقدر ارتفاعها، في العمود الأقصر حالاً، فتجلس البطاقة التالية مباشرة تحت سابقتها. لا تمديد ولا تراكب ولا إعادة ترتيب — يُقرأ العمود بالترتيب الذي تعلنه الصفحة. ويصير ارتفاع الرئيسية نحو 990 بكسل عند عرض 1280 بدل 1507. وتُقرأ بطاقة الطقس أفضل أيضاً: الساعات الاثنتا عشرة شبكة من ستة في صفّين عند كل عرض يتجاوز الهاتف، فلا يُقطع وسم في نصفه عند حد البطاقة، وتوقعات خمسة أيام خمس بطاقات صغيرة يتصدّرها اسم اليوم مع العظمى فوق الصغرى والتاريخ الكامل في التلميح، بدل خمسة أسطر يتصدّرها تاريخ بصيغة ISO. ويقيس عقد المتصفح التراص نفسه الآن — التراكب والاتصال والترتيب والفراغ — في كل قسم وثلاثة عروض، بدل نطاقات الصفوف التي كان يقيسها."},
{v:"2.29.0", d:"2026-10-19", en:"On a wide desktop the time-travel chart takes the whole row. At three columns it was the fourth card, so it began a row alone and left two thirds of that row as page background; it spans the row there instead, and grows taller with the width it is given - about 250px at the dashboard's full 1,100 - so a 417-point series is read across the page rather than in a narrow column. Two columns already put it beside Metals in a full row, and the phone gives every card a row of its own, so neither changes.", ar:"على سطح المكتب العريض يأخذ مخطط السفر عبر الزمن الصف كله. فقد كان في ثلاثة أعمدة البطاقة الرابعة، فيبدأ صفًّا وحده ويترك ثلثي ذلك الصف فراغًا؛ وصار يمتد على الصف هناك، ويكبر ارتفاعًا مع العرض الذي يُمنحه — نحو 250 بكسل عند عرض اللوحة الكامل 1100 — فيُقرأ مسار من 417 نقطة على عرض الصفحة لا في عمود ضيّق. أما العمودان فيضعانه أصلًا بجوار المعادن في صف كامل، والهاتف يعطي كل بطاقة صفّها، فلا يتغيّر أيّهما."},
{v:"2.28.0", d:"2026-10-19", en:"The time-travel chart can be read month by month and against a labelled axis now. Two month pickers narrow the series without another request - pick August 2020 to January 2021 and the line, and the y-axis with it, covers only the prices in that window, the caption states the window, and All brings the whole history back. The y-axis carries round tick labels and faint gridlines, and the cursor is a crosshair that carries the point's value horizontally to the axis, where a chip names it. The cursor is one of the drawn points rather than one of a hundred slider steps, so dragging reaches every price and every peak; the canvas is sized in the pixels it is displayed at, which is what finally puts the dot on the line it belongs to. On the desktop a card is no longer stretched to the tallest in its row: the empty space a tall neighbour used to leave inside a shorter card - 411px under the clock on this screen - is gone, a card ends where its reading ends, and the row still keeps one top edge.", ar:"يمكن الآن قراءة مخطط السفر عبر الزمن شهراً بشهر وعلى محور مُعلَّم. يضيّق منتقيا الشهر السلسلة دون طلب جديد — اختر أغسطس 2020 إلى يناير 2021 فيغطي الخط والمحور الرأسي معه أسعار تلك النافذة وحدها، ويذكر التعليق النافذة، ويعيد زر «الكل» التاريخ كاملاً. ويحمل المحور الرأسي علامات مستديرة وخطوط شبكة خفيفة، والمؤشر تقاطع يحمل قيمة النقطة أفقياً إلى المحور حيث تسمّيها شريحة. والمؤشر نقطة من النقاط المرسومة لا واحدة من مئة خطوة للمنزلق، فيبلغ السحب كل سعر وكل قمة؛ وقياس اللوحة صار بالبكسل الذي تُعرض به، وهو ما يضع النقطة أخيراً على خطها. وعلى سطح المكتب لم تعد البطاقة تُمدّ إلى أطول بطاقة في صفّها: الفراغ الذي كان الجار الطويل يتركه داخل البطاقة القصيرة — 411 بكسل تحت الساعة على هذه الشاشة — قد ذهب، فتنتهي البطاقة حيث تنتهي قراءتها ويحتفظ الصف بحدّ أعلى واحد."},
{v:"2.27.0", d:"2026-10-18", en:"Closing the app and opening it again comes back to where you were, not to Home. The place was always kept twice, but the copy outside the session was honoured for a minute - long enough for a refresh, short enough that a reopened app looked like a first visit - so as the installed app that copy is now trusted for a week, while a plain tab visit still opens on Home. The page that ships also stops allowing inline script wholesale: the bundle computes the SHA-256 of its one script block and pins it in the meta tag and in the response header, so anything injected into the document has a different hash and cannot run. The source keeps the old allowance so the file you open while working still runs, the gate refuses to publish a bundle whose hash is not the hash of the bytes it carries, and the browser contract loads the shipped copy to prove it boots and refuses an injected script. And a passphrase can now seal what used to sit in the clear: the bytes of every attachment and the metals provider key. Both are sealed with AES-GCM under a key derived from the passphrase with PBKDF2-SHA256 (310,000 iterations), and the passphrase itself is stored nowhere - only a random salt and an encrypted check value are. The key lives in memory for the session, so a relaunch locks again, and the passphrase is asked where it is needed rather than at boot: opening a sealed file, or the provider-key field. Files attached before the passphrase was set are sealed in place, removing the protection puts them back exactly as they were, and the settings card says plainly that there is no recovery code, no reset and no way around it.", ar:"إغلاق التطبيق وفتحه من جديد يعيدك إلى حيث كنت، لا إلى الصفحة الأولى. كان الموضع محفوظًا مرّتين دائمًا، لكن النسخة خارج الجلسة كانت تُعتمد لدقيقة — تكفي لتحديث، وتقصر عن أن يُقرأ تطبيقٌ أُعيد فتحه كزيارة أولى — فصارت هذه النسخة موثوقة أسبوعًا حين يعمل التطبيق مثبّتًا، بينما تبقى زيارة التبويب العادية تفتح على الصفحة الأولى. والصفحة التي تُنشر لم تعد تسمح بالبرمجة المضمّنة جملةً: تحسب عملية التجميع بصمة SHA-256 لكتلة السكربت الوحيدة وتثبّتها في وسم الميتا وفي ترويسة الاستجابة، فما يُحقن في الصفحة بصمته مختلفة ولا يعمل. ويُبقي الملف المصدر السماح القديم ليعمل الملف الذي تفتحه أثناء العمل، ويرفض البوّاب نشر حزمة بصمتها ليست بصمة البايتات التي تحملها، ويحمّل عقد المتصفح النسخة المنشورة ليثبت أنها تعمل وترفض سكربتًا محقونًا. وصارت عبارة سرّية تختم ما كان مكشوفًا: بايتات كل مرفق ومفتاح مزوّد بيانات المعادن. يُختم الاثنان بـ AES-GCM بمفتاح مشتق من العبارة عبر PBKDF2-SHA256 (310,000 دورة)، والعبارة نفسها لا تُخزَّن في أي مكان — يُخزَّن ملح عشوائي وقيمة تحقّق مشفّرة فقط. ويعيش المفتاح في الذاكرة مدة الجلسة، فإعادة التشغيل تُقفل من جديد، وتُطلب العبارة حيث تُحتاج لا عند الإقلاع: عند فتح ملف مختوم أو عند حقل مفتاح المزوّد. والملفات المرفقة قبل تعيين العبارة تُختم في مكانها، وإزالة الحماية تُعيدها كما كانت بالضبط، وتقول بطاقة الإعدادات صراحةً أنه لا رمز استرداد ولا إعادة تعيين ولا طريق آخر."},
{v:"2.26.0", d:"2026-10-18", en:"The height a band hands a card is spent on the reading now instead of collecting as blank space under it. Three cards take it. The review card's chart grows to fill what it is given, so the busiest day of the window is the full height of the card rather than a bar inside a stub of a track, and a week or a month can be read at a glance; a task list spreads its rows through the height, first row at the top and last at the foot, instead of stopping halfway down the card; and a short read - the quote of the day, the next countdown - sits in the middle of the height rather than at the top of a box with nothing under it. A bar is a share of its track rather than a number of pixels now, so nothing is measured and nothing has to be measured again when the card changes size. All three are built from flex and percentages, never from a height a card could grow from: a card that grew from the height it was handed would feed its own band taller on every pass. The browser contract proves each of them by handing a card a band's height and then taking it back - the card must return to the height its own content wants - and checks that the phone, where every card has a row of its own, is unchanged.", ar:"الارتفاع الذي يمنحه الشريط لبطاقة صار يُصرف على القراءة بدل أن يتجمّع فراغًا تحتها. وثلاث بطاقات تأخذه: مخطط بطاقة المراجعة يكبر ليملأ ما أُعطي، فيكون أزحم يوم في النافذة بارتفاع البطاقة كله لا شريطًا في مسار قصير، ويُقرأ الأسبوع أو الشهر بنظرة؛ وقائمة المهام توزّع صفوفها على الارتفاع، أول صفّ في الأعلى وآخرها في الأسفل، بدل أن تتوقّف في منتصف البطاقة؛ والقراءة القصيرة — اقتباس اليوم والعدّاد القادم — تجلس في وسط الارتفاع لا في أعلى صندوق لا شيء تحته. وصار الشريط نسبةً من مساره لا عددًا من البكسلات، فلا قياس ولا إعادة قياس إذا تغيّر حجم البطاقة. والثلاثة مبنيّة من المرونة والنِسب، لا من ارتفاع يمكن للبطاقة أن تنمو منه: فبطاقة تنمو من الارتفاع الذي أُعطيته ستُطيل شريطها في كل مرور. ويثبت عقد المتصفح كلًّا منها بأن يمنح البطاقة ارتفاع شريط ثم يأخذه — فيجب أن تعود إلى الارتفاع الذي يريده محتواها — ويتحقّق من أن الهاتف، حيث لكل بطاقة صفّها الخاص، لم يتغيّر."},
{v:"2.25.3", d:"2026-10-18", en:"A refresh keeps the offset inside the section now, not only the section, on a view that never paints. The place was written when the page was scrolled, when it was hidden and when it was left - three signals a window that is not compositing never delivers, and that window is the app's own: there the dashboard saw none of them, so a reload put back the section you were on and the top of it. The position is read on a clock as well now, once a second, which is the one signal that always arrives; it writes only when the number has actually changed, so a still page writes nothing. The browser contract proves it by loading the page into a browser that swallows every scroll listener - the same silence this window gives it - and requiring the record to be taken anyway. The sweep over six sections at three widths and the refresh in a second session are unchanged.", ar:"صارت إعادة التحميل تحفظ الإزاحة داخل القسم، لا القسم وحده، على عرض لا يرسم أبدًا. كان المكان يُكتب عند التمرير وعند إخفاء الصفحة وعند مغادرتها — ثلاث إشارات لا تصل من نافذة لا تركّب شيئًا، وهي نافذة التطبيق نفسه: هناك لم ترَ اللوحة أيًّا منها، فكانت إعادة التحميل تُعيد القسم الذي فيه أنت وأعلاه. وصار الموضع يُقرأ على مدار ساعة أيضًا، مرة كل ثانية، وهي الإشارة الوحيدة التي تصل دائمًا؛ ولا يكتب إلا حين يتغيّر الرقم فعلًا، فالصفحة الساكنة لا تكتب شيئًا. ويثبته عقد المتصفح بأن يحمّل الصفحة في متصفح يبتلع كل مستمع تمرير — نفس الصمت الذي تمنحه هذه النافذة — ويشترط أن يُؤخذ السجل رغم ذلك. أما مسح الأقسام الستة في ثلاثة عروض والتحديث في جلسة ثانية فباقيان كما هما."},
{v:"2.25.2", d:"2026-10-18", en:"Pressing reload keeps the exact place you left, in every section and at every width - including the refresh the app's own button performs, which does not reload the page you are on but opens it again in a new session, and that is the one that used to send you to Home. Three faults met in it. A refresh that starts a new session throws sessionStorage away, and the place lived only there; it is kept in the local store as well now, carrying the address it was taken at and the minute it was taken, and that copy is honoured for a minute - a page left longer ago than that is a new visit, and a new visit still opens on Home. An offset put back too early was clamped by a page that had not finished growing, and stayed clamped, which is a refresh that lands short of your place; it is re-applied whenever the document changes height, for as long as the restore owns the view, so what survives is the number that was recorded. And the record itself was written from a frame, which a view that is not painting never delivers: the pending write was dropped, the guard left set swallowed every later scroll with it, and the reload then put back a position you had already left. It is written from a trailing timer now, which always fires. The browser contract grew to prove all three: every section at three widths, each left at a real offset and reloaded, with the card at the top edge recorded alongside it - a y that comes back to the same number while the content under it has moved is still the wrong place; a run that saves with frames deliberately stubbed out; and a run that comes back in a second session.", ar:"إعادة التحميل تحفظ الآن المكان نفسه الذي تركته، في كل قسم وفي كل عرض — بما في ذلك تحديث زر التطبيق نفسه، فهو لا يُعيد تحميل الصفحة التي أنت عليها بل يفتحها من جديد في جلسة جديدة، وهو ما كان يقذفك إلى الرئيسية. ثلاثة عيوب التقيا فيه. تحديثٌ يبدأ جلسة جديدة يرمي sessionStorage ويهدم السجل الذي كان يسكنه وحده؛ فصار المكان محفوظًا في المخزن المحلي أيضًا، حاملًا العنوان الذي أُخذ فيه والدقيقة التي أُخذ فيها، ويُعتمد ذلك النسخ لدقيقة واحدة — وما تُرك قبلها فهو زيارة جديدة، والزيارة الجديدة تُفتح على الرئيسية كما كانت. والإزاحة المُعادة مبكرًا كان يقصّها مقاس صفحة لم تكتمل، وتبقى مقصوصة، فتصل إعادة التحميل قبل مكانك؛ وصارت تُعاد كلما تغيّر ارتفاع المستند ما دامت الاستعادة تملك العرض، فيبقى الرقم الذي سُجِّل. وكان السجل نفسه يُكتب من إطار رسم لا يصل إن كان العرض لا يرسم: يسقط التسجيل المنتظر، ويبقى الحارس قائمًا فيبتلع كل تمرير بعده، فتعيد إعادة التحميل موضعًا تركته من زمن؛ صار يُكتب بمؤقّت متأخر يعمل دائمًا. وكبر عقد المتصفح ليثبت الثلاثة: كل قسم في ثلاثة عروض، يُترك على إزاحة حقيقية ويُعاد تحميله، وتُسجَّل معه البطاقة التي عند الحافة العليا — لأن عودة الرقم نفسه وقد تحرّك ما تحته ليست مكانك؛ ومرة تُخنق فيها الإطارات عمدًا؛ ومرة يعود في جلسة ثانية."},
{v:"2.25.1", d:"2026-10-17", en:"Pressing reload now puts you back exactly where you were - the same section, the same offset - instead of throwing you back to Home. The section you are on and the distance down it are recorded as you scroll, and put back when the document loads again: once on the next frame and once more when the document has finished loading, because the layout has to exist before an offset means anything. What keeps a new visit at Home is where that record lives: sessionStorage belongs to the tab (and to the installed app's own window), so the reload button finds it, closing the app does not, and a second tab opens on Home at the top. Wiping the local data clears the record with it, and the address still records nothing - a ?p= link remains the only way to open anywhere but Home. The browser's own scroll restoration stays off for the reason it was turned off: it brings back an offset without the section that offset belonged to.", ar:"الضغط على إعادة التحميل يعيدك الآن إلى مكانك بالضبط — القسم نفسه، والمسافة نفسها — بدل أن يقذفك إلى الرئيسية. يُسجَّل القسم الذي أنت فيه ومقدار النزول فيه أثناء التمرير، ويُعاد عند تحميل الصفحة من جديد: مرة في الإطار التالي ومرة عند اكتمال التحميل، لأن التخطيط يجب أن يكون قائمًا قبل أن تعني الإزاحة شيئًا. والذي يُبقي الزيارة الجديدة على الرئيسية هو مكان ذلك السجل: فهو في sessionStorage الذي يخص التبويب (ونافذة التطبيق المثبَّت)، فزر إعادة التحميل يجده وإغلاق التطبيق لا يجده، وتبويب آخر يُفتح على الرئيسية من أعلاها. ومسح البيانات المحلية يمسح السجل معه، والعنوان لا يسجّل شيئًا كما كان — ورابط ?p= يبقى الطريق الوحيد لفتح قسم غير الرئيسية. وتبقى استعادة التمرير الخاصة بالمتصفح مطفأة للسبب نفسه: قد تُرجع إزاحةً بلا القسم الذي تنتمي إليه."},
{v:"2.25.0", d:"2026-10-17", en:"Every section now ends where its own content ends, and the desktop rows line up. On the phone the box that holds the swipe is measured to the section you are on and measured again whenever that section's cards change height, so a board that gains a card makes the page taller by exactly that card and by nothing else - the filler div that used to pad the end of a short section is gone, and so is the second scrollbar it was hiding behind. On the desktop the two- and three-column layouts were columns of different heights interleaving, so no row's cards shared a top or a bottom and every gap beside a short card read as a hole; they are bands now, one row one top and one bottom, each as tall as its tallest card, and the height a short card does not need is spent as spacing inside its own border rather than as a gap in the page. The security pass that came with it: the hosted page refuses to be framed, because a framed copy under a transparent overlay can make a tap land on Wipe all data, and a meta tag cannot say that - the policy now ships as a response header too, and the harness compares the header policy to the page's own directive by directive, so the two cannot drift; a foreign origin is answered with no CORS grant at all rather than the literal null, which is exactly what a sandboxed frame's own Origin header matches; every JSON answer names its type, refuses to be sniffed and forbids caching; a ticker, a list of currencies and a CoinGecko id are held to the shape of a ticker before they become part of an upstream URL or a cache key; an attached PDF opens in a frame sandboxed to nothing, since a file that is not really a PDF must not be able to run as one on the app's own origin; and a reminder notification can only navigate to this site, never away from it. One live check was flaky and is fixed at its root: a coin priced abroad was compared bar for bar with its USD run including the newest bar, which Yahoo stamps with the clock of the fetch itself, so two calls seconds apart disagreed - the closed bars are now compared exactly and the open one only has to be the same week.", ar:"كل قسم ينتهي الآن عند نهاية محتواه، وصفوف سطح المكتب على استقامة واحدة. في الهاتف يُقاس الصندوق الذي يحتضن السحب على القسم الذي أنت فيه، ويُقاس من جديد كلما تغيّر ارتفاع بطاقات ذلك القسم، فلوحة تكسب بطاقة تجعل الصفحة أطول بتلك البطاقة وحدها لا بغيرها — وقد اختفى الحشو الذي كان يُضاف في نهاية قسم قصير، واختفت معه أشرطة التمرير الثانية التي كان يخفيها. وعلى سطح المكتب كانت الأعمدة ذات ارتفاعات مختلفة تتشابك، فلا صفّ تشترك بطاقاته في أعلى ولا في أسفل، وكل فراغ بجانب بطاقة قصيرة كان يُقرأ كثغرة؛ صارت الصفوف الآن أشرطة، لكل صفٍّ أعلى واحد وأسفل واحد، وارتفاع كل شريط بارتفاع أطول بطاقة فيه، والارتفاع الذي لا تحتاجه بطاقة قصيرة يُصرف تباعدًا داخل إطارها بدل أن يصير فجوة في الصفحة. ومعه جولة الأمان: الصفحة المنشورة ترفض أن تُحتوى في إطار، لأن نسخة محتواة تحت طبقة شفافة قد تجعل نقرة تهبط على زر حذف كل البيانات، ووسم meta لا يستطيع قول ذلك — فصارت السياسة تُرسَل ترويسةً أيضًا، ويقارن الفاحص ترويسة السياسة بسياسة الصفحة بندًا بندًا فلا تفترقان؛ والأصل الأجنبي يُجاب بلا أي سماح CORS بدل الكلمة null التي يطابقها ترويسة Origin الصادرة من إطار معزول؛ وكل إجابة JSON تسمّي نوعها وترفض التنقيح وتحرّم التخزين المؤقت؛ والرمز وسَوق العملات ومعرّف CoinGecko تُقيَّد بشكل الرمز قبل أن تدخل في رابط خارجي أو في مفتاح تخزين؛ وملف PDF المرفق يُفتح في إطار معزَّل تمامًا، لأن ملفًا ليس PDF حقًا يجب ألا يعمل كـ PDF على أصل التطبيق نفسه؛ والإشعار التذكيري لا ينتقل إلا إلى هذا الموقع ولا يغادره. وفحص حيّ واحد كان متذبذبًا وأُصلح من جذره: عملة مُسعَّرة بعملة أخرى كانت تُقارَن شريطًا بشريط مع نسختها بالدولار بما في ذلك أحدث شريط، وهو شريط يختمه ياهو بساعة الجلب نفسه، فطلبان يفصل بينهما ثوانٍ يختلفان — صارت الأشرطة المغلقة تُقارن بدقة، والمفتوح يُشترط فيه أن يكون في الأسبوع نفسه."},
{v:"2.24.0", d:"2026-10-17", en:"A file a card carries now opens where it lives. Pressing an attachment's name opens a viewer sheet above whatever you were in - the card's file list or the card form itself - and an image arrives with zoom from 25% to 400% and a Fit beside it, five colour filters that take effect as you pick them, a crop you drag on the picture and apply at the file's own resolution, and a Copy that puts the picture as you are looking at it - cropped, and in the grey you filtered it to - on the clipboard rather than the raw file. A crop can be downloaded or kept as a copy on the same card, and the stored original is never overwritten. Text and scripts zoom their type and copy their words; a PDF is handed to the browser's own viewer, whose zoom the buttons drive; a spreadsheet, which this page cannot paint, says so instead of showing an empty stage. And attachment names are search results in the main search bar, listed with the card they belong to, so searching \"invoice\" finds the file rather than the card that merely mentions it; the command palette lists them too. One silent fault went with it: the page's own security policy allowed images from data: only, so no picture held in the browser could ever be shown - the policy now admits the page's own file bytes, which is the line that made the viewer possible at all.", ar:"الملف الذي تحمله البطاقة يُفتح الآن في مكانه. الضغط على اسم المرفق يفتح نافذة عرض فوق ما كنت فيه — قائمة ملفات البطاقة أو نموذج البطاقة نفسه — والصورة تصل بتكبير من ٢٥٪ إلى ٤٠٠٪ وبجانبه زر ملاءمة، وخمسة مرشّحات لون تعمل فور اختيارها، وقص تسحبه على الصورة ويُطبَّق بدقة الملف الأصلية، وزر نسخ يضع الصورة كما تراها — مقصوصة وبالرمادي الذي رشّحتها إليه — في الحافظة بدل الملف الخام. ويمكن تنزيل القص أو حفظه نسخةً على البطاقة نفسها، والملف الأصلي المخزَّن لا يُستبدل أبدًا. والنصوص والسكربتات تُكبَّر حروفها وتُنسخ كلماتها؛ وأما PDF فيُسلَّم إلى عارض المتصفح نفسه وأزرارنا تقود تكبيره؛ وجدول البيانات الذي لا تستطيع هذه الصفحة رسمه يقول ذلك بدل أن تعرض مسرحًا فارغًا. وأسماء المرفقات صارت نتائج في شريط البحث الرئيسي مذكورة مع البطاقة التي تنتمي إليها، فالبحث عن «invoice» يجد الملف لا البطاقة التي تذكره عرضًا؛ ولوحة الأوامر تسردها أيضًا. ومعه عيب صامت واحد أُصلح: سياسة أمان الصفحة كانت تسمح بالصور من data: فقط، فلم يكن ممكنًا عرض أي صورة محفوظة في المتصفح — والسياسة الآن تسمح لبايتات الصفحة نفسها، وهو السطر الذي جعل العارض ممكنًا أصلًا."},
{v:"2.23.0", d:"2026-10-17", en:"Searching now lands on the word, not just the card. Picking a suggestion used to outline the whole card and leave you to find the keyword inside it; the matched word is now marked in the accent colour for three seconds - long enough to catch the eye, short enough to leave the page as it was - and a shut Settings group holding it opens first, so searching \"language\" opens Appearance and marks Language on screen. A phrase that is not in the card falls back to its first long word that is, and a card with no visible match still outlines as before. Three smaller reads are fixed with it: the GitHub card's star and count moved out of the headline into a right-hand column of fixed width, so every row's star starts on the same edge instead of drifting with the digit count; a news row that states no free allowance draws no chip at all, where it used to draw an empty dashed oval holding a dash; and the QR card's share buttons are a grid of labelled brand tiles - WhatsApp, Instagram, Snapchat, Email, Copy link - drawn as inline marks so they still exist offline, instead of five loose text buttons wrapping over three rows.", ar:"البحث الآن يهبط على الكلمة نفسها لا على البطاقة وحدها. كان اختيار اقتراح يرسم إطارًا حول البطاقة كلها ويترك لك البحث عن الكلمة داخلها؛ والآن تُوسم الكلمة المطابقة بلون التمييز ثلاث ثوانٍ — كافية للفت النظر، وقصيرة بحيث تُترك الصفحة كما كانت — ويُفتح أولًا قسم «الإعدادات» المغلق الذي يحتويها، فالبحث عن \"language\" يفتح «المظهر» ويوسم Language على الشاشة. وإذا لم تكن العبارة في البطاقة يعود إلى أول كلمة طويلة منها موجودة فعلًا، وبطاقة بلا تطابق ظاهر تُحاط كما كانت. وثلاث قراءات أصغر تُصلح معها: نجم بطاقة GitHub وعدده خرجا من العنوان إلى عمود يميني ثابت العرض، فيبدأ نجم كل سطر من الحد نفسه بدل أن يتزحلق مع عدد الأرقام؛ وسطر إخباري لا يذكر حصة مجانية لا يرسم شرطة ولا شكلها البيضاوي المتقطع؛ وأزرار المشاركة في بطاقة الرمز صارت شبكة بلاطات موسومة — واتساب وإنستغرام وسنابشات والبريد ونسخ الرابط — مرسومة داخل الصفحة لتبقى بلا إنترنت، بدل خمسة أزرار نصية تتكسر على ثلاثة أسطر."},
{v:"2.22.2", d:"2026-10-17", en:"A card is now as tall as what it holds. The page's two columns are a grid, and a grid stretches every item to the tallest in its row - so the clock, a one-line quote or the metals list drew a few hundred pixels of empty card below its last line, next to a full-height neighbour. Cards size to their own content now, and the layout contract measures it: it walks all six sections and fails if any card ends more than a line of spacing below its last child, so a stretched card cannot come back unnoticed. One consequence is handled rather than hidden: when hiding a card leaves the page shorter than your offset, you land at the page's end instead of being carried back up toward the card under the header. The case that hides a card above the fold now hides one that is genuinely above it - the old one picked whatever reached past the header, which was a different card once the layout stopped stretching.", ar:"صارت البطاقة بطول محتواها. عمودا الصفحة شبكة، والشبكة تمدّد كل عنصر إلى أطول عنصر في صفه — فكانت بطاقة الساعة أو اقتباس من سطر واحد أو قائمة المعادن ترسم مئات البكسلات من البطاقة الفارغة تحت آخر سطر، بجوار جار ممتلئ. الآن تُقاس البطاقة على محتواها، ويقيسها عقد التخطيط: يمرّ على الأقسام الستة ويفشل إن تجاوزت بطاقة ما مسافة سطر واحد بعد آخر عنصر فيها، فلا تعود بطاقة ممدّدة دون أن يلاحظها أحد. وهناك نتيجة واحدة مُعالجة لا مخفية: إذا أبقى إخفاء بطاقة الصفحة أقصر من موضعك، تهبط على نهاية الصفحة بدل أن تُعاد إلى أعلى نحو البطاقة التي تحت الشريط. وحالة إخفاء بطاقة «فوق الشاشة» صارت تخفي بطاقة فوقها فعلًا — القديمة كانت تختار أول بطاقة تلامس الشريط، وهي بطاقة أخرى بعد أن توقف التمدّد."},
{v:"2.22.1", d:"2026-10-17", en:"Opening the dashboard is opening it, not resuming the document. With the section no longer remembered, the browser still restored its own scroll offset, so Home could open halfway down the page - and it did so only on a slower machine, which is how the layout contract caught it in CI after passing locally. The page now owns its scroll restoration and starts at the top, while a ?p= link still opens its section at that section's top. The contract also stopped reading the phone's pager mid-scroll: it waits for the settled position, so a slow runner measures where the pager came to rest instead of reporting an animation as a bug.", ar:"فتح اللوحة صار فتحًا لا استئنافًا لموضعك. مع إلغاء تذكّر القسم، كان المتصفح لا يزال يعيد موضع التمرير الخاص به، فقد تفتح «الرئيسية» في منتصف الصفحة — ولم يحدث ذلك إلا على جهاز أبطأ، وهكذا التقط عقد التخطيط في CI ما مرّ محليًا. صارت الصفحة تتولّى تمريرها بنفسها وتبدأ من الأعلى، والرابط الذي يحمل ?p لا يزال يفتح قسمه من أعلى ذلك القسم. وتوقّف العقد عن قراءة شريط الهاتف أثناء حركته: ينتظر الموضع المستقر، فيقيس المشغّل البطيء أين استقر الشريط بدل أن يبلّغ عن حركة كأنها عيب."},
{v:"2.22.0", d:"2026-10-17", en:"Reopening the dashboard lands on Home, and only Home. The address used to record the section you were reading (?p=), which meant a closed app came back to Markets or Settings days later; a section is now a place you go, not a memory the app keeps for you, so the address is never rewritten as you move around. A link that names a section still opens it - the manifest's shortcuts and a shared link carry ?p= and keep working - because that is someone handing you a page, not the app remembering. The layout contract grew to match: it now proves a reload opens Home whatever section you left, that a card body holds the height it had while its next batch of data is loading (a bounded wait releases the frame if the new content really is shorter, so a card cannot leave a hole), and that pressing the theme button, a card's refresh or a calendar arrow leaves the section and the offset exactly where they were. That contract is a CI job of its own now, and publishing waits for it. And the page's five parallel card tables - section and search words, icons, names, painters and refresh actions - are one registry, so adding a card is a single entry instead of five edits that could disagree.", ar:"إعادة فتح اللوحة تهبط على «الرئيسية» وحدها. كان العنوان يسجّل القسم الذي تقرأه (?p)، فيعود التطبيق المغلق بعد أيام إلى «الأسواق» أو «الإعدادات»؛ وصار القسم مكانًا تذهب إليه لا ذكرى يحفظها التطبيق لك، فلا يُعاد كتابة العنوان أثناء تنقّلك. والرابط الذي يسمّي قسمًا ما زال يفتحه — اختصارات التطبيق المثبَّت والرابط المشارَك يحملان ?p ويعملان كما كانا — لأن هذا صفحة يسلّمها لك أحدهم، لا ذاكرة للتطبيق. وكبر عقد التخطيط ليطابق ذلك: يثبت الآن أن إعادة التحميل تفتح الرئيسية أيًّا كان القسم الذي تركته، وأن جسم البطاقة يحتفظ بارتفاعه بينما تُحمّل دفعته التالية من البيانات (بانتظار محدود يُحرّر الإطار إذا كان الجديد أقصر فعلًا، فلا تترك البطاقة فراغًا)، وأن ضغط زر المظهر أو تحديث بطاقة أو سهم في التقويم يترك القسم وموضع التمرير كما هما بالضبط. وهذا العقد صار مهمة CI مستقلة، والنشر ينتظرها. وجداول البطاقات الخمسة المتوازية في الصفحة — القسم وكلمات البحث والأيقونات والأسماء والرسّامون وإجراءات التحديث — صارت سجلًا واحدًا، فإضافة بطاقة سطر واحد بدل خمسة تعديلات قد تتناقض."},
{v:"2.21.1", d:"2026-10-17", en:"The scroll behaviour is a test now, not a promise. A small Chromium contract drives the real page and measures what a person notices: turning a card off or moving one keeps the page exactly where it was, the card under a hidden one does not shift, a page that became shorter than your offset clamps instead of jumping to the top, a section change still opens at the top, the phone keeps its section and its side offset, and Today still rests on the month you are in. Writing it shrank the fix: only the document and the phone's pager can ever scroll, so a rebuild no longer tracks containers that cannot move.", ar:"صار سلوك التمرير اختبارًا لا وعدًا. عقد صغير في Chromium يشغّل الصفحة الحقيقية ويقيس ما يلاحظه المستخدم: إيقاف بطاقة أو تحريكها يترك الصفحة في موضعها بالضبط، والبطاقة التي تحت المخفية لا تتزحزح، والصفحة التي قصُرت عن موضع تمريرك تُقصَر بدل أن تقفز إلى الأعلى، وتغيير القسم ما زال يفتح من الأعلى، والهاتف يحفظ قسمه وموضعه الأفقي، وزر «اليوم» ما زال يستقر على الشهر الذي أنت فيه. وكتابة العقد اختصرت الإصلاح: المستند وشريط الأقسام على الهاتف هما الوحيدان القابلان للتمرير، فلم يعد إعادة البناء يتتبّع حاويات لا تتحرك."},
{v:"2.21.0", d:"2026-10-17", en:"The dashboard stopped jumping. Hiding a card, reordering one, switching language or turning a chip off rebuilt every card from scratch, and the page you were reading snapped back to the top each time - the rebuilt list is briefly shorter than the scroll you had, and the browser clamps it. A rebuild now remembers the card under the header and puts it back on the same line, keeps the pager's horizontal position on a phone, and returns to the top only when you actually change section.", ar:"توقّفت اللوحة عن القفز. إخفاء بطاقة أو تغيير ترتيبها أو تبديل اللغة أو إيقاف بطاقة من الإعدادات كان يعيد بناء البطاقات كلها، فيرتدّ ما تقرأه إلى أعلى الصفحة في كل مرة: القائمة تُبنى أقصر من موضع تمريرك لحظةً فيقصّه المتصفح. صار إعادة البناء يتذكّر البطاقة التي تحت الشريط ويعيدها إلى السطر نفسه، ويحفظ موضع التمرير الأفقي على الهاتف، ولا يعود إلى الأعلى إلا عند تغيير القسم فعلًا."},
{v:"2.20.0", d:"2026-10-17", en:"The calendar has a Today button. Flipping back from December used to be a row of clicks on the arrow; one press now returns to the month you are in, and the button greys itself out while that month is already on screen so it never looks like a control that did nothing. It sits beside the month frame, so the arrows stay where they were.", ar:"التقويم صار فيه زر «اليوم». الرجوع من ديسمبر كان يحتاج صفًّا من النقرات على السهم؛ والآن نقرة واحدة تعيدك إلى الشهر الذي أنت فيه، ويبهت الزر عندما يكون هذا الشهر معروضًا أصلًا فلا يبدو زرًّا لم يفعل شيئًا. وموضعه إلى جانب إطار الشهر، فيبقى السهمان كما هما."},
{v:"2.19.1", d:"2026-10-17", en:"The blank page is fixed, and it was ours. The offline worker precached the shell from /index.html, which the host answers with a 308 to /, so the copy it stored was flagged as a redirect - and a browser refuses a redirected response for a navigation, which is why the address opened to an error page while the site itself was answering 200. The worker now copies the shell from / where there is no redirect, refuses to serve a redirected copy even if an older release left one cached, falls back to the network when the cache itself cannot be opened, and takes over at once when it inherits a cache no page can load, so a browser stuck on the old worker repairs itself instead of waiting for someone to clear site data by hand.", ar:"الصفحة البيضاء أُصلحت، والخلل كان منا. عامل العمل دون اتصال يحفظ قوقعة التطبيق من مسار الصفحة الافتراضية الذي يجيبه المضيف بتحويل إلى الجذر، فتُعلَّم النسخة المحفوظة بأنها تحويل — والمتصفح يرفض استجابة محوَّلة لطلب تنقّل، ولهذا كان العنوان يفتح على صفحة خطأ بينما الموقع نفسه يجيب 200. صار العامل ينسخ القوقعة من الجذر حيث لا تحويل، ويرفض تقديم نسخة محوَّلة حتى لو تركها إصدار أقدم في الذاكرة، ويرجع إلى الشبكة حين تتعذر الذاكرة نفسها، ويتولى فورًا إذا ورث ذاكرة لا تُفتح منها أي صفحة، فيُصلح المتصفح نفسه بدل أن ينتظر من يمحو بيانات الموقع يدويًا."},
{v:"2.19.0", d:"2026-10-17", en:"The calendar reads like a printed one. Monday is the first day of the week, so the weekend shares the end of each row, and every row carries its ISO week number in a quiet column on the left - the same number a wall calendar prints beside the row, taken from the week's own Monday rather than counted row by row. The month and year now sit in a fixed frame as wide as the longest month name in the language, with an arrow on each side, so the arrows stay where your finger expects them instead of sliding about as May becomes September.", ar:"التقويم يقرأ كتقويم ورقي: الاثنين أول أيام الأسبوع، فيجتمع نهاية الأسبوع في آخر كل صف، ويحمل كل صف رقم أسبوعه في عمود هادي على اليسار — الرقم نفسه الذي يطبعه التقويم الحائطي إلى جانب الصف، مأخوذًا من يوم الاثنين الخاص بالأسبوع لا من عدّ الصفوف داخل الشهر. والشهر والسنة في إطار ثابت بعرض أطول اسم شهر في اللغة، بشريط سهم على كل جانب، فيبقى السهمان في موضعهما الذي تتوقعه بدل أن يزحفا حين يصير «مايو» «سبتمبر»."},
{v:"2.18.0", d:"2026-10-17", en:"The calendar rings today. Its cell is filled in the accent colour instead of being merely outlined like the other thirty, and it is marked as the current date for a screen reader - keyed to your own local calendar, so after midnight it moves with you rather than with UTC. The Tasks card lists open work only: a finished task used to keep its place in the list until it was deleted, and now it drops out the moment it is ticked, behind a Show completed button that counts what is waiting there. The count sits on the button, so the list never reads as if the completed ones were lost, and hiding them again is the same single tap.", ar:"التقويم يعلّم يوم اليوم. خليته تُملأ بلون التمييز بدل أن تبقى مجرّدة الإطار مثل بقية الخلايا، وتُعلَّم بأنها تاريخ اليوم لقارئ الشاشة — والمفتاح مأخوذ من تقويم جهازك المحلي، فيتحرك معك بعد منتصف الليل لا مع توقيت غرينتش. وبطاقة المهام تعرض المفتوح وحده: المهمة المنجزة كانت تحتفظ بمكانها في القائمة حتى تُحذف، والآن تخرج منها لحظة تعليمها، خلف زر «إظهار المكتملة» يعدّ ما ينتظر هناك. والعدد على الزر نفسه، فلا تبدو القائمة كأنها فقدت المكتملة، وإخفاؤها مرة أخرى بنقرة واحدة."},
{v:"2.17.1", d:"2026-10-17", en:"A refused test reminder says which refusal it was now. The last release taught it to ask the browser before judging; this one separates the answers it was lumping together. A permission the browser reports as not granted is named as blocked, with the host to allow it on, and a browser that never shows a permission prompt at all says exactly that instead of claiming the prompt was dismissed. When the device still refuses to draw the notification, the reason the browser gave stays under the switch - no show event, an error event, or the worker's own refusal - rather than one sentence that read the same however it failed.", ar:"التذكير التجريبي المرفوض يقول الآن أي رفض هو. الإصدار السابق جعل الزر يسأل المتصفح قبل أن يحكم، وهذا الإصدار يفصل بين الأجوبة التي كان يخلطها: إذن يقرّه المتصفح غير ممنوح يُسمّى حظرًا مع اسم المضيف المطلوب السماح له، ومتصفح لا يُظهر طلب الإذن أصلًا يقول ذلك بدل أن يدّعي أن الطلب رُفض. وإذا رفض الجهاز عرض الإشعار، يبقى سبب المتصفح مكتوبًا تحت المفتاح — لا حدث عرض، أو حدث خطأ، أو رفض العامل — بدل جملة واحدة تُقرأ بالشكل نفسه أيًّا كان الخلل."},
{v:"2.17.0", d:"2026-10-17", en:"The free image and video tools move to News, where the rest of the reading lives, and the last tab is just Settings. Settings itself is a stack of six cards now - appearance, review window, cards, reminders, data sources, about - and each opens where it stands instead of scrolling one long column; a shut card still says what is inside it, from the theme in force to whether reminders are armed, and the card you open is the one that is open next time. Cards can carry files as well: PDF, Excel, images, text and scripts, added from the card dialog and counted on the card itself. The bytes go to this browser's own file store rather than the settings record, so the JSON export stays small and nothing is uploaded anywhere; deleting the card deletes its files with it. And the saving is no longer silent: tasks and settings are written on every change, written once more when the page is hidden, and if the browser refuses to save - a full quota, a private window - the page says so instead of forgetting quietly.", ar:"أدوات الصور والفيديو المجانية تنتقل إلى «الأخبار» حيث بقية القراءة، ويصير التبويب الأخير «الإعدادات» وحده. والإعدادات نفسها ستّ بطاقات الآن — الشكل، ونافذة المراجعة، والبطاقات، والتذكيرات، ومصادر البيانات، وحول — وكل واحدة تُفتح في مكانها بدل التمرير في عمود واحد؛ والبطاقة المغلقة تقول ما فيها، من المظهر الفعّال إلى حال التذكيرات، وما تفتحه يبقى مفتوحًا في المرة التالية. ويمكن للبطاقة أن تحمل ملفات أيضًا: PDF وExcel وصورًا ونصوصًا وسكربتات، تُضاف من نافذة البطاقة وتُعدّ على البطاقة نفسها. والملفات تُحفظ في مخزن الملفات الخاص بالمتصفح لا في سجل الإعدادات، فيبقى تصدير JSON صغيرًا ولا يُرفع شيء إلى أي جهة؛ وحذف البطاقة يحذف ملفاتها. والحفظ نفسه لم يعد صامتًا: المهام والإعدادات تُكتب عند كل تغيير، وتُكتب مرة أخرى عند إخفاء الصفحة، وإذا رفض المتصفح الحفظ — حصة ممتلئة أو نافذة خاصة — تقول الصفحة ذلك بدل أن تنسى بهدوء."},
{v:"2.16.0", d:"2026-10-17", en:"The test reminder tells the truth now. Sending one used to answer that notifications were blocked before the browser had ever been asked, because the button read the permission instead of requesting it; it asks on the tap now, so a first run gets the prompt rather than a refusal, and an answer of no names the app and the host and says where to allow them. The reminder section also follows a permission that changes while the page is open, so it stops saying blocked the moment it is not. The test proves the device end first - a notification is drawn here before any push is sent - so \"this phone can show one\" and \"a closed app receives one\" fail and pass separately instead of arriving as one vague failure. Release notes are held to the same rule as every other string: a note missing a language the app offers, or carrying one it does not, now fails the build instead of reading empty for that reader.", ar:"التذكير التجريبي يقول الحقيقة الآن. كان إرساله يجيب بأن الإشعارات محظورة قبل أن يُسأل المتصفح أصلاً، لأن الزر كان يقرأ الإذن بدل أن يطلبه؛ وصار الآن يطلب الإذن عند الضغط، فيحصل التشغيل الأول على السؤال لا على الرفض، وإذا كان الجواب لا فإن الرسالة تسمّي التطبيق والنطاق وتقول من أين يُسمح بها. ويتابع قسم التذكيرات إذناً يتغيّر والصفحة مفتوحة، فيتوقف عن قول «محظورة» في اللحظة التي تكف فيها عن ذلك. ويثبت الاختبار طرف الجهاز أولاً — يُرسم إشعار هنا قبل إرسال أي دفعة — فـ«هذا الهاتف يعرض إشعاراً» و«التطبيق المغلق يستقبل إشعاراً» يفشلان وينجحان منفصلين بدل أن يصلا كفشل واحد غامض. وسجل الإصدارات يخضع للقاعدة نفسها ككل نص آخر: ملاحظة تفتقد لغة يعرضها التطبيق، أو تحمل لغة لا يعرضها، تُفشل البناء الآن بدل أن تُقرأ فراغاً لمن يقرأ بتلك اللغة."},
{v:"2.15.0", d:"2026-10-17", en:"Settings and the generator list stop shouting. Every card in Settings is a chip now, wrapped under the section it lives on, with the section's count beside the heading: a pressed chip is a card on the page, a dashed hollow one is hidden, and the whole Home group fits in two lines instead of seven full-width switch rows. A hidden card keeps its chip - before this, hiding one removed its row, so only Reset layout could bring it back. The free image and video tools are tiles in a grid, grouped by kind, so the kind is read once at the heading rather than repeated on every row, and a tile is just the tool and the figure its vendor states. Both changes are layout only: every setting, every tool and every link does what it did before.", ar:"الإعدادات وقائمة الأدوات تتوقف عن الصراخ. كل بطاقة في الإعدادات صارت شريحة، مجمَّعة تحت القسم الذي تعيش فيه، وبجانب العنوان عدد القسم: الشريحة المضغوطة بطاقة ظاهرة في الصفحة، والمتقطّعة الفارغة مخفية، ومجموعة الرئيسية كلها تتسع في سطرين بدل سبعة صفوف مفاتيح بعرض الكامل. والبطاقة المخفية تحتفظ بشريحتها — قبل ذلك كان إخفاؤها يزيل صفّها، فلا يعيدها إلا زر إعادة الترتيب. وأدوات الصور والفيديو المجانية صارت مربّعات في شبكة، مجمَّعة حسب النوع، فيُقرأ النوع مرة عند العنوان بدل تكراره في كل صف، والمربّع ليس إلا الأداة والرقم الذي يعلنه مزوّدها. والتغييران في الشكل فقط: كل إعداد وكل أداة وكل رابط يعمل كما كان."},
{v:"2.14.0", d:"2026-10-17", en:"The release notes read as cards now. Every version is its own block in the Changelog, newest first, with the version number in the accent colour, the date as a small uppercase eyebrow over a hairline rule, and the release in a line beneath it - so a version can be found and skimmed instead of being scanned out of one long column. Opening a card gives that version the full width: its first sentence set as a standfirst, the rest broken into short paragraphs, with a Back button to the deck and the same Close as before.", ar:"سجل الإصدارات يُقرأ بطاقات الآن. كل إصدار بلوك مستقل في سجل التغييرات، من الأحدث إلى الأقدم، رقم الإصدار بلون التمييز، والتاريخ سطر صغير فوق خط فاصل رفيع، وخلاصة الإصدار تحته — فيمكن العثور على إصدار وتصفحه بدل التفتيش في عمود طويل. وفتح البطاقة يمنح الإصدار العرض الكامل: جملته الأولى بعنوان بارز، وبقية النص فقرات قصيرة، وزر رجوع إلى البطاقات وإغلاق كما كان."},
{v:"2.13.0", d:"2026-10-17", en:"Six sections instead of five, in the order a day is read: Home opens on the clock, the weather, prayer and the quote, then the week's own review, today's tasks and the countdown; the Planner keeps the calendar, the tasks, the board and the countdowns; and a new Routine section holds the focus timer, the habit streaks and the notes. The generator directory moves to Tools, where the rest of the toolbox lives. The review card is named for the window it is showing - This Week over seven days, This Month over thirty - and its timeline now carries the same crosshair as the finance chart, so a pointer over the bars names the day under it and what was closed that day. Settings is grouped the way it is used: appearance, review window, the cards listed by the section they live in, reminders, data sources and about, with one Theme row instead of two and a Reset layout button that brings back this release's arrangement.", ar:"ستة أقسام بدل خمسة، بترتيب يوم يُقرأ: تبدأ الرئيسية بالساعة والطقس والصلاة والاقتباس، ثم مراجعة الأسبوع نفسها، ومهام اليوم، والعدّاد؛ ويحتفظ المخطّط بالتقويم والمهام واللوح والعدّادات؛ ويضم قسم «الروتين» الجديد مؤقّت التركيز ومتتاليات العادات والملاحظات. وينتقل دليل أدوات الإنشاء إلى «الملفات» حيث بقية الأدوات. وتحمل بطاقة المراجعة اسم نافذتها — «هذا الأسبوع» على سبعة أيام و«هذا الشهر» على ثلاثين — ويحمل خطها الزمني المؤشر نفسه الذي يحمله مخطط الأسعار، فيسمّي اليوم الواقع تحته وما أُنجز فيه. وأصبحت الإعدادات مجمّعة كما تُستعمل: الشكل، نافذة المراجعة، البطاقات بحسب القسم، التذكيرات، مصادر البيانات، وحول — بصف واحد للمظهر بدل صفين، وزر إعادة ترتيب يعيد ترتيب هذا الإصدار."},
{v:"2.12.0", d:"2026-10-17", en:"The dashboard opens without a signal now. A versioned service worker keeps the shell - the page, the manifest and the icons - so the installed app starts from the device's own copy, and a line under the header says you are offline instead of leaving you guessing at empty cards. Prices, headlines and prayer times are never cached: a stale number is a lie, so those cards still say plainly that they cannot reach the Worker. Updates never happen underneath you either. Every release installs a new worker that waits, and the page offers Reload, or Later, and the offer stands on the next check. A change to the page alone is caught the same way, by comparing a fresh copy with the cached one. Reminders are unaffected, except that switching them on now says so plainly if the worker cannot install, instead of waiting forever.", ar:"تفتح اللوحة الآن بلا اتصال. عامل خدمة مُصدَّر يحفظ الهيكل — الصفحة وملف التطبيق والأيقونات — فتبدأ النسخة المثبَّتة من نسخة الجهاز نفسه، ويظهر سطر أسفل الترويسة يقول إنك بلا اتصال بدل أن تبقى في حيرة أمام بطاقات فارغة. والأسعار والعناوين ومواقيت الصلاة لا تُحفظ أبداً: رقم قديم كذبة، فتبقى تلك البطاقات تقول بوضوح إنها لا تصل إلى الوركر. والتحديثات لا تحدث تحت يديك أيضاً. كل إصدار ينصّب عاملاً جديداً ينتظر، وتعرض الصفحة إعادة التحميل أو لاحقاً، ويبقى العرض قائماً في الفحص التالي. وتغيير الصفحة وحدها يُلتقط بالطريقة نفسها، بمقارنة نسخة جديدة بالمحفوظة. والتذكيرات لا تتغير، إلا أن تشغيلها يقول الآن بوضوح إن تعذّر تنصيب العامل بدل أن ينتظر بلا نهاية."},
{v:"2.11.0", d:"2026-10-17", en:"A review card on the Planner reads back your week: the share of dated cards you met, the minutes focus actually ran, and the habit days you kept — over seven days or thirty, your pick. One bar per day shows when the cards were closed, so a strong start and a stalled finish read differently instead of averaging into the same figure. It asks nothing new of you: the card is built from the tasks, timer and habits already stored, and it fills in as you work — completion times and real session lengths are recorded from this version on, and completions from before it are counted in the rate and said so plainly instead of being dated to the day they were due.", ar:"بطاقة مراجعة في المخطط تُعيد عليك أسبوعك: نسبة البطاقات المؤرّخة التي أنجزتها، والدقائق التي عملها مؤقّت التركيز فعلاً، وأيام العادات التي حافظت عليها — خلال سبعة أيام أو ثلاثين، كما تختار. عمود واحد لكل يوم يبيّن متى أُغلقت البطاقات، فبداية قوية ونهاية متعثّرة تظهران مختلفتين بدل أن تتوسطا في رقم واحد. ولا تطلب منك شيئًا جديدًا: البطاقة مبنية من المهام والمؤقّت والعادات المخزّنة أصلاً، وتمتلئ مع عملك — تواريخ الإنجاز وأطوال الجلسات الحقيقية تُسجَّل من هذا الإصدار فصاعداً، والإنجازات الأسبق تُحسب في النسبة ويُقال ذلك بوضوح بدل تأريخها ليوم استحقاقها."},
{v:"2.10.0", d:"2026-10-17", en:"Reminders now reach the phone when the app is closed. Switch them on in Settings and pick an hour: the page asks the browser for permission, registers a service worker and a push subscription, and hands the Worker the schedule it needs to keep — the local hour, the timezone and the titles of open cards that carry a due date. A cron tick every fifteen minutes fires on the first tick at or after that hour, in your own timezone, and sends one notification listing what is due today, in English or Arabic. Send a test proves the phone end before you rely on it; turning reminders off deletes the stored record and unsubscribes in the same tap; a 404 or 410 from the push service retires a device that has gone away. The service worker caches nothing, so this changes nothing about how updates arrive.", ar:"التذكيرات تصل الآن إلى الهاتف حتى والتطبيق مغلق. شغّلها من الإعدادات واختر ساعة: تطلب الصفحة إذن المتصفح، وتسجّل عامل خدمة واشتراك دفع، وتُسلّم الوركر الجدولة التي يحتاجها — الساعة المحلية والمنطقة الزمنية وعناوين البطاقات المفتوحة التي لها تاريخ استحقاق. مهمة دورية كل خمس عشرة دقيقة تُطلق عند أول نبضة في تلك الساعة أو بعدها بتوقيتك أنت، وتُرسل إشعارًا واحدًا ببطاقات اليوم، بالعربية أو الإنجليزية. وزر التذكير التجريبي يثبت أن الطرف الآخر يعمل قبل أن تعتمد عليه، وإيقاف التذكيرات يحذف السجل ويلغي الاشتراك في الضغطة نفسها، وردّ الـ 404 أو 410 من خدمة الدفع يتقاعد جهازًا لم يعد موجودًا. وعامل الخدمة لا يخزّن شيئًا، فهو لا يغيّر طريقة وصول التحديثات."},
{v:"2.9.0", d:"2026-10-17", en:"Cards can repeat now — every day, every week or every month — and completing one schedules the next for you, carrying its title, client, priority, project, location and contact details. The successor is always dated in the future, so finishing a week-late card yields tomorrow rather than another overdue one, and one card can only ever have one successor, so re-checking it cannot duplicate work. Undone cards whose date has passed stop ageing quietly: once a day — at load, on returning to the tab, or at local midnight — they move to today and say so with a carried-over count you can see on the card and in the list. The CSV export gained a repeat column.", ar:"البطاقات تتكرر الآن — كل يوم أو كل أسبوع أو كل شهر — وإنهاء بطاقة يجدول التالية لك، مع نقل عنوانها وعميلها وأولويتها ومشروعها وموقعها وبيانات التواصل. البطاقة التالية مؤرَّخة دائمًا في المستقبل، فإتمام بطاقة متأخرة أسبوعًا يعطيك الغد لا بطاقة أخرى متأخرة، ولكل بطاقة خَلَف واحد فقط، فلا يتكرر العمل عند إعادة التأشير. والبطاقات المفتوحة التي مضى موعدها لم تعد تتقادم بصمت: مرة كل يوم — عند التحميل أو العودة إلى التبويب أو منتصف الليل المحلي — تنتقل إلى اليوم وتُعلن ذلك بعدّاد ترحيل تراه على البطاقة وفي القائمة. وتصدير CSV صار يحمل عمود التكرار."},
{v:"2.8.0", d:"2026-10-17", en:"Cards carry a priority — urgent, high, normal or low — and a column now orders itself: cards with a due date come first, earliest first, then the undated ones by priority. The board says which order is active, so a drag onto an exact slot still works when you switch it to Manual. The task's Responsible field is now Client, in the dialog, on the card and in the CSV, which also gained a priority column alongside the renamed one.", ar:"البطاقات صارت تحمل أولوية — عاجلة أو عالية أو عادية أو منخفضة — والعمود يرتّب نفسه: ما له تاريخ استحقاق يأتي أولًا، الأقرب أولًا، ثم ما بلا تاريخ بحسب الأولوية. ويعرض اللوح أي ترتيب فعّال، فيبقى الإفلات في موضع محدّد ممكنًا عند التحويل إلى الترتيب اليدوي. وحقل المسؤول صار العميل في النافذة وعلى البطاقة وفي ملف CSV، وأضيف إلى الملف عمود الأولوية بجانب العمود المُعاد تسميته."},
{v:"2.7.0", d:"2026-10-17", en:"A design and accessibility pass, checked against the Vercel Web Interface Guidelines. The section you are looking at is now in the address bar, so a page can be linked or bookmarked and the back button still behaves. The app title is a real heading, and every icon-only button has an accessible name, with the layout button reporting its pressed state. Dialogs rise and fade into place with the modern display transition, no JavaScript, and they collapse to nothing when the system asks for reduced motion. The page preconnects to its API so the first request is not paying for a fresh connection, and the search box carries spellcheck off, a search keyboard key and its own label.", ar:"مرور على التصميم وسهولة الوصول، مُراجَع مقابل إرشادات واجهة الويب من Vercel. القسم الذي تنظره صار في شريط العنوان، فيمكن ربط صفحة أو حفظها في المفضلة ويبقى زر الرجوع سليمًا. وعنوان التطبيق صار عنوانًا حقيقيًا، ولكل زر أيقوني اسم يقرأه قارئ الشاشة، وزر تعديل التخطيط يعلن حالته. وتنبثق النوافذ وتتلاشى في مكانها بالانتقال الحديث لخاصية العرض، بلا جافاسكربت، وتختفي فورًا حين يطلب النظام تقليل الحركة. والصفحة تتصل مسبقًا بواجهتها فلا تدفع ثمن اتصال جديد عند أول طلب، وصندوق البحث بلا تدقيق إملائي ومع مفتاح بحث في لوحة المفاتيح واسم خاص به."},
{v:"2.6.1", d:"2026-10-17", en:"A kanban card now lands where you let go instead of at the end of the column: while you drag, a line shows the slot it will take, and the column's order is saved with the card, so a reload or a phone restart keeps the arrangement. Keyboard moves still send a card to the end of the next column, and the Tasks list keeps its own order.", ar:"بطاقة كانبان صارت تهبط حيث تُفلتها لا في آخر العمود: أثناء السحب يظهر خط يبيّن الموضع الذي ستأخذه، ويُحفظ ترتيب العمود مع البطاقة، فيبقى الترتيب بعد إعادة التحميل أو إعادة تشغيل الهاتف. أما النقل بلوحة المفاتيح فيرسل البطاقة إلى نهاية العمود التالي، وتبقى قائمة المهام بترتيبها."},
{v:"2.6.0", d:"2026-10-17", en:"Five additions and a design pass. A command palette opens on Ctrl-K or ⌘K: one list that filters every card, every section and your own tasks, notes, habits and countdowns, arrows move and Enter runs, and each action calls the button it mirrors so the palette cannot drift from the UI. A focus timer counts down on a ring from an end timestamp, so a reload or a locked phone cannot lose a session, and it keeps a per-day session count. Habits carry seven day-dots and a streak that survives a missed today. Notes are one-line captures with pin, copy and delete. Weather now leads with what it feels like, humidity, wind, sunrise and sunset, then the next twelve hours as a strip that scrolls inside its own card. And the interface pass: color-scheme so scrollbars and form controls follow the theme, one visible focus ring, a skip link, reduced-motion support, balanced headline wrapping, dialogs that keep their scroll, a skip-to-content link, and small row buttons raised to a 26px hit target. A kanban card is now a record rather than a line of text: Add card opens a dialog with assignee, responsible, start date, due date, project, location, email, phone and a notes box, every card shows its key facts, Enter on a focused card opens the same dialog, and the CSV export gained the matching columns.", ar:"خمس إضافات ومرور على التصميم. لوحة أوامر تُفتح بمفتاح التحكم وحرف الكاف: قائمة واحدة ترشّح كل بطاقة وكل قسم ومهامك وملاحظاتك وعاداتك وعدّاداتك، والأسهم تتحرّك وأدخل ينفّذ، وكل أمر يستدعي الزر نفسه فلا تختلف اللوحة عمّا تراه. ومؤقّت تركيز يعدّ تنازليًا على حلقة من وقت انتهاء محفوظ، فلن يضيع جلسةً تحديث الصفحة ولا قفل الهاتف، ويحفظ عدد جلسات كل يوم. والعادات لها سبع نقاط يومية وسلسلة أيام تبقى حتى لو فاتك اليوم. والملاحظات سطور سريعة مع تثبيت ونسخ وحذف. والطقس يبدأ بالإحساس والرطوبة والريح والشروق والغروب، ثم الساعات الاثنتي عشرة القادمة في شريط يتحرّك داخل بطاقته. ثم مرور على الواجهة: نظام ألوان يجعل الأشرطة والحقول تتبع السمة، وحلقة تركيز واحدة ظاهرة، ورابط تجاوز، ودعم تقليل الحركة، وتوازن العناوين، ونوافذ تحفظ تمريرها، ورابط تجاوز إلى المحتوى، ورفع أزرار الصفوف الصغيرة إلى هدف لمس 26 بكسل. وبطاقة كانبان أصبحت سجلًا لا سطرًا: زر إضافة بطاقة يفتح نافذة تحمل المكلَّف بالتنفيذ والمسؤول وتاريخ البدء وتاريخ الاستحقاق والمشروع والموقع والبريد الإلكتروني ورقم الهاتف وصندوق ملاحظات، وكل بطاقة تعرض أهمّ حقولها، ومفتاح أدخل على البطاقة المركّزة يفتح النافذة نفسها، وتصدير البيانات صار يحمل الأعمدة المطابقة."},
{v:"2.5.0", d:"2026-10-17", en:"A new card this time: the Planner gains a Kanban board — the same tasks list seen as work in progress, To do, Doing and Done, each column counting what it holds, an add row on top, and the done flag still deciding completion, so the board, today's tasks and the CSV export cannot disagree. Moving a card is a drag: pointer events cover mouse, pen and finger — a mouse picks a card up on the first real move, a finger has to rest on it for 180ms first, so a quick swipe across a card still scrolls the page — and once lifted the card follows the pointer through capture, the column beneath marks itself as the drop target, and the page under it is held still. A focused card also answers the arrow keys, direction following the reading direction in Arabic, so the board works with no pointer at all. Every card carries a small ✕ of its own: delete, confirmed like everything else, with the hit area stretched to a thumb-sized 44px. On phones the topbar gains a section progress line in place of the dots — filling 1/5 to 5/5 by distance travelled so the current section stays legible mid-swipe, and naming the section beside the number; the tabs below scroll sideways, keep the active one centred and stand 44px tall, and both the fill and the centring follow the right-to-left strip in Arabic. Also in this release: the ink on every accent fill is black, one label that clears AA on all five accents in all four themes; the light theme's up-figure green and muted ink were darkened to the same measure; the phone top bar reflows into two tidy rows; and Auto theme follows a live OS light/dark switch without a reload.", ar:"بطاقة جديدة هذه المرة: يكسب المخطّط لوحة كانبان — قائمة المهام نفسها معروضة كعمل قيد التقدّم، للتنفيذ وقيد التنفيذ وتم، كل عمود يعدّ ما فيه، وسطر إضافة في الأعلى، ويبقى حقل done هو الفيصل في الإنجاز فلا تختلف اللوحة ولا مهام اليوم ولا تصدير CSV. ونقل البطاقة سحب: أحداث المؤشر تكفي الفأرة والقلم والإصبع — الفأرة ترفع البطاقة عند أول حركة حقيقية، والإصبع يستقر عليها ١٨٠ مللي ثانية أولاً، فتبقى السحبة السريعة عبر البطاقة تمريراً للصفحة — وبعد رفعها تتبع البطاقة المؤشر عبر احتجاز المؤشر، ويعلّم العمود الواقع تحتها نفسه هدفاً للإسقاط، وتُثبَّت الصفحة تحته. والبطاقة المركَّز عليها تجيب أيضاً بمفتاحَي السهمين، والاتجاه يتبع اتجاه القراءة في العربية، فيعمل اللوح بلا مؤشر إطلاقاً. وعلى كل بطاقة زر ✕ صغير خاص بها: حذف مؤكَّد كغيره، ومساحة لمسه ممتدة إلى ٤٤ بكسل بحجم الإصبع. وعلى الهواتف يكسب الشريط العلوي خط تقدّم للأقسام بدل النقاط — يمتلئ من ١/٥ إلى ٥/٥ بمقدار المسافة المقطوعة فيبقى القسم الحالي واضحاً وسط السحبة، ويسمّي القسم إلى جانب الرقم؛ والتبويبات تحته تنزلق أفقياً وتُبقي النشطة في وسطها وترتفع ٤٤ بكسل، والامتلاء والتوسيط كلاهما يتبع الشريط من اليمين إلى اليسار في العربية. وفي هذا الإصدار أيضاً: الحبر على كل تعبئة باللون الأساسي أسود، كلمة واحدة تجتاز AA على الألوان الخمسة في المظاهر الأربعة؛ وأُغمق أخضر الأرقام الصاعدة في المظهر الفاتح وحبره الباهت إلى المعيار نفسه؛ ويعيد شريط الهاتف ترتيب نفسه في سطرين مرتّبين؛ و«التلقائي» يتبع تبديل النظام بين الفاتح والداكن دون إعادة تحميل."},
{v:"2.4.0", d:"2026-10-14", en:"No new card this time — this release is the page and the Worker doing less work for the same result. The clock rebuilt its whole card every second (five elements created and thrown away, plus a fresh date formatter each tick, ~75us of it measured in the browser); it now builds once and writes only the digits that changed, through one cached formatter per language. Every figure in the coin, currency and metals tables went through Number.toLocaleString, which builds a formatter on every call: memoised, the same output costs ~1.1us against ~36us per row, and eastern digits are mapped by code point — 3.4x faster than the string replace, and no allocation. On the API side the Worker hands the edge-cache write to ctx.waitUntil instead of holding the response for it, and serves a cached payload as a stream instead of decoding the JSON to a string and re-encoding it, so neither the write nor a re-encode sits between the request and its bytes.", ar:"لا بطاقة جديدة هذه المرة — هذا الإصدار هو الصفحة والوركر وهما يفعلان عملاً أقل بالنتيجة نفسها. كانت الساعة تعيد بناء بطاقتها كاملة كل ثانية (خمسة عناصر تُنشأ وتُهمل، ومنسّق تاريخ جديد في كل نبضة، نحو ٧٥ ميكروثانية قيست في المتصفح)؛ صارت الآن تُبنى مرة واحدة وتكتب ما تغيّر من الأرقام فقط، عبر منسّق واحد مخزّن لكل لغة. وكل رقم في جداول العملات الرقمية والعملات والمعادن كان يمرّ بـ Number.toLocaleString التي تبني منسّقاً في كل نداء: بعد تخزينه صار المخرج نفسه يكلّف نحو ١٫١ ميكروثانية مقابل نحو ٣٦ لكل سطر، والأرقام الشرقية تُحوَّل بترميز الحرف — أسرع ٣٫٤ مرة من الاستبدال النصي وبلا أي تخصيص ذاكرة. وفي واجهة الوركر يُسلَّم كتابة المخزّن الوسيط إلى ctx.waitUntil بدل تعليق الاستجابة لها، وتُقدَّم الحمولة المخزّنة كتدفق بدل فك ترميز JSON إلى نص وإعادة ترميزه، فلا الكتابة ولا إعادة الترميز تقع بين الطلب وبايتاته."},
{v:"2.3.0", d:"2026-10-14", en:"Coins price in any currency now, not just the dollar: the Time-travel chart's currency list serves both views, so LBP or EUR against BTC is two picks like any pair, and the Worker crosses a coin through its currency's USD leg - the caption says so, and the browser fallback crosses it too when the ECB can. The Currencies card gains LBP, a currency the ECB never publishes, read from the Worker's new /api/rates on the same USD legs; it works as the base of the table as well as a quoted row, rates smaller than a hundredth stay readable instead of rounding to 0, and the rows that come from outside the ECB's table are named under it. In Arabic mode everything the app words itself is Arabic: the quote of the day has its own edition and keeps the same daily quote in either language, metal and prayer names, weather codes, the hijri month, AM/PM, the calendar's weekday initials, the countdown and theme labels and the chart's own notes all follow the language - and the topbar button rebuilds the page, so nothing is left behind in the language it was drawn in.", ar:"العملات الرقمية تُسعَّر الآن بأي عملة لا بالدولار وحده: قائمة عملات مخطط السفر عبر الزمن تخدم العرضين، فاختيار LBP أو EUR مقابل BTC اختياران كأي زوج، ويتقاطع الووركر العملة الرقمية عبر ساق عملتها بالدولار — ويقول التعليق ذلك، ويتقاطعها أيضاً بديل المتصفح حين يستطيع عبر المركزي الأوروبي. وبطاقة العملات تكسب LBP، وهي عملة لا ينشرها المركزي الأوروبي أبداً، مقروءة من /api/rates الجديد في الوركر على ساقَي الدولار نفسيهما؛ وتعمل أساساً للجدول وسطراً معروضاً في الوقت نفسه، والأسعار الأصغر من جزء من المئة تبقى مقروءة بدل أن تُقرَّب إلى صفر، والصفوف الآتية من خارج جدول المركزي الأوروبي يُسمّى مصدرها تحته. وفي الوضع العربي صار كل ما تصوغه اللوحة نفسها عربياً: اقتباس اليوم له نسخته العربية ويبقى الاقتباس نفسه في اللغتين، وتمشي مع اللغة أسماء المعادن والصلوات وأكواد الطقس والشهر الهجري وصباحاً/مساءً وأحرف أيام التقويم ووسوم العدّادات والمظهر وتعليقات المخطط — وزر اللغة في الشريط يعيد بناء الصفحة، فلا يبقى شيء بلغة رُسم بها."},
  {v:"2.2.0", d:"2026-10-14", en:"The Time-travel chart now plots any currency against any other, not only against the base currency in Settings: the FX view carries a base picker of its own beside the symbol picker, so EUR/SAR or AED/PKR is two choices instead of a settings change. When no source names a pair directly, the Worker crosses it through USD — each leg read from the source that actually publishes it, the ECB daily rates or the weekly Yahoo pair — the caption says crossed through USD, and the dates follow the coarser leg so a weekly rate is never restamped onto daily ones.", ar:"مخطط السفر عبر الزمن يرسم الآن أي عملة مقابل أي أخرى، لا مقابل العملة الأساسية في الإعدادات فحسب: أضفنا إلى عرض العملات حقل أساس خاصّ به إلى جانب حقل الرمز، فصارت EUR/SAR أو AED/PKR خيارَين مباشرين لا تغييراً في الإعدادات. وإذا لم يسمّ أي مصدر الزوج مباشرة يتقاطعه الووركر عبر الدولار — يقرأ كل ساق من المصدر الذي ينشرها فعلاً: أسعار البنك المركزي الأوروبي اليومية أو زوج ياهو الأسبوعي — ويقول التعليق متقاطعاً عبر الدولار، وتتبع التواريخ الساق الأبطأ حتى لا تُعاد قيم أسبوعية على تواريخ يومية."},
  {v:"2.1.0", d:"2026-10-14", en:"Free image & video tools: thirteen generators, each showing the free allowance its own vendor states — the number, the unit it counts in (credits, fast tokens, stamina, images) and how often it resets, so \"30 credits a week\" and \"10 images every 3 hours\" stop looking like the same deal. The figures carry the date they were checked and every row opens the vendor's own page. The search box finds them too: it matches word by word instead of demanding the exact phrase, so \"free image tools\" or \"daily limit\" returns each matching tool with its allowance — and any AI headline that states a quota. Also repairs a stray comma that had broken the page script.", ar:"أدوات الصور والفيديو المجانية: ثلاثة عشر مولّداً، لكل منها الحصة المجانية التي يعلنها مزوّدها — الرقم، والوحدة التي يُعدّ بها (أرصدة، توكنات، طاقة، صور)، ودورة تجدّدها، فلا تعود «٣٠ رصيداً أسبوعياً» و«١٠ صور كل ٣ ساعات» يبدوان صفراً واحداً. الأرقام تحمل تاريخ مراجعتها وكل سطر يفتح صفحة المزوّد. وصندوق البحث يعثر عليها أيضاً: صار يطابق كلمة كلمة بدل أن يشترط العبارة كاملة، فـ\"free image tools\" أو \"daily limit\" تُرجع كل أداة مطابقة بحصتها — وأي عنوان يذكر حصته. ويُصلَّح أيضاً فاصلة زائدة كانت أوقفت سكربت الصفحة."},
  {v:"2.0.0", d:"2026-10-12", en:"The Time-travel chart now covers the whole market, not a sample of it: every metal the IMF prices monthly (15 series \u2014 the precious five plus aluminium, nickel, zinc, lead, tin, iron ore, molybdenum, manganese, cobalt and uranium), every currency the ECB publishes (29, plus the regional currencies it never quotes \u2014 SAR, AED, QAR, KWD, OMR, BHD, JOD, EGP, PKR and their neighbours \u2014 served from the weekly Yahoo pair), and any of the 100 largest coins by market cap, each drawn from its own first print. Where a series starts later than 1992 the caption says when: molybdenum from 2010, a Gulf currency from 2003, a coin from its launch day. Copper and cobalt are quoted per pound like the Metals card, everything else in the unit the source states.", ar:"مخطط السفر عبر الزمن يغطي الآن السوق كاملاً وليس عيّنة منه: كل معدن يسعّره صندوق النقد شهرياً (١٥ سلسلة \u2014 المعادن النفيسة الخمسة إضافة إلى الألومنيوم والنيكل والزنك والرصاص والقصدير وخام الحديد والموليبدينوم والمنجنيز والكوبالت واليورانيوم)، وكل عملة ينشرها البنك المركزي الأوروبي (٢٩، مع العملات الخليجية والعربية التي لا ينشرها \u2014 الريال السعودي والدرهم والقطري والدينار الكويتي والعُماني والبحريني والأردني والجنيه المصري والروبية الباكستانية وجيرانها \u2014 من زوج ياهو الأسبوعي)، وأي من أكبر ١٠٠ عملة رقمية من حيث القيمة السوقية، كل واحدة مرسومة من أول تداول لها. وإذا بدأت السلسلة بعد ١٩٩٢ يذكر التعليق متى: الموليبدينوم من ٢٠١٠، وعملة خليجية من ٢٠٠٣، وعملة رقمية من يوم إطلاقها. والنحاس والكوبالت يُعرضان لكل رطل كما في بطاقة المعادن، والباقي بالوحدة التي يذكرها المصدر."},
  {v:"1.9.0", d:"2026-10-12", en:"The Time-travel chart now shows the whole history instead of one year: every currency, metal and coin is drawn from the first date free data exists — metals from 1992 (IMF monthly), currencies from the euro's first day in 1999 (ECB), each coin from its own first print (BTC 2014, ETH/XRP 2017, SOL 2020) — with the source, the exact date range and the number of points printed under the chart. Copper is quoted per pound like the Metals card, a log-scale toggle keeps a 200x run readable, and if the Worker is unreachable the card falls back to the last year of ECB and CoinGecko data and labels that run so a short series is never mistaken for the real one. The caption is explicit when the canvas cannot hold every print: a currency series with 7,140 daily rates says so and reports the 1,400 drawn, and the currency count beside the picker counts only the ones you can choose.", ar:"مخطط السفر عبر الزمن يعرض الآن التاريخ كاملاً بدل سنة واحدة: كل عملة ومعدن وعملة رقمية تُرسم من أول تاريخ تتوفر فيه بيانات مجانية — المعادن من ١٩٩٢ (شهري من صندوق النقد)، العملات من أول يوم لليورو عام ١٩٩٩ (البنك المركزي الأوروبي)، وكل عملة رقمية من أول تداول لها (بتكوين ٢٠١٤، إيثيريوم/ريبيل ٢٠١٧، سولانا ٢٠٢٠) — مع ذكر المصدر والمدى الزمني الدقيق وعدد النقاط أسفل المخطط. والنحاس يُعرض لكل رطل كما في بطاقة المعادن، وزر المقياس اللوغاريتمي يحافظ على وضوح مدى يتغير ٢٠٠ ضعف، وإذا تعذّر الوصول إلى الووركر تعود البطاقة إلى آخر سنة من بيانات المركزي الأوروبي وCoinGecko وتُوسم بذلك حتى لا تُخلط بسلسلة كاملة. ويذكر التعليق بصراحة عندما لا تتسع اللوحة لكل النقاط: سلسلة بعملة تحمل ٧١٤٠ سعراً يومياً تقول ذلك وتذكر ١٤٠٠ مرسومة، وعدد العملات بجانب القائمة يعدّ ما يمكن اختياره فقط."},
  {v:"1.8.0", d:"2026-10-11", en:"The AI card now shows what each free item actually gives you, in one column you can read down: a single parser turns \"50 images per day\", \"600 requests/month\" and \"20 free credits\" into the same shape, so a daily and a monthly allowance sit on one scale — the stated amount, its unit, and the equivalent per-day figure (600 a month reads 20/day). One-off grants stay marked as such instead of pretending to be a daily rate, the exact phrase each figure came from is in the tooltip, and an item that states no allowance shows a dash rather than a guess.", ar:"بطاقة الذكاء الاصطناعي تعرض الآن ما تمنحه كل أداة مجانية فعلاً، في عمود واحد يمكن قراءته من أعلى إلى أسفل: محلّل واحد يحوّل «٥٠ صورة يومياً» و«٦٠٠ طلب شهرياً» و«٢٠ رصيداً مجانياً» إلى الشكل نفسه، فيقف الحد اليومي والشهري على مقياس واحد — الكمية والوحدة ومعادلها اليومي (٦٠٠ شهرياً تُقرأ ٢٠/يوم). والمنح لمرة واحدة تبقى موسومة كذلك بدل أن تُعرض كحد يومي، والصيغة الأصلية لكل رقم في التلميح، والعنصر الذي لا يذكر حصة يظهر بشرطة بدل التخمين."},
  {v:"1.7.0", d:"2026-10-11", en:"The AI card now says why each item is on it: every headline carries small labels naming the ranking rules that matched it — open weights, runs locally, free daily limit, free, just released, image/video — so the order is explained rather than implied. Tap a headline to see the same reasons in the reader. Also fixes the news cache: the four News cards share one stored record, and a card that finished its refresh last could overwrite another card's fresh data, which silently re-enabled refetching on every load.", ar:"بطاقة الذكاء الاصطناعي توضح الآن سبب وجود كل خبر: كل عنوان يحمل وسوماً صغيرة بأسماء قواعد الترتيب التي انطبقت عليه — أوزان مفتوحة، يعمل محلياً، حد يومي مجاني، مجاني، صدر حديثاً، صور/فيديو — فيصبح الترتيب مفسَّراً لا مُخمَّناً. اضغط على العنوان لترى الأسباب نفسها في نافذة القراءة. وأُصلح أيضاً خلل في التخزين المؤقت: البطاقات الأربع تتشارك سجلاً واحداً، وكانت البطاقة التي تنتهي أخيراً تكتب فوق بيانات بطاقة أخرى — وهو ما كان يعطّل التخزين المؤقت بصمت ويعيد جلب الأخبار في كل تحميل."},
  {v:"1.6.3", d:"2026-10-11", en:"If the Worker is unreachable, the AI card no longer falls back to general AI commentary: it reads releases straight from the browser instead — trending open-weight models from Hugging Face and freshly launched free tools from Show HN — and caches them like the other cards.", ar:"إذا تعذر الوصول إلى الووركر، فإن بطاقة الذكاء الاصطناعي لن تعود إلى أخبار عامة، بل تقرأ الإصدارات مباشرة من المتصفح: أحدث النماذج المفتوحة من Hugging Face وأدوات مجانية جديدة من Show HN، وتخزنها مثل باقي البطاقات."},
  {v:"1.6.2", d:"2026-10-11", en:"The AI card is now a releases feed: trending open-weight models from Hugging Face plus Qwen, Ollama, ComfyUI, Replicate, Google AI and a llama.cpp release channel — ranked so new models, free tools and things you can run locally come first, with business and opinion pieces pushed down.", ar:"بطاقة الذكاء الاصطناعي أصبحت قائمة إصدارات: أحدث النماذج المفتوحة من Hugging Face مع Qwen وOllama وComfyUI وReplicate وجوجل وقناة إصدارات llama.cpp — مرتّبة بحيث تأتي النماذج الجديدة والأدوات المجانية وما يمكن تشغيله محلياً أولاً، مع تراجع أخبار الأعمال والآراء."},
  {v:"1.6.1", d:"2026-10-11", en:"Quote of the day now turns over exactly once every 24 hours — by itself, at your local midnight — and no longer depends on when the page was loaded or refreshed. The Worker URL field is now an optional override of the built-in API address instead of a saved copy of it.", ar:"اقتباس اليوم يتغيّر مرة واحدة كل ٢٤ ساعة تلقائياً عند منتصف ليلك المحلي، ولم يعد مرتبطاً بوقت تحميل الصفحة أو تحديثها. وحقل رابط الـWorker أصبح تجاوزاً اختيارياً للعنوان المدمج بدل نسخة محفوظة منه."},
  {v:"1.6.0", d:"2026-10-11", en:"All four News cards fixed: the automotive feeds were dead and the feed parser was dropping CDATA titles, so Automotive, AI, Finance and GitHub now show real headlines — GitHub read straight from api.github.com — on a 1-hour cache with a per-card refresh that really refetches.", ar:"تم إصلاح بطاقات الأخبار الأربع: روابط أخبار السيارات كانت معطلة وكان المحلّل يُسقط عناوين CDATA، والآن تعرض بطاقات السيارات والذكاء الاصطناعي والمال وجيت‌هَب عناوين حقيقية — وجيت‌هَب يُقرأ مباشرة من api.github.com — مع تخزين مؤقت ساعة وتحديث حقيقي لكل بطاقة."},
  {v:"1.5.0", d:"2026-10-11", en:"Dark Grey reworked as the default theme plus two new looks (Midnight, Forest), a selectable background (glow, plain, grid, dots, waves, aurora), and a QR & Share card in Tools: the code fills its frame, and you can save it as an image or share the app via WhatsApp, Instagram, Snapchat, email, copy-link or the native share sheet.", ar:"إعادة تصميم الثيم الرمادي الداكن الافتراضي مع مظهرين جديدين (منتصف الليل، الغابة)، خلفية قابلة للاختيار (توهج، سادة، شبكة، نقاط، موجات، شفق)، وبطاقة رمز QR ومشاركة في الأدوات: الرمز يملأ إطاره، ويمكن حفظه كصورة أو مشاركة التطبيق عبر واتساب وإنستغرام وسناب شات والبريد ونسخ الرابط."},
  {v:"1.4.0", d:"2026-10-11", en:"Dedicated tappable tabs on every screen (swipe still works on iOS), Install-on-Home-Screen + QR code, top-5 metals in two columns (adds Copper), top-8 currencies table, two-column crypto, per-card refresh, moving crosshair on the chart, city remembered until you change it.", ar:"تبويبات قابلة للنقر على جميع الشاشات (السحب يعمل في iOS)، تثبيت على الشاشة الرئيسية + رمز QR، المعادن الخمسة في عمودين (مع النحاس)، جدول أفضل ٨ عملات، العملات الرقمية في عمودين، زر تحديث لكل قسم، مؤشر متحرك على المخطط، المدينة محفوظة حتى تغييرها."},
  {v:"1.3.0", d:"2026-10-11", en:"Metals now take your own API key (BYOK): pick one of 10 price providers and paste a key in Settings — the key stays in this browser only.", ar:"المعادن الآن تدعم مفتاحك الخاص (BYOK): اختر أحد ١٠ مزوّدي أسعار وألصق المفتاح في الإعدادات — يبقى المفتاح في هذا المتصفح فقط."},
  {v:"1.2.0", d:"2026-10-11", en:"Desktop gets a dedicated tab bar: one section at a time instead of one long scrolling page. Mobile keeps swipeable pages with dots.", ar:"إضافة شريط تبويبات مخصص لسطح المكتب: قسم واحد في كل مرة بدلاً من التمرير الطويل. الجوال يبقى بتنقل قابل للسحب."},
  {v:"1.1.0", d:"2026-10-11", en:"Stylish refresh (glassy cards, icons, glow) + iPhone-style jiggle and drag to reorder via long-press or pencil button.", ar:"تحديث جمالي (بطاقات زجاجية وأيقونات) + اهتزاز وسحب لإعادة الترتيب مثل الآيفون عبر الضغطة المطولة أو زر القلم."},
  {v:"1.0.0", d:"2026-10-10", en:"First release: 5 pages, live weather/crypto/FX/metals*, 8 headlines, prayer times, countdowns, tasks, local calendar, search, EN/AR, export/import. *Metals needs Worker URL + secret.", ar:"الإصدار الأول: ٥ صفحات، طقس وأسعار حية، ٨ عناوين، مواقيت صلاة، عدّادات، مهام، تقويم محلي، بحث، عربي/إنجليزي، تصدير/استيراد. *المعادن تحتاج Worker."}
];
